    <style>
:root { --accent-1: #a78bfa; --accent-2: #f472b6; --bg: #0d0f14; --err: #f85149; --ok: #3fb950; }
body { background: var(--bg); color: #fff; font-family: 'Quicksand', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .orbitron { font-family: 'Quicksand', sans-serif; font-weight:700; text-transform: uppercase; letter-spacing: 2px; font-size: 10px; }

.glass-card {
    background: rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(40px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-top: 1px solid rgba(167, 139, 250, 0.3);
    transition: all 0.5s ease;
}
         .input-node {
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 6px 12px;
    border-radius: 12px;
    outline: none;
    color: white;
    transition: 0.3s;
         }
 .input-node:focus { border-color: var(--accent-1); box-shadow: 0 0 15px rgba(167, 139, 250, 0.15); }
 .input-node.is-invalid { border-color: var(--err); box-shadow: 0 0 12px rgba(248, 81, 73, 0.15); }
 .input-node.is-valid { border-color: var(--ok); }

 .field-error {
    display: block;
    font-size: 11px;
    color: var(--err);
    margin: 4px 2px 0 4px;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.25s ease, opacity 0.25s ease;
 }
 .field-error.show { max-height: 30px; opacity: 1; }

.resend-btn-neon {
    background: transparent !important;
    border: 1px solid var(--accent-1) !important;
    color: var(--accent-1) !important;
    box-shadow: 0 0 15px rgba(167, 139, 250, 0.3);
    font-family: 'Quicksand', sans-serif !important;
    font-weight: 700 !important;
    font-size: 11px !important;
    padding: 16px 40px !important;
    border-radius: 20px !important;
    transition: 0.4s !important;
    letter-spacing: 2px;
}
.resend-btn-neon:hover { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)) !important; color: #0d0f14 !important; box-shadow: 0 0 30px var(--accent-1); }

        /* GITHUB STYLE NOTIFICATION BAR */

    position: fixed;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 450px;

}

#notification-bar.show { top: 20px; }

.close-notif { cursor: pointer; font-weight: bold; font-size: 18px; margin-left: 15px; }

  /* SYNERGY PROTOCOL - GLOBAL BACKGROUND ENGINE */
body {
    margin: 0;
    padding: 0;

    background-color: #0d0f14;

}

/* EXACT PHOTO HEADER - ACCENT COLORS MAINTAINED */

    width: calc(100% + 3rem);
   margin: -1.5rem -1.5rem 0 -1.5rem;

}
</style>

<body>
<div id="notification-bar">

</div>

 <div id="main-register-card" class="glass-card p-4 rounded-[32px] w-full max-w-md mx-4 relative z-10 overflow-hidden">
    <!-- SABUWAR HEADER IRIN TA PHOTO TARE DA COLOURS DIN ZYNTA -->
    <div class="exact-photo-header">
        <svg viewBox="0 0 500 150" preserveAspectRatio="none">
            <path d="M0,0 L500,0 L500,40 C350,150 200,30 0,100 Z" fill="var(--accent-1)" opacity="0.25"></path>
            <path d="M0,0 L500,0 L500,25 C320,130 180,10 0,80 Z" fill="var(--accent-2)" opacity="0.6"></path>
            <path d="M0,0 C150,90 350,-40 500,60 L500,0 Z" fill="var(--accent-1)" opacity="0.8"></path>
        </svg>
    </div>

    <div class="mb-1 text-center" style="margin-top:-14px;">
        <h1 style="font-family: 'Quicksand', sans-serif !important; font-weight:700; letter-spacing: -0.5px;"
            class="text-[24px] font-bold text-white mb-1">
            Register<span style="color:var(--accent-1);">.</span>
        </h1>
        <p id="progress-text"
           style="font-family: 'Quicksand', sans-serif !important; letter-spacing: -0.01em; color: var(--accent-1);"
           class="text-[13px] font-bold">
            Create your account. It's free and only takes a minute.
        </p>
    </div>

    <div id="form-content" class="space-y-2.5">
        <div>
            <label class="orbitron text-gray-500 ml-1 mb-1 block">Full Name</label>
            <input type="text" id="full-name" oninput="validateForm()" onblur="markTouched('full-name')" class="input-node">
            <span class="field-error" id="full-name-error">Enter your first and last name.</span>
        </div>
        <div>
            <label class="orbitron text-gray-500 ml-1 mb-1 block">Email Address</label>
            <input type="email" id="email" oninput="validateForm()" onblur="markTouched('email')" class="input-node">
            <span class="field-error" id="email-error">Enter a valid email address.</span>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="orbitron text-gray-500 ml-1 mb-1 block">Username</label>
                <input type="text" id="username" oninput="validateForm()" onblur="markTouched('username')" class="input-node">
                <span class="field-error" id="username-error">3-20 letters, numbers or _</span>
            </div>
            <div>
                <label class="orbitron text-gray-500 ml-1 mb-1 block">State</label>
                <input type="text" id="state" oninput="validateForm()" onblur="markTouched('state')" class="input-node">
                <span class="field-error" id="state-error">Enter your state.</span>
            </div>
        </div>

        <div>
            <label class="orbitron text-gray-500 ml-1 mb-1 block">WhatsApp Number</label>
            <input type="tel" id="phone" oninput="validateForm()" onblur="markTouched('phone')" class="input-node" placeholder="0801 234 5678">
            <span class="field-error" id="phone-error">Enter a valid Nigerian WhatsApp number.</span>
        </div>
        <div>
            <label class="orbitron text-gray-500 ml-1 mb-1 block">Password</label>
            <input type="password" id="password" oninput="validateForm()" onblur="markTouched('password')" class="input-node">
            <span class="field-error" id="password-error">At least 6 characters.</span>
        </div>

        <button id="reg-btn" onclick="register()" disabled class="w-full bg-white text-black py-4 rounded-2xl font-bold orbitron mt-2 opacity-20 cursor-not-allowed transition-all duration-500">SIGN UP</button>
    </div>

    <p style="font-family: 'Quicksand', sans-serif !important; letter-spacing: -0.01em;"
       class="text-[13px] text-gray-500 text-center mt-3">
        Already have an account?
        <a href="signin.html" style="color:var(--accent-1);" class="font-bold hover:underline">Sign In</a>
    </p>

    <script>
    // 1. Bayanan Hadin Gwiwa (Firebase Configuration)
    const firebaseConfig = {
        apiKey: "AIzaSyDLTwLq8Le9vYAwRkRcqXPGxFnEqW1yE2E",
        authDomain: "synergy-protocol.firebaseapp.com",
        projectId: "synergy-protocol",
        databaseURL: "https://synergy-protocol-default-rtdb.firebaseio.com"
    };

    // 2. Tada Tsarin (Initialize Firebase)
    const app = firebase.initializeApp(firebaseConfig);

    firebase.firestore(app).settings({
        experimentalForceLongPolling: true,
        cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED
    });

    // 3. Saita Manhajoji (Initialize Services)
    const db = firebase.firestore();
    const database = firebase.database();
    const auth = firebase.auth();

    // 4. Saita Timer (Global Variables)
    let checkInterval = null;
    let registeredUsername = null; // used by the verification listener to flip isVerified

    // 5. Neman Referrer (Helper Function)
    function getReferrerFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get('ref') || "admin";
    }

    // ============================================================
    // VALIDATION ENGINE
    // Every field has ONE rule, checked the same way at every stage
    // (live typing, blur, and final submit) so what the user sees
    // is always what actually gets checked.
    // ============================================================
    function normalizePhone(raw) {
        // Strip everything except digits, then normalize to 234XXXXXXXXXX
        let digits = raw.replace(/\D/g, '');
        if (digits.startsWith('234')) {
            return digits;
        }
        if (digits.startsWith('0')) {
            return '234' + digits.substring(1);
        }
        return '234' + digits;
    }

    function getFieldValidity() {
        const fullName = document.getElementById('full-name').value.trim();
        const email = document.getElementById('email').value.trim();
        const user = document.getElementById('username').value.trim().toLowerCase();
        const state = document.getElementById('state').value.trim();
        const rawPhone = document.getElementById('phone').value.trim();
        const pass = document.getElementById('password').value.trim();
        const formattedPhone = normalizePhone(rawPhone);

        const nameParts = fullName.split(/\s+/).filter(Boolean);
        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        const usernameOk = /^[a-z0-9_]{3,20}$/.test(user);
        const phoneOk = formattedPhone.length === 13 && formattedPhone.startsWith('234');

        return {
            values: { fullName, email, user, state, rawPhone, formattedPhone, pass },
            valid: {
                'full-name': nameParts.length >= 2 && nameParts.every(p => p.length >= 2),
                'email': emailOk,
                'username': usernameOk,
                'state': state.length >= 3,
                'phone': phoneOk,
                'password': pass.length >= 6
            }
        };
    }

    function markTouched(fieldId) {
        document.getElementById(fieldId).dataset.touched = "1";
        validateForm();
    }

    function validateForm() {
        const { valid } = getFieldValidity();
        let completed = 0;

        Object.keys(valid).forEach(fieldId => {
            const input = document.getElementById(fieldId);
            const errorEl = document.getElementById(fieldId + '-error');
            const isValid = valid[fieldId];
            const touched = input.dataset.touched === "1" || input.value.trim().length > 0;

            if (isValid) completed++;

            input.classList.toggle('is-valid', isValid && input.value.trim().length > 0);
            input.classList.toggle('is-invalid', !isValid && touched);
            if (errorEl) errorEl.classList.toggle('show', !isValid && touched);
        });

        const allValid = Object.values(valid).every(v => v);
        const btn = document.getElementById('reg-btn');
        btn.disabled = !allValid;
        btn.style.opacity = allValid ? "1" : "0.4";
        btn.classList.toggle('cursor-not-allowed', !allValid);

        document.getElementById('progress-text').innerText =
            allValid ? "Ready to launch." : `Initialize Sequence: ${Math.round((completed / 6) * 100)}%`;

        return allValid;
    }

    // Function na nuna sanarwa a sama (GitHub Style)
    function showTopNotif(message, type) {
        const bar = document.getElementById('notification-bar');
        const msg = document.getElementById('notif-message');

        bar.className = (type === 'success') ? 'notif-success show' : 'notif-error show';
        msg.innerText = message;

        setTimeout(closeNotif, 5000);
    }

    function closeNotif() {
        document.getElementById('notification-bar').classList.remove('show');
    }

    // RESEND FUNCTION
    async function resendVerification() {
        try {
            const fbUser = firebase.auth().currentUser;
            if (fbUser) {
                await fbUser.sendEmailVerification();
                showTopNotif("Your verification link has been resent", "success");
            }
        } catch (err) {
            showTopNotif("Security protocol active. Please wait a moment.", "error");
        }
    }

    // ============================================================
    // FINISH REGISTRATION — shared by both a brand-new signup AND a
    // "resume" (someone coming back to an unverified account).
    // Uses atomic transactions to CLAIM the username and phone, exactly
    // like large platforms reserve handles — no read-then-write race.
    // If a fbUser already has a completed profile (uid_username exists),
    // this just resends the verification link instead of re-registering.
    // ============================================================
    async function finishRegistrationAndShowSuccess(fbUser, values) {
        const { fullName, email, user, state, formattedPhone } = values;
        const referrer = getReferrerFromURL();

        const existingLink = await database.ref('uid_username/' + fbUser.uid).get();

        if (existingLink.exists()) {
            // This account already has a completed profile — just resend the link.
            registeredUsername = existingLink.val();
        } else {
            // Claim the username atomically (fails cleanly if just taken).
            const usernameResult = await database.ref('users/' + user).transaction(current => {
                if (current !== null) return; // abort — already claimed
                return {
                    uid: fbUser.uid,
                    fullName: fullName,
                    email: email,
                    username: user,
                    state: state,
                    whatsapp: formattedPhone,
                    isVerified: false,
                    referredBy: referrer,
                    last_update: new Date().toISOString()
                };
            });
            if (!usernameResult.committed) {
                throw { code: "custom/username-taken" };
            }

            // Claim the phone number atomically.
            const phoneResult = await database.ref('phone_index/' + formattedPhone).transaction(current => {
                if (current !== null) return; // abort — already claimed
                return user;
            });
            if (!phoneResult.committed) {
                // Release the username claim we just made so it isn't stuck forever.
                await database.ref('users/' + user).remove().catch(() => {});
                throw { code: "custom/phone-taken" };
            }

            try {
                await database.ref().update({
                    ['usernames/' + user]: fbUser.uid,
                    ['uid_username/' + fbUser.uid]: user
                });
            } catch (linkErr) {
                // Release both claims so a retry isn't blocked by our own half-written data.
                await database.ref('users/' + user).remove().catch(() => {});
                await database.ref('phone_index/' + formattedPhone).remove().catch(() => {});
                throw linkErr;
            }

            db.collection("users").doc(user).set({
                uid: fbUser.uid,
                fullName: fullName,
                email: email,
                username: user,
                state: state,
                whatsapp: formattedPhone,
                isVerified: false,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                referredBy: referrer
            }).catch(err => console.log("Firestore background save:", err));

            registeredUsername = user;
        }

        // A failed send here is recoverable via the RESEND LINK button — never fatal.
        try {
            await fbUser.sendEmailVerification();
        } catch (verifyErr) {
            console.warn("Verification email failed to send, user can resend:", verifyErr);
        }

        document.getElementById('main-register-card').style.display = 'none';
        showSuccessOverlay(email);
    }

    // Shown when the typed email already belongs to someone and the typed
    // password doesn't match — instead of a dead end, offer a reset link
    // so the person can regain access and finish verifying, no matter how
    // long ago they first tried.
    function promptPasswordReset(email) {
        Swal.fire({
            html: `
                <div class="flex flex-col items-center">
                    <h2 class="orbitron text-white text-lg mb-4">ACCOUNT ALREADY EXISTS</h2>
                    <p style="font-family:'Quicksand',sans-serif; font-size:14px; color:#ccc;">
                        An account with <b style="color:#a78bfa;">${email}</b> already exists but the password
                        you entered doesn't match. If this is your account, reset your password to regain access
                        and finish verifying your email.
                    </p>
                </div>`,
            background: '#0d0f14',
            showConfirmButton: true,
            confirmButtonText: 'SEND RESET LINK',
            showCancelButton: true,
            cancelButtonText: 'CANCEL',
            customClass: { popup: 'rounded-[35px] border border-[#a78bfa]/30 shadow-2xl', confirmButton: 'resend-btn-neon orbitron' }
        }).then(async (result) => {
            if (result.isConfirmed) {
                try {
                    await auth.sendPasswordResetEmail(email);
                    showTopNotif("Password reset link sent to " + email, "success");
                } catch (err) {
                    showTopNotif("Couldn't send reset link. Please try again shortly.", "error");
                }
            }
        });
    }

    // REGISTER FUNCTION
    // 1) Try to create a brand-new Auth account.
    // 2) If the email is genuinely new, claim username + phone atomically,
    //    write the profile, and show success — only after everything committed.
    // 3) If the email already exists (auth/email-already-in-use), don't dead-end:
    //    try signing in with what was typed. If it matches and the account is
    //    still unverified, RESUME registration for that same account instead
    //    of blocking the person forever. If the password doesn't match, offer
    //    a password-reset path. If it's already verified, send them to sign in.
    // 4) Anything that fails after a brand-new account was created rolls that
    //    account back (deleted) so the email is never permanently stuck.
    async function register() {
        if (!validateForm()) {
            showTopNotif("Please fix the highlighted fields.", "error");
            return;
        }

        const btn = document.getElementById('reg-btn');
        const { values } = getFieldValidity();
        const { email, pass } = values;

        btn.disabled = true;
        btn.innerHTML = `<span class="orbitron animate-pulse">CONNECTING...</span>`;

        let brandNewUser = null;

        try {
            const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
            brandNewUser = userCredential.user;
            await finishRegistrationAndShowSuccess(brandNewUser, values);
            return;

        } catch (e) {
            if (e.code === "auth/email-already-in-use") {
                try {
                    const signInResult = await auth.signInWithEmailAndPassword(email, pass);
                    const existingUser = signInResult.user;
                    await existingUser.reload();

                    if (existingUser.emailVerified) {
                        showTopNotif("This email is already verified. Please sign in.", "error");
                        setTimeout(() => { window.location.href = "signin.html"; }, 1800);
                        return;
                    }

                    // Same person, unverified — resume instead of blocking them.
                    await finishRegistrationAndShowSuccess(existingUser, values);
                    return;

                } catch (resumeErr) {
                    if (resumeErr.code === "auth/wrong-password" || resumeErr.code === "auth/invalid-credential" || resumeErr.code === "auth/invalid-login-credentials") {
                        promptPasswordReset(email);
                        btn.disabled = false;
                        btn.innerText = "SIGN UP";
                        validateForm();
                        return;
                    }
                    console.error("Resume registration error:", resumeErr);
                    // fall through to generic error handling below
                    e = resumeErr;
                }
            }

            console.error("Registration Error:", e);

            // Only roll back if a BRAND-NEW account was created this attempt —
            // never delete an account we merely signed into during a resume.
            if (brandNewUser) {
                try { await brandNewUser.delete(); } catch (delErr) { console.error("Rollback delete failed:", delErr); }
            }

            let friendlyMessage = "Something went wrong. Please try again.";

            if (e.code === "custom/username-taken") {
                friendlyMessage = "This username isn't available. Please choose another.";
            } else if (e.code === "custom/phone-taken") {
                friendlyMessage = "This WhatsApp number is already in use.";
            } else if (e.code === "auth/invalid-email") {
                friendlyMessage = "Please enter a valid email address.";
            } else if (e.code === "auth/weak-password") {
                friendlyMessage = "Password is too weak. Use at least 6 characters.";
            } else if (e.code === "auth/network-request-failed") {
                friendlyMessage = "Network error. Please check your connection.";
            } else if (e.code === "permission-denied" || e.code === "PERMISSION_DENIED") {
                friendlyMessage = "Server denied the request. Please contact support.";
            } else if (e.message) {
                friendlyMessage = e.message;
            }

            showTopNotif(friendlyMessage, "error");
            btn.disabled = false;
            btn.innerText = "RETRY";
            validateForm();
        }
    }

    function showSuccessOverlay(email) {
        startVerificationListener();

        Swal.fire({
            html: `
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full mb-6" style="background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); box-shadow:0 0 20px rgba(167,139,250,0.5);"></div>
                    <h2 class="orbitron text-white text-xl mb-6">REGISTRATION SUCCESSFUL</h2>
                    <div style="background: rgba(255,255,255,0.03); padding: 25px; border-radius: 20px; border: 1px dashed rgba(167,139,250,0.3); width: 100%; color: #fff;">
                        <p style="font-family: 'Quicksand', sans-serif; font-size: 15px;">Email sent to <b style="color:#a78bfa;">${email}</b>. Verify to proceed.</p>
                        <p class="animate-pulse" style="font-size: 11px; color: #3fb950; margin-top: 10px; font-family: 'Quicksand', sans-serif; font-weight:700;">Waiting for verification...</p>
                    </div>
                </div>`,
            background: '#0d0f14',
            showConfirmButton: true,
            confirmButtonText: 'RESEND LINK',
            allowOutsideClick: false,
            customClass: {
                popup: 'rounded-[35px] border border-[#a78bfa]/30 shadow-2xl',
                confirmButton: 'resend-btn-neon orbitron'
            }
        }).then((result) => {
            if (result.isConfirmed) {
                resendVerification();
                showSuccessOverlay(email);
            }
        });
    }

    function startVerificationListener() {
        if (checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(async () => {
            const currentUser = firebase.auth().currentUser;
            if (currentUser) {
                await currentUser.reload();
                if (currentUser.emailVerified) {
                    clearInterval(checkInterval);

                    // Flip isVerified in both stores now that it's actually true
                    if (registeredUsername) {
                        database.ref('users/' + registeredUsername + '/isVerified').set(true).catch(err => console.log(err));
                        db.collection('users').doc(registeredUsername).update({ isVerified: true }).catch(err => console.log(err));
                    }

                    showTopNotif("Security Verified! Redirecting...", "success");
                    setTimeout(() => { window.location.href = "signin.html"; }, 1500);
                }
            }
        }, 3000);
    }
    </script>
 </div>
