<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus - Neural Story Matrix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="status.css">
</head>
<body>
    <div id="page-content">

    <div class="story-matrix-container" id="matrixContainer">
        <div class="ambient-projector" id="ambientProjector"></div>
        <div class="scan-overlay"></div>

        <div class="hud-progress-timeline" id="hudTimeline"></div>

        <div class="hud-header">
            <div class="cyber-user-node">
                <div class="avatar-ring-status">
                    <img src="" id="hudAvatar">
                </div>
                <div class="node-meta">
                    <h2 id="hudUsername">System Booting...</h2>
                    <span class="story-time" id="hudTimeLabel">1h ago</span>
                </div>
            </div>
            <div class="hud-action-node owner-delete-btn" id="ownerDeleteBtn" style="display:none;" onclick="deleteCurrentSlide()" title="Delete this status">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>
            </div>
        </div>

        <div class="cyber-touch-grids">
            <div class="grid-left" id="touchLeft"></div>
            <div class="grid-right" id="touchRight"></div>
        </div>

        <div class="viewport-canvas" id="viewportCanvas">
            <img src="" class="matrix-media-frame" id="matrixMedia">
            <div class="double-tap-heart" id="doubleTapHeart">❤️</div>
        </div>

        <div class="reaction-strip" id="reactionStrip">
            <span onclick="sendReaction('❤️')">❤️</span><span onclick="sendReaction('😂')">😂</span>
            <span onclick="sendReaction('😮')">😮</span><span onclick="sendReaction('😢')">😢</span>
            <span onclick="sendReaction('🔥')">🔥</span><span onclick="sendReaction('👏')">👏</span>
        </div>

        <div class="viewers-strip" id="viewersStrip" style="display:none;" onclick="openViewersSheet()">
            <div class="vs-avatars" id="viewersStripAvatars"></div>
            <span id="viewersStripCount">0 views</span>
        </div>

        <div class="hud-footer-capsule" id="footerCapsule">
            <div class="hud-action-node" id="ghostNode" onclick="toggleGhostInfiltration()" title="Ghost Mode (Incognito View)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </div>

            <div class="hud-action-node tip-btn" onclick="triggerSynergyTip()" title="Tip Synergy Token">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--magenta-neon)" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div>

            <textarea class="cyber-input" id="replyInput" placeholder="Type a message..." rows="1"></textarea>

            <div class="hud-action-node" id="aiEnhanceBtn" onclick="enhanceWithAI()" title="AI Story Enhancer">✨</div>
            <div class="hud-action-node" id="duetBtn" onclick="startDuetRecording()" title="Story Duet">🎬</div>

            <div class="hud-action-node share-btn" onclick="shareToMyStatus()" title="Share to My Status">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00F2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/>
                </svg>
            </div>

            <div class="hud-action-node" onclick="executeMediaDownload()" title="Download Status to Storage">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            </div>
        </div>
    </div>

    <div class="viewers-sheet-overlay" id="viewersSheetOverlay" onclick="closeViewersSheet()">
        <div class="vsheet-panel" onclick="event.stopPropagation()">
            <h3 id="vsheetTitle">Viewed by</h3>
            <div id="vsheetBody"></div>
        </div>
    </div>

    <div class="nx-toast-status" id="nxToastStatus"></div>

    </div>

<script src="router.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="status.js"></script>

</body>
</html>
