<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>New Channel - Nexus</title>
<style>
    :root {
        --cyan-neon: #00F2FF;
        --magenta-neon: #FF0055;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
        background-color: #050505;
        color: #fff;
        min-height: 100vh;
        padding-bottom: 40px;
    }
    header { padding: 12px 16px 8px 16px; display: flex; align-items: center; gap: 14px; }
    .back-trigger { cursor: pointer; display: flex; align-items: center; }
    header h1 { font-size: 19px; font-weight: 700; }

    .photo-picker-wrap { display: flex; justify-content: center; padding: 18px 0 10px 0; }
    .photo-picker {
        width: 96px; height: 96px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(0,242,255,0.12), rgba(255,0,85,0.12));
        border: 1.5px dashed rgba(0,242,255,0.4);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        flex-direction: column;
        gap: 4px;
    }
    .photo-picker span { font-size: 11px; color: rgba(255,255,255,0.5); }

    .field-group { padding: 10px 16px 0 16px; }
    .field-input {
        width: 100%;
        background: rgba(255,255,255,0.06);
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
        color: #fff;
        font-size: 15px;
        outline: none;
        resize: none;
        font-family: inherit;
    }
    .field-input:focus { box-shadow: 0 0 0 1.5px var(--cyan-neon); }
    .field-input::placeholder { color: rgba(255,255,255,0.4); }
    .char-count { text-align: right; font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 4px; padding-right: 2px; }

    .section-label {
        padding: 18px 16px 6px 16px;
        font-size: 13px;
        font-weight: 600;
        color: var(--cyan-neon);
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }

    .privacy-row {
        display: flex; align-items: center; gap: 14px;
        padding: 10px 16px;
        cursor: pointer;
    }
    .privacy-row:active { background: rgba(255,255,255,0.04); }
    .privacy-icon {
        width: 40px; height: 40px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        background: rgba(255,255,255,0.06);
    }
    .privacy-text { flex: 1; }
    .privacy-text h3 { font-size: 15px; font-weight: 500; }
    .privacy-text p { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 1px; }
    .radio-dot {
        width: 20px; height: 20px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.3);
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
    }
    .radio-dot.checked { border-color: var(--cyan-neon); }
    .radio-dot.checked::after {
        content: '';
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--cyan-neon);
    }

    .create-btn-wrap { padding: 26px 16px 0 16px; }
    .create-btn {
        width: 100%;
        text-align: center;
        padding: 14px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--cyan-neon), var(--magenta-neon));
        color: #050505;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
    }
    .create-btn.disabled { opacity: 0.35; pointer-events: none; }
</style>
</head>
<body>

    <header>
        <div class="back-trigger" onclick="window.location.href='chats.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M11 17l-5-5 5-5M18 12H6"/></svg>
        </div>
        <h1>New Channel</h1>
    </header>

    <div class="photo-picker-wrap">
        <div class="photo-picker" onclick="alert('Photo picker')">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--cyan-neon)" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <span>Add Photo</span>
        </div>
    </div>

    <div class="field-group">
        <input type="text" class="field-input" id="channelName" placeholder="Channel name" maxlength="30" oninput="updateCounts(); validateForm();">
        <div class="char-count"><span id="nameCount">0</span>/30</div>
    </div>

    <div class="field-group">
        <textarea class="field-input" id="channelDesc" placeholder="Description (optional)" rows="3" maxlength="120" oninput="updateCounts();"></textarea>
        <div class="char-count"><span id="descCount">0</span>/120</div>
    </div>

    <div class="section-label">Channel Type</div>

    <div class="privacy-row" onclick="setPrivacy('public')">
        <div class="privacy-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </div>
        <div class="privacy-text">
            <h3>Public Channel</h3>
            <p>Anyone can find and join via link or search</p>
        </div>
        <div class="radio-dot checked" id="radioPublic"></div>
    </div>

    <div class="privacy-row" onclick="setPrivacy('private')">
        <div class="privacy-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div class="privacy-text">
            <h3>Private Channel</h3>
            <p>Only people with an invite link can join</p>
        </div>
        <div class="radio-dot" id="radioPrivate"></div>
    </div>

    <div class="create-btn-wrap">
        <div class="create-btn disabled" id="createBtn" onclick="createChannel()">Create Channel</div>
    </div>

<script>
    let selectedPrivacy = 'public';

    function updateCounts() {
        document.getElementById('nameCount').textContent = document.getElementById('channelName').value.length;
        document.getElementById('descCount').textContent = document.getElementById('channelDesc').value.length;
    }

    function setPrivacy(type) {
        selectedPrivacy = type;
        document.getElementById('radioPublic').classList.toggle('checked', type === 'public');
        document.getElementById('radioPrivate').classList.toggle('checked', type === 'private');
    }

    function validateForm() {
        const name = document.getElementById('channelName').value.trim();
        document.getElementById('createBtn').classList.toggle('disabled', name.length === 0);
    }

    function createChannel() {
        const name = document.getElementById('channelName').value.trim();
        const desc = document.getElementById('channelDesc').value.trim();
        if (!name) return;
        const channelData = {
            id: 'ch_' + Date.now(),
            name: name,
            description: desc,
            privacy: selectedPrivacy,
            subscriberCount: 1,
            verified: false,
            createdAt: Date.now()
        };
        sessionStorage.setItem('newChannelData', JSON.stringify(channelData));
        window.location.href = 'channel-view.html?new=1';
    }
</script>

</body>
              </html>
