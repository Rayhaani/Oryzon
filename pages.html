<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Anti-flash: if this is a real page (?page=slug), set a class on
        // <html> IMMEDIATELY, before the browser even starts parsing <body>.
        // The CSS below keeps the header title hidden until real Firestore
        // data arrives, so nothing flashes on screen before the page loads.
        if (new URLSearchParams(location.search).get('page')) {
            document.documentElement.classList.add('pg-loading');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Nexus — Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS din wannan page an fitar da shi zuwa pages.css domin SPA
         navigation (router.js) tana canza #page-content kadai — <style>
         a cikin <head> na wata page ba ya tafiya tare da ita idan an
         bude ta ta hanyar fetch + innerHTML swap daga wata page. -->
    <link rel="stylesheet" href="pages.css">
</head>
<body>
<div id="page-content">
    <header>
        <div class="fb-back-btn" data-act="goBack"><i class="fa-solid fa-arrow-left"></i></div>
        <span class="fb-header-title" id="headerTitleText">&nbsp;<i class="fa-solid fa-circle-check verified-badge" id="headerVerifiedIcon" style="display:none;"></i></span>
        <div class="header-icons">
            <span id="pgHdrOwner" style="display:contents;"></span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" onclick="openModal('searchModal')" style="cursor:pointer;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <div class="nx-dots" onclick="openMenuSheet()">
                <span class="dot-item" style="color:#fff; font-size: var(--nx-fs-l); font-weight: var(--nx-fw); display:inline-block; animation: dotSequence 1.5s infinite ease-in-out;">•</span>
                <span class="dot-item" style="color:#fff; font-size: var(--nx-fs-l); font-weight: var(--nx-fw); display:inline-block; animation: dotSequence 1.5s infinite ease-in-out; animation-delay:0.3s;">•</span>
                <span class="dot-item" style="color:#fff; font-size: var(--nx-fs-l); font-weight: var(--nx-fw); display:inline-block; animation: dotSequence 1.5s infinite ease-in-out; animation-delay:0.6s;">•</span>
            </div>
        </div>
    </header>

    <!-- ================= PAGE VIEW ================= -->
    <div id="pageView">
        <section class="pg-hero">
            <div class="pg-cover" id="pgCover">
                <img class="pg-cover-img" id="pageCoverImg" alt="" style="display:none;">
                <div class="pg-cover-fade"></div>
            </div>
            <div class="nx-hero-row">
                <div class="nx-av"><img id="pageAvatarImg" alt="" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2790%27 height=%2790%27%3E%3C/svg%3E"></div>
                <div class="nx-hero-id">
                    <div class="nx-hero-name"><h1 id="pageNameTitle"></h1><span id="pgVerified"></span></div>
                    <div class="pg-sub" id="pageMetaRow"></div>
                </div>
            </div>
            <div class="pg-rating" id="pgRating"></div>
            <div id="pgBanner" class="pg-banner" style="display:none;"></div>
            <div id="pgBioWrap"></div>
            <div class="pg-facts" id="pgFacts"></div>
            <div class="pg-cat" id="pgCat"></div>
            <div class="pg-fby" id="pgFollowedBy"></div>
            <div class="nx-actions pg-actions" id="pgActions"></div>
            <div class="nx-hl-wrap" id="pgHlWrap" style="display:none;"><div class="smart-box-highlights"><div class="highlights-scroll" id="pgHighlights"></div></div></div>
        </section>

        <nav class="pg-tabs"><div class="pg-tabs-in" id="pageTabs"><span class="pg-ind" id="pgInd"></span></div></nav>

        <div class="tab-panel active" id="tab-posts"><div id="timeline-area"></div></div>
        <div class="tab-panel" id="tab-photos"><div class="media-grid" id="photosGrid"></div></div>
        <div class="tab-panel" id="tab-videos"><div class="media-grid" id="videosGrid"></div></div>
        <div class="tab-panel" id="tab-shop"><div class="shop-grid" id="shopGrid"></div></div>
        <div class="tab-panel" id="tab-events"><div class="events-list" id="eventsList"></div></div>
        <div class="tab-panel" id="tab-reviews"><div id="reviewsBox"></div></div>
        <div class="tab-panel" id="tab-about"><div class="pg-ab" id="aboutBox"></div></div>
    </div>

    <!-- Sheets, search, viewer, toast (filled by pages.js) -->
    <div id="pgSheetWrap"><div id="pgSheetBg"></div><div id="pgSheet"></div></div>
    <div class="pg-ov" id="pgStudio"></div>
    <div class="pg-ov" id="pgSearch">
        <div class="pg-ov-top">
            <div class="bk" data-act="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M11 17l-5-5 5-5M18 12H6"/></svg></div>
            <input id="pgSearchInput" type="search" placeholder="Search this page" autocomplete="off">
        </div>
        <div class="pg-ov-body" id="pgSearchBody"></div>
    </div>
    <div class="pg-ov" id="pgLight"></div>
    <div id="pgToast"></div>
</div>

    <!-- SHARED POST CARD TEMPLATE — single source of truth for generatePostHTML() -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="post-card-template.js"></script>
    <script src="router.js"></script>
    <script src="pages.js"></script>
</body>
</html>
