<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Luxury</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor-chat.css">
    <script>
    (function () {
        if (location.search.indexOf('embed=1') === -1) { document.write('<script src="router.js"><\/script>'); return; }
        window.NexusRouter = {
            navigateTo: function (u) {
                try { if (window.parent && window.parent.NexusRouter) { window.parent.NexusRouter.navigateTo(u); return; } } catch (e) {}
                window.top.location.href = u;
            },
            registerPage: function (p, h) { window.__vcHandlers = h; }
        };
    })();
            </script>
</head>
<body>
    <div id="page-content">
<body>

    <div class="welcome-splash" id="welcomeSplash">
        <div class="splash-seal"><i class="fa-solid fa-crown"></i></div>
        <div class="splash-title" id="splashTitle">Welcome to Infinity Luxury</div>
        <div class="splash-sub" id="splashSub">We're delighted to have you here.</div>
    </div>

    <section class="slim-slider">
        <div class="slide-track" id="product-slider"></div>
    </section>

    <div class="floating-avatar" id="floatingAvatar">
        <div class="avatar-circle" id="avatarCircle"><i class="fa-solid fa-crown"></i></div>
        <div class="avatar-status-dot offline" id="avatarStatusDot"></div>
    </div>
    <input type="file" id="avatarUploadInput" accept="image/*" style="display:none">

    <div class="bot-toggle-bar" id="botToggleBar">
        <span class="bot-toggle-dot on" id="botToggleDot"></span>
        <span id="botToggleText">Bot: Active</span>
        <span class="bot-toggle-switch" onclick="toggleBot(event)">Canza</span>
    </div>

    <main class="chat-space" id="chat"></main>

    <div class="ctx-backdrop" id="ctxBackdrop" onclick="closeCtxMenu()"></div>
    <div class="ctx-menu" id="ctxMenu"></div>

    <!-- FULL-SCREEN MEDIA COMPOSE -->
    <div class="media-compose" id="mediaCompose">
        <div class="mc-top">
            <i class="fa-solid fa-xmark" onclick="cancelMediaCompose()"></i>
            <i class="fa-solid fa-rotate-right" onclick="rotateActiveMedia()"></i>
        </div>
        <div class="mc-viewport" id="mcViewport"></div>
        <div class="mc-thumbs" id="mcThumbs"></div>
        <div class="mc-bottom">
            <input class="mc-caption" id="mcCaption" placeholder="Add a caption…">
            <div class="mc-send" onclick="sendMediaCompose()"><i class="fa-solid fa-paper-plane"></i></div>
        </div>
    </div>

    <footer class="bottom-nav">
        <div class="context-bar" id="contextBar">
            <div class="cb-accent"></div>
            <div class="cb-body">
                <div class="cb-label" id="cbLabel">Replying to</div>
                <div class="cb-text" id="cbText"></div>
            </div>
            <i class="fa-solid fa-xmark" onclick="cancelContextBar()"></i>
        </div>

        <div class="input-row">
            <div class="voice-compose" id="voiceCompose">
                <div class="vc-top-row" id="vcTopRowRecording">
                    <span class="vc-rec-dot"></span>
                    <span class="vc-timer" id="vcTimer">0:00</span>
                    <div class="vc-wave" id="vcWave"></div>
                </div>
                <div class="vc-top-row" id="vcTopRowPreview" style="display:none;">
                    <i class="fa-solid fa-play vc-scrub-play" id="vcScrubPlayIcon" onclick="togglePreviewPlayback()"></i>
                    <div class="vc-track" id="vcTrack" onpointerdown="startScrub(event)">
                        <div class="vc-track-line"><div class="vc-track-fill" id="vcTrackFill"></div><div class="vc-track-dot" id="vcTrackDot"></div></div>
                    </div>
                    <span class="vc-timer" id="vcPreviewTime">0:00</span>
                    <span class="vc-speed-badge" id="vcSpeedBadge" onclick="cycleSpeed()">1x</span>
                </div>
                <div class="vc-controls-row">
                    <div class="vc-icon-btn vc-trash" onclick="cancelRecording()"><i class="fa-solid fa-trash"></i></div>
                    <div class="vc-pill" id="vcPausePill" onclick="togglePauseResume()">
                        <i class="fa-solid fa-pause" id="vcPauseIcon"></i><span id="vcPauseLabel">Pause</span>
                    </div>
                </div>
                <audio id="vcPreviewAudio" style="display:none;"></audio>
            </div>
            <div class="input-container">
                <div class="icon-btn" onclick="document.getElementById('galleryInput').click()"><i class="fa-solid fa-image"></i></div>
                <textarea id="userInput" placeholder="Message" rows="1" oninput="toggleInputUI(this)"></textarea>
                <div class="icon-btn" onclick="openCamera()"><i class="fa-solid fa-camera"></i></div>
                <input type="file" id="galleryInput" accept="image/*,video/*" multiple style="display:none" onchange="handleMediaSelect(this)">
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleMediaSelect(this)">
            </div>
            <div id="actionBtn" class="action-circle" onpointerdown="handleAction()">
                <i id="actionIcon" class="fa-solid fa-microphone"></i>
            </div>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
    (function () {
        if (location.search.indexOf('embed=1') === -1) { document.write('<script src="vendor-chat.js"><\/script>'); return; }
        var warm = location.search.indexOf('warm=1') > -1;
        var pristine = document.getElementById('page-content').innerHTML;
        var code = null;
        var FN = ['handleMediaSelect','togglePreviewPlayback','togglePauseResume','toggleInputUI','toggleBubbleAudio','toggleBot','startScrub','startBubbleScrub','setMcActive','sendMediaCompose','rotateActiveMedia','pick','openCamera','handleAction','cycleSpeed','ctxShare','ctxReply','ctxEdit','ctxDelete','ctxCopy','closeCtxMenu','cancelRecording','cancelMediaCompose','cancelContextBar'];
        function fb() {
            if (!firebase.apps.length) {
                firebase.initializeApp({
                    apiKey: "AIzaSyDExSOnFbN-wJbT1UFgB-kBs37bEa3KiWc",
                    authDomain: "oryzon-50ea4.firebaseapp.com",
                    projectId: "oryzon-50ea4",
                    storageBucket: "oryzon-50ea4.firebasestorage.app",
                    messagingSenderId: "782106742622",
                    appId: "1:782106742622:web:902d512bfe42dd4cf289cf"
                });
            }
            var db = firebase.firestore();
            if (!fb._p) { fb._p = 1; try { db.enablePersistence({ synchronizeTabs: true }).catch(function () {}); } catch (e) {} }
            return db;
        }
        function run() {
            var selfBoot = document.readyState !== 'complete';
            var exp = FN.map(function (n) { return 'try{window.' + n + '=' + n + ';}catch(e){}'; }).join('\n');
            var s = document.createElement('script');
            s.text = '(function(){\n' + code + '\n' + exp + '\n})();';
            document.body.appendChild(s);
            document.body.removeChild(s);
            if (!selfBoot && window.__vcHandlers && window.__vcHandlers.init) window.__vcHandlers.init();
        }
        function start() {
            if (code !== null) { run(); return; }
            fetch('vendor-chat.js').then(function (r) { return r.text(); }).then(function (t) { code = t; run(); });
        }
        window.vcClose = function () {
            try { if (window.__vcHandlers && window.__vcHandlers.destroy) window.__vcHandlers.destroy(); } catch (e) {}
            window.__vcHandlers = null;
            document.getElementById('page-content').innerHTML = pristine;
        };
        window.vcOpen = function (search) {
            window.vcClose();
            history.replaceState(null, '', location.pathname + search);
            start();
        };
        window.vcPrefetch = function (ids) {
            try {
                var db = fb();
                (ids || []).forEach(function (id) {
                    db.collection('vendorChats').doc(id).collection('messages').orderBy('time', 'desc').limit(40).get().catch(function () {});
                });
            } catch (e) {}
        };
        window.addEventListener('load', function () { window.__vcReady = true; });
        if (warm) {
            try { fb(); firebase.auth(); } catch (e) {}
            fetch('vendor-chat.js').then(function (r) { return r.text(); }).then(function (t) { code = t; });
        } else {
            start();
        }
    })();
    </script>
</body>
</html>
