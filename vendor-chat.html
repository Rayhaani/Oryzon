<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor-chat.css">
    <script src="router.js"></script>
</head>
<body>
    <div id="page-content">
<body>

    <div class="welcome-splash" id="welcomeSplash">
        <div class="splash-seal"><i class="fa-solid fa-crown"></i></div>
        <div class="splash-title" id="splashTitle">Welcome to Infinity Luxury</div>
        <div class="splash-sub" id="splashSub">We're delighted to have you here.</div>
    </div>

    <section class="slim-slider">
        <div class="slide-track" id="product-slider"></div>
    </section>

    <div class="floating-avatar" id="floatingAvatar">
        <div class="avatar-circle" id="avatarCircle"><i class="fa-solid fa-crown"></i></div>
        <div class="avatar-status-dot offline" id="avatarStatusDot"></div>
    </div>
    <input type="file" id="avatarUploadInput" accept="image/*" style="display:none">

    <div class="bot-toggle-bar" id="botToggleBar">
        <span class="bot-toggle-dot on" id="botToggleDot"></span>
        <span id="botToggleText">Bot: Active</span>
        <span class="bot-toggle-switch" onclick="toggleBot(event)">Canza</span>
    </div>

    <main class="chat-space" id="chat"></main>

    <div class="ctx-backdrop" id="ctxBackdrop" onclick="closeCtxMenu()"></div>
    <div class="ctx-menu" id="ctxMenu"></div>

    <!-- FULL-SCREEN MEDIA COMPOSE -->
    <div class="media-compose" id="mediaCompose">
        <div class="mc-top">
            <i class="fa-solid fa-xmark" onclick="cancelMediaCompose()"></i>
            <i class="fa-solid fa-rotate-right" onclick="rotateActiveMedia()"></i>
        </div>
        <div class="mc-viewport" id="mcViewport"></div>
        <div class="mc-thumbs" id="mcThumbs"></div>
        <div class="mc-bottom">
            <input class="mc-caption" id="mcCaption" placeholder="Add a caption…">
            <div class="mc-send" onclick="sendMediaCompose()"><i class="fa-solid fa-paper-plane"></i></div>
        </div>
    </div>

    <footer class="bottom-nav">
        <div class="context-bar" id="contextBar">
            <div class="cb-accent"></div>
            <div class="cb-body">
                <div class="cb-label" id="cbLabel">Replying to</div>
                <div class="cb-text" id="cbText"></div>
            </div>
            <i class="fa-solid fa-xmark" onclick="cancelContextBar()"></i>
        </div>

        <div class="input-row">
            <div class="voice-compose" id="voiceCompose">
                <div class="vc-top-row" id="vcTopRowRecording">
                    <span class="vc-rec-dot"></span>
                    <span class="vc-timer" id="vcTimer">0:00</span>
                    <div class="vc-wave" id="vcWave"></div>
                </div>
                <div class="vc-top-row" id="vcTopRowPreview" style="display:none;">
                    <i class="fa-solid fa-play vc-scrub-play" id="vcScrubPlayIcon" onclick="togglePreviewPlayback()"></i>
                    <div class="vc-track" id="vcTrack" onpointerdown="startScrub(event)">
                        <div class="vc-track-line"><div class="vc-track-fill" id="vcTrackFill"></div><div class="vc-track-dot" id="vcTrackDot"></div></div>
                    </div>
                    <span class="vc-timer" id="vcPreviewTime">0:00</span>
                    <span class="vc-speed-badge" id="vcSpeedBadge" onclick="cycleSpeed()">1x</span>
                </div>
                <div class="vc-controls-row">
                    <div class="vc-icon-btn vc-trash" onclick="cancelRecording()"><i class="fa-solid fa-trash"></i></div>
                    <div class="vc-pill" id="vcPausePill" onclick="togglePauseResume()">
                        <i class="fa-solid fa-pause" id="vcPauseIcon"></i><span id="vcPauseLabel">Pause</span>
                    </div>
                </div>
                <audio id="vcPreviewAudio" style="display:none;"></audio>
            </div>
            <div class="input-container">
                <div class="icon-btn" onclick="document.getElementById('galleryInput').click()"><i class="fa-solid fa-image"></i></div>
                <textarea id="userInput" placeholder="Message" rows="1" oninput="toggleInputUI(this)"></textarea>
                <div class="icon-btn" onclick="openCamera()"><i class="fa-solid fa-camera"></i></div>
                <input type="file" id="galleryInput" accept="image/*,video/*" multiple style="display:none" onchange="handleMediaSelect(this)">
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleMediaSelect(this)">
            </div>
            <div id="actionBtn" class="action-circle" onpointerdown="handleAction()">
                <i id="actionIcon" class="fa-solid fa-microphone"></i>
            </div>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="vendor-chat.js"></script>
</body>
</html>
