<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYNTA | OFFICIAL REGISTRATION</title>

    <meta property="og:title" content="ZYNTA | OFFICIAL NODE">
    <meta property="og:description" content="Secure your spot on the Zynta Protocol. Register now.">
    <meta property="og:image" content="https://zynta.org/assets/logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
        
    
    <style> 
:root { --accent-1: #a78bfa; --accent-2: #f472b6; --bg: #0d0f14; }
body { background: var(--bg); color: #fff; font-family: 'Quicksand', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; } 
        
        .orbitron { font-family: 'Quicksand', sans-serif; font-weight:700; text-transform: uppercase; letter-spacing: 2px; font-size: 10px; }

.glass-card { 
    background: rgba(255, 255, 255, 0.02); 
    backdrop-filter: blur(40px); 
    border: 1px solid rgba(255, 255, 255, 0.08); 
    border-top: 1px solid rgba(167, 139, 250, 0.3); 
    transition: all 0.5s ease;
}
         .input-node { 
    width: 100%; 
    background: rgba(255, 255, 255, 0.05); 
    border: 1px solid rgba(255, 255, 255, 0.1); 
    padding: 8px 12px;
    border-radius: 12px;
    outline: none; 
    color: white; 
    transition: 0.3s; 
         }
 .input-node:focus { border-color: var(--accent-1); box-shadow: 0 0 15px rgba(167, 139, 250, 0.15); }

.resend-btn-neon {
    background: transparent !important;
    border: 1px solid var(--accent-1) !important;
    color: var(--accent-1) !important;
    box-shadow: 0 0 15px rgba(167, 139, 250, 0.3);
    font-family: 'Quicksand', sans-serif !important;
    font-weight: 700 !important;
    font-size: 11px !important;
    padding: 16px 40px !important;
    border-radius: 20px !important;
    transition: 0.4s !important;
    letter-spacing: 2px;
}
.resend-btn-neon:hover { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)) !important; color: #0d0f14 !important; box-shadow: 0 0 30px var(--accent-1); }       

        /* GITHUB STYLE NOTIFICATION BAR */
#notification-bar {
    position: fixed;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 450px;
    padding: 12px 20px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-family: 'Quicksand', sans-serif;
    z-index: 9999;
    transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 1px solid rgba(167, 139, 250, 0.3);
}
.notif-success { background: #0c2d21; color: #3fb950; border-color: #238636 !important; }
.notif-error { background: #2d1616; color: #f85149; border-color: #da3633 !important; }

#notification-bar.show { top: 20px; }

.close-notif { cursor: pointer; font-weight: bold; font-size: 18px; margin-left: 15px; }

  /* SYNERGY PROTOCOL - GLOBAL BACKGROUND ENGINE */
body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: #0d0f14;
    background-image: 
        radial-gradient(circle at 50% 50%, rgba(112, 0, 255, 0.15), transparent), 
        url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
    background-attachment: fixed;
    color: #ffffff;
    font-family: 'Quicksand', sans-serif;
    overflow-x: hidden;
}

.glass-premium {
    background: rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-top: 1px solid rgba(167, 139, 250, 0.3);
    border-radius: 24px;
}

/* EXACT PHOTO HEADER - ACCENT COLORS MAINTAINED */
.exact-photo-header {
    position: relative;
    width: calc(100% + 3rem);
    margin: -1.5rem -1.5rem 1rem -1.5rem;
    height: 130px;
    border-top-left-radius: 32px;
    border-top-right-radius: 32px;
    overflow: hidden;
    background: rgba(167, 139, 250, 0.05);
}

.exact-photo-header svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

.close-btn-circle {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 30px;
    height: 30px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0d0f14;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(167, 139, 250, 0.4);
    z-index: 10;
}
</style>
</head>
<body>
<div id="notification-bar">
    <span id="notif-message"></span>
    <span class="close-notif" onclick="closeNotif()">×</span>
</div>
    
<div id="main-register-card" class="glass-card p-6 rounded-[32px] w-full max-w-md mx-4 relative z-10 overflow-hidden">
    <!-- SABUWAR HEADER IRIN TA PHOTO TARE DA COLOURS DIN ZYNTA -->
    <div class="exact-photo-header">
        <div class="close-btn-circle">&times;</div>
        <svg viewBox="0 0 500 150" preserveAspectRatio="none">
            <path d="M0,0 L500,0 L500,40 C350,150 200,30 0,100 Z" fill="var(--accent-1)" opacity="0.25"></path>
            <path d="M0,0 L500,0 L500,25 C320,130 180,10 0,80 Z" fill="var(--accent-2)" opacity="0.6"></path>
            <path d="M0,0 C150,90 350,-40 500,60 L500,0 Z" fill="var(--accent-1)" opacity="0.8"></path>
        </svg>
    </div>

    <div class="mb-6 text-center">
        <h1 style="font-family: 'Quicksand', sans-serif !important; font-weight:700; letter-spacing: -0.5px;" 
            class="text-[24px] font-bold text-white mb-1">
            Register<span style="color:var(--accent-1);">.</span>
        </h1>
        <p id="progress-text" 
           style="font-family: 'Quicksand', sans-serif !important; letter-spacing: -0.01em; color: var(--accent-1);" 
           class="text-[13px] font-bold">
            Create your account. It's free and only takes a minute.
        </p>
    </div>
    
    <div id="form-content" class="space-y-2.5">
        <div><label class="orbitron text-gray-500 ml-1 mb-1 block">Full Name</label><input type="text" id="full-name" oninput="validateForm()" class="input-node"></div>
        <div id="step-email"><label class="orbitron text-gray-500 ml-1 mb-1 block">Email Address</label><input type="email" id="email" oninput="validateForm()" class="input-node"></div>

        <div class="grid grid-cols-2 gap-3">
            <div id="step-user"><label class="orbitron text-gray-500 ml-1 mb-1 block">Username</label><input type="text" id="username" oninput="validateForm()" class="input-node"></div>
            <div id="step-state"><label class="orbitron text-gray-500 ml-1 mb-1 block">State</label><input type="text" id="state" oninput="validateForm()" class="input-node"></div>
        </div>

        <div id="step-phone">
            <label class="orbitron text-gray-500 ml-1 mb-1 block">WhatsApp Number</label>
            <input type="tel" id="phone" oninput="validateForm()" class="input-node">
        </div>
        <div id="step-pass"><label class="orbitron text-gray-500 ml-1 mb-1 block">Password</label><input type="password" id="password" oninput="validateForm()" class="input-node"></div>
        
        <button id="reg-btn" onclick="register()" disabled class="w-full bg-white text-black py-4 rounded-2xl font-bold orbitron mt-2 opacity-20 cursor-not-allowed transition-all duration-500">ACTIVATE PROTOCOL</button>
    </div>

    <p style="font-family: 'Quicksand', sans-serif !important; letter-spacing: -0.01em;" 
       class="text-[13px] text-gray-500 text-center mt-6">
        Already have an account? 
        <a href="signin.html" style="color:var(--accent-1);" class="font-bold hover:underline">Sign In</a>
    </p>

    <script>
    // 1. Bayanan Hadin Gwiwa (Firebase Configuration)
    const firebaseConfig = { 
        apiKey: "AIzaSyDLTwLq8Le9vYAwRkRcqXPGxFnEqW1yE2E", 
        authDomain: "synergy-protocol.firebaseapp.com", 
        projectId: "synergy-protocol",
        databaseURL: "https://synergy-protocol-default-rtdb.firebaseio.com" 
    };

    // 2. Tada Tsarin (Initialize Firebase)
    const app = firebase.initializeApp(firebaseConfig);

    firebase.firestore(app).settings({
        experimentalForceLongPolling: true,
        cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED
    });
    
    // 3. Saita Manhajoji (Initialize Services)
    const db = firebase.firestore();      
    const database = firebase.database(); 
    const auth = firebase.auth();           

    // 4. Saita Timer (Global Variables)
    let checkInterval = null; 

    // 5. Neman Referrer (Helper Function)
    function getReferrerFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get('ref') || "admin";
    }
    
    function validateForm() {
        const fullName = document.getElementById('full-name').value.trim();
        const email = document.getElementById('email').value.trim();
        const user = document.getElementById('username').value.trim();
        const state = document.getElementById('state').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const pass = document.getElementById('password').value.trim();

        const steps = [ 
            { el: 'step-email', valid: fullName.split(' ').length >= 2 }, 
            { el: 'step-user', valid: email.includes('@') && email.includes('.') }, 
            { el: 'step-state', valid: user.length >= 3 }, 
            { el: 'step-phone', valid: state.length >= 3 }, 
            { el: 'step-pass', valid: phone.length >= 10 },
            { el: 'reg-btn', valid: pass.length >= 6 }
        ];
        
        let completed = 0;
        steps.forEach(s => {
            const target = document.getElementById(s.el);
            if (s.valid) {
                if (target.id === 'reg-btn') { target.disabled = false; target.style.opacity = "1"; }
                else { target.classList.remove('hidden'); }
                completed++;
            }
        });
        document.getElementById('progress-text').innerText = `Initialize Sequence: ${Math.round((completed/6)*100)}%`;
    }
    
    // Function na nuna sanarwa a sama (GitHub Style)
    function showTopNotif(message, type) {
        const bar = document.getElementById('notification-bar');
        const msg = document.getElementById('notif-message');
        
        bar.className = (type === 'success') ? 'notif-success show' : 'notif-error show';
        msg.innerText = message;

        setTimeout(closeNotif, 5000);
    }

    function closeNotif() {
        document.getElementById('notification-bar').classList.remove('show');
    }

    // RESEND FUNCTION
    async function resendVerification() {
        try {
            const fbUser = firebase.auth().currentUser;
            if (fbUser) {
                await fbUser.sendEmailVerification();
                showTopNotif("Your verification link has been resent", "success");
            }
        } catch (err) {
            showTopNotif("Security protocol active. Please wait a moment.", "error");
        }
    }

    // REGISTER FUNCTION
    async function register() {
        const btn = document.getElementById('reg-btn');
        const mainCard = document.getElementById('main-register-card'); 
        const email = document.getElementById('email').value.trim();
        const user = document.getElementById('username').value.toLowerCase().trim();
        const pass = document.getElementById('password').value.trim();
        const rawPhone = document.getElementById('phone').value.trim();
        const fullName = document.getElementById('full-name').value.trim();
        const state = document.getElementById('state').value.trim();
        const referrer = getReferrerFromURL();

        btn.disabled = true;
        btn.innerHTML = `<span class="orbitron animate-pulse">CONNECTING...</span>`;

        let formattedPhone = rawPhone;
        if (rawPhone.startsWith('0')) {
            formattedPhone = '234' + rawPhone.substring(1);
        } else if (!rawPhone.startsWith('234') && rawPhone !== "") {
            formattedPhone = '234' + rawPhone;
        }

        try {
            const usernameSnap = await database.ref('users/' + user).get();
            if (usernameSnap.exists()) {
                throw new Error("This username isn't available.");
            }

            const usersSnap = await database.ref('users').get();
            if (usersSnap.exists()) {
                let phoneUsed = false;
                usersSnap.forEach(child => {
                    if (child.val().whatsapp === formattedPhone) {
                        phoneUsed = true;
                    }
                });
                if (phoneUsed) {
                    throw new Error("This WhatsApp number is already in use.");
                }
            }

            const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
            await userCredential.user.sendEmailVerification();
            
            mainCard.style.display = 'none';
            showSuccessOverlay(email); 

            await database.ref('users/' + user).set({
                uid: userCredential.user.uid,
                fullName: fullName,
                email: email,
                username: user,
                state: state,
                whatsapp: formattedPhone,
                isVerified: false,
                referredBy: referrer,
                last_update: new Date().toISOString()
            });

            db.collection("users").doc(user).set({
                uid: userCredential.user.uid,
                fullName: fullName,
                email: email, 
                username: user,
                state: state,
                whatsapp: formattedPhone, 
                isVerified: false,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                referredBy: referrer
            }).catch(err => console.log("Firestore background save:", err));

        } catch (e) {
            console.error("Registration Error:", e);
            
            let friendlyMessage = "Something went wrong. Please try again.";
            
            if (e.code === "auth/email-already-in-use") {
                friendlyMessage = "This email is already registered. Please sign in.";
            } else if (e.code === "auth/invalid-email") {
                friendlyMessage = "Please enter a valid email address.";
            } else if (e.code === "auth/weak-password") {
                friendlyMessage = "Password is too weak. Use at least 6 characters.";
            } else if (e.code === "auth/network-request-failed") {
                friendlyMessage = "Network error. Please check your connection.";
            } else if (e.message) {
                friendlyMessage = e.message;
            }
            
            showTopNotif(friendlyMessage, "error");
            btn.disabled = false;
            btn.innerText = "RETRY ACTIVATION";
        }
    }
        
    function showSuccessOverlay(email) {
        startVerificationListener(); 

        Swal.fire({
            html: `
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full mb-6" style="background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); box-shadow:0 0 20px rgba(167,139,250,0.5);"></div>
                    <h2 class="orbitron text-white text-xl mb-6">REGISTRATION SUCCESSFUL</h2>
                    <div style="background: rgba(255,255,255,0.03); padding: 25px; border-radius: 20px; border: 1px dashed rgba(167,139,250,0.3); width: 100%; color: #fff;">
                        <p style="font-family: 'Quicksand', sans-serif; font-size: 15px;">Email sent to <b style="color:#a78bfa;">${email}</b>. Verify to proceed.</p>
                        <p class="animate-pulse" style="font-size: 11px; color: #3fb950; margin-top: 10px; font-family: 'Quicksand', sans-serif; font-weight:700;">Waiting for verification...</p>
                    </div>
                </div>`,
            background: '#0d0f14', 
            showConfirmButton: true, 
            confirmButtonText: 'RESEND LINK', 
            allowOutsideClick: false,
            customClass: { 
                popup: 'rounded-[35px] border border-[#a78bfa]/30 shadow-2xl', 
                confirmButton: 'resend-btn-neon orbitron' 
            }
        }).then((result) => {
            if (result.isConfirmed) { 
                resendVerification(); 
                showSuccessOverlay(email); 
            }
        });
    }

    function startVerificationListener() {
        if (checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(async () => {
            const currentUser = firebase.auth().currentUser;
            if (currentUser) {
                await currentUser.reload(); 
                if (currentUser.emailVerified) {
                    clearInterval(checkInterval); 
                    showTopNotif("Security Verified! Redirecting...", "success");
                    setTimeout(() => { window.location.href = "signin.html"; }, 1500);
                }
            }
        }, 3000);
    }
    </script>
</body>
</html>
