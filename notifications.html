<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | Synergy</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="router.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="nexus-core.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="notifications.css">
</head>
<body>

<header>
    <div class="header-row">
        <div class="back-trigger" onclick="history.back()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M11 17l-5-5 5-5M18 12H6"/></svg>
        </div>
        <span class="header-title" id="dynamicHeaderTitle">Notifications</span>
        <div class="mark-read-btn" id="markReadBtn" onclick="markAllNotifsRead()" title="Mark all as read">
            <i class="fa-solid fa-check-double"></i>
        </div>
    </div>

    <div class="tab-switch-wrap">
        <div class="tab-btn active" id="tabBtnNotif" onclick="switchNotifTab(0)">
            All
            <span class="tab-count" id="notifUnreadBadge">0</span>
        </div>
        <div class="tab-btn" id="tabBtnFollow" onclick="switchNotifTab(1)">
            Follow
            <span class="tab-count" id="followBackBadge">0</span>
        </div>
        <div class="tab-btn" id="tabBtnReplies" onclick="switchNotifTab(2)">
            Replies
        </div>
        <div class="tab-btn" id="tabBtnLikes" onclick="switchNotifTab(3)">
            Likes
        </div>
        <div class="tab-btn" id="tabBtnInvites" onclick="switchNotifTab(4)">
            Invites
        </div>
        <div class="tab-underline-track">
            <div class="tab-underline" id="tabUnderline"></div>
        </div>
    </div>
</header>

<div class="tab-content active" id="content-notifications">
    <div class="subtab-wrap">
        <div class="subtab-slider" id="subtabSlider"></div>
        <div class="subtab-btn active" id="subtabUnread" onclick="switchReadFilter('unread')">
            Unread <span class="subtab-count" id="subtabUnreadCount">0</span>
        </div>
        <div class="subtab-btn" id="subtabRead" onclick="switchReadFilter('read')">
            Read <span class="subtab-count" id="subtabReadCount">0</span>
        </div>
    </div>
    <div id="notifListContainer">
        <div class="skeleton"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:85%"></div><div class="skeleton-line" style="width:40%"></div></div></div>
        <div class="skeleton"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:30%"></div></div></div>
    </div>
</div>

<div class="tab-content" id="content-followback">
    <div id="followBackContainer">
        <div class="skeleton"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:35%"></div></div></div>
    </div>
</div>

<div class="tab-content" id="content-replies">
    <div class="subtab-wrap">
        <div class="subtab-slider" id="subtabSliderReplies"></div>
        <div class="subtab-btn active" id="subtabUnreadReplies" onclick="switchReadFilterFor('replies','unread')">
            Unread <span class="subtab-count" id="subtabUnreadCountReplies">0</span>
        </div>
        <div class="subtab-btn" id="subtabReadReplies" onclick="switchReadFilterFor('replies','read')">
            Read <span class="subtab-count" id="subtabReadCountReplies">0</span>
        </div>
    </div>
    <div id="repliesListContainer"></div>
</div>

<div class="tab-content" id="content-likes">
    <div class="subtab-wrap">
        <div class="subtab-slider" id="subtabSliderLikes"></div>
        <div class="subtab-btn active" id="subtabUnreadLikes" onclick="switchReadFilterFor('likes','unread')">
            Unread <span class="subtab-count" id="subtabUnreadCountLikes">0</span>
        </div>
        <div class="subtab-btn" id="subtabReadLikes" onclick="switchReadFilterFor('likes','read')">
            Read <span class="subtab-count" id="subtabReadCountLikes">0</span>
        </div>
    </div>
    <div id="likesListContainer"></div>
</div>

<div class="tab-content" id="content-invites">
    <div class="subtab-wrap">
        <div class="subtab-slider" id="subtabSliderInvites"></div>
        <div class="subtab-btn active" id="subtabUnreadInvites" onclick="switchReadFilterFor('invites','unread')">
            Unread <span class="subtab-count" id="subtabUnreadCountInvites">0</span>
        </div>
        <div class="subtab-btn" id="subtabReadInvites" onclick="switchReadFilterFor('invites','read')">
            Read <span class="subtab-count" id="subtabReadCountInvites">0</span>
        </div>
    </div>
    <div id="invitesListContainer"></div>
</div>

<script src="notifications.js"></script>
</body>
</html>
