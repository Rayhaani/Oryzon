<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<title>Nexus — Migration Tool (run once)</title>
</head>
<body style="background:#050505; color:#fff; font-family:monospace; padding:20px;">

<h2>Nexus Posts Migration</h2>
<p>Wannan page zai gyara tsofaffin posts domin su samu <code>fullName</code>, <code>userProfilePic</code>, da <code>commentCount</code> fields. <b>A yi amfani da wannan sau daya kacal</b>, sannan a share fayil ɗin ko a cire shi daga server.</p>

<button id="startBtn" style="padding:12px 24px; font-size:14px; cursor:pointer;">Fara Migration</button>
<pre id="log" style="margin-top:20px; white-space:pre-wrap; background:#111; padding:15px; border-radius:8px; max-height:500px; overflow-y:auto;"></pre>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
    // === Sanya daidai firebaseConfig ɗinka (kwatankwacin wanda ke cikin social.html) ===
    const firebaseConfig = {
        apiKey: "AIzaSyDExSOnFbN-wJbT1UFgB-kBs37bEa3KiWc",
        authDomain: "oryzon-50ea4.firebaseapp.com",
        projectId: "oryzon-50ea4",
        storageBucket: "oryzon-50ea4.firebasestorage.app",
        messagingSenderId: "782106742622",
        appId: "1:782106742622:web:902d512bfe42dd4cf289cf"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const logEl = document.getElementById('log');
    function log(msg) {
        logEl.textContent += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
    }

    document.getElementById('startBtn').onclick = async function () {
        this.disabled = true;
        this.innerText = "Ana gudu...";
        log("Fara migration...\n");

        try {
            // STEP 1: Kawo dukkan users, mu ajiye a memory domin sauri (ba mu son
            // yin query na users kowane post — mu kawo su sau daya kawai).
            log("Ana kawo users...");
            const usersSnap = await db.collection('users').get();
            const userMap = {};
            usersSnap.forEach(doc => {
                const d = doc.data();
                userMap[doc.id] = {
                    fullName: d.fullName || doc.id,
                    userProfilePic: d.userProfilePic || ''
                };
            });
            log(`An samo users guda ${usersSnap.size}.\n`);

            // STEP 2: Kawo dukkan posts, mu gyara wadanda basu da fullName.
            log("Ana kawo posts...");
            const postsSnap = await db.collection('posts').get();
            log(`An samo posts guda ${postsSnap.size}. Ana fara gyara...\n`);

            let batch = db.batch();
            let batchCount = 0;
            let updatedCount = 0;
            let skippedCount = 0;

            for (const doc of postsSnap.docs) {
                const post = doc.data();

                // Idan post din ya riga ya samu fullName, mu tsallake shi
                if (post.fullName && typeof post.commentCount === 'number') {
                    skippedCount++;
                    continue;
                }

                const userInfo = userMap[post.username] || { fullName: post.username, userProfilePic: '' };

                // Kirga comments na wannan post (sau daya kacal, domin migration)
                const commentsSnap = await db.collection('nexus_contributions')
                    .where('postId', '==', doc.id)
                    .where('parentId', '==', null)
                    .get();

                batch.update(doc.ref, {
                    fullName: post.fullName || userInfo.fullName,
                    userProfilePic: post.userProfilePic || userInfo.userProfilePic,
                    commentCount: typeof post.commentCount === 'number' ? post.commentCount : commentsSnap.size
                });

                batchCount++;
                updatedCount++;

                // Firestore batch max shine 500 operations
                if (batchCount >= 400) {
                    await batch.commit();
                    log(`Batch na ${updatedCount} an commit...`);
                    batch = db.batch();
                    batchCount = 0;
                }
            }

            if (batchCount > 0) {
                await batch.commit();
            }

            log(`\n✅ AN GAMA! Posts da aka gyara: ${updatedCount}. Posts da aka tsallake (sun riga sun kammala): ${skippedCount}.`);
            log("\nYanzu za ka iya share wannan fayil ɗin daga server ɗinka.");
        } catch (err) {
            log("\n❌ KUSKURE: " + err.message);
            console.error(err);
        } finally {
            document.getElementById('startBtn').innerText = "An Gama";
        }
    };
</script>
</body>
</html>
