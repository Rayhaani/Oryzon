<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Saved — Oryzon</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    body { background:#050505; color:#fff; font-family:'Inter', sans-serif; padding-bottom:30px; }
    .icon-btn { display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; flex-shrink:0; }
    .icon-btn svg { display:block; }

    /* ===== HEADER (fixed height, search replaces content inline, never grows) ===== */
    .saved-header { position:sticky; top:0; z-index:50; background:#050505; padding:14px 14px 14px; }
    .saved-header-row { position:relative; display:flex; align-items:center; gap:10px; min-height:24px; }
    .saved-title { position:absolute; left:0; right:0; text-align:center; font-size:18px; font-weight:700; pointer-events:none; }
    .saved-actions { display:flex; align-items:center; gap:18px; margin-left:auto; flex-shrink:0; }
    .saved-actions .icon-btn svg { width:23px; height:23px; }
    .saved-header-row > .icon-btn:first-child svg { width:21px; height:21px; }
    .search-inline-wrap { display:none; flex:1; }
    .search-inline-wrap.open { display:flex; }
    .search-inline-box { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.08); border-radius:10px; padding:8px 12px; width:100%; }
    .search-inline-box svg { width:15px; height:15px; color:rgba(255,255,255,0.5); flex-shrink:0; }
    .search-inline-box input { background:none; border:none; outline:none; color:#fff; font-family:'Inter', sans-serif; font-size:13.5px; flex:1; }
    .search-inline-box input::placeholder { color:rgba(255,255,255,0.4); }
    #cancelSearchBtn { display:none; }
    #cancelSearchBtn svg { width:19px; height:19px; }

    /* ===== SAVED ITEMS / COLLECTIONS SWITCH — Instagram treatment: fill on active, no colour change ===== */
    .mode-switch { display:flex; gap:8px; margin-top:22px; }
    .mode-pill { font-size:13px; font-weight:700; padding:7px 16px; border-radius:20px; background:transparent; border:1px solid rgba(255,255,255,0.22); color:#fff; cursor:pointer; }
    .mode-pill.active { background:rgba(255,255,255,0.16); border-color:transparent; }

    /* ===== CATEGORY CHIPS ===== */
    .cat-scroll { display:flex; gap:6px; overflow-x:auto; margin-top:12px; padding-bottom:2px; scrollbar-width:none; }
    .cat-scroll::-webkit-scrollbar { display:none; }
    .cat-chip { flex-shrink:0; font-size:12px; font-weight:600; padding:6px 13px; border-radius:20px; background:transparent; border:1px solid rgba(255,255,255,0.2); color:#fff; cursor:pointer; white-space:nowrap; }
    .cat-chip.active { background:rgba(255,255,255,0.16); border-color:transparent; }

    .result-count { padding:6px 14px 2px; font-size:12px; color:rgba(255,255,255,0.4); }

    /* ===== GRID VIEW ===== */
    #viewArea { padding:6px 8px 0; background:#050505; }
    .grid-view { column-count:2; column-gap:7px; }
    .grid-card { break-inside:avoid; margin-bottom:7px; border-radius:12px; overflow:hidden; position:relative; background:#050505; }
    .grid-card img { width:100%; display:block; }
    .grid-caption { position:absolute; left:0; right:0; bottom:0; padding:22px 8px 8px; background:linear-gradient(transparent, rgba(0,0,0,0.85)); }
    .grid-caption .cap-text { font-size:12px; font-weight:600; color:#fff; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.35; }
    .grid-caption .cap-meta { font-size:10px; color:rgba(255,255,255,0.6); margin-top:2px; }
    .grid-type-badge { position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.55); width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fde08d; }
    .grid-type-badge svg { width:12px; height:12px; }

    /* ===== LIST VIEW ===== */
    .list-view { display:none; flex-direction:column; background:#050505; }
    .list-item { display:flex; align-items:flex-start; gap:12px; padding:12px 4px; border-bottom:1px solid rgba(255,255,255,0.06); }
    .list-thumb { width:56px; height:56px; border-radius:10px; object-fit:cover; flex-shrink:0; }
    .list-body { flex:1; min-width:0; }
    .list-cap { font-size:13.5px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .list-meta { font-size:11.5px; color:rgba(255,255,255,0.45); margin-top:3px; }
    .list-type { font-size:11px; color:rgba(253,224,141,0.85); margin-top:3px; font-weight:500; }
    .list-item .icon-btn svg { width:16px; height:16px; color:rgba(255,255,255,0.4); }

    /* ===== COLLECTIONS LIST ===== */
    .collections-view { display:none; flex-direction:column; background:#050505; padding:0 8px 0; }
    .collection-row { display:flex; align-items:center; gap:12px; padding:9px 6px; border-bottom:1px solid rgba(255,255,255,0.05); }
    .collection-cover { width:54px; height:54px; border-radius:10px; object-fit:cover; flex-shrink:0; background:#111; }
    .collection-body { flex:1; min-width:0; }
    .collection-name { font-size:14px; font-weight:700; color:#fff; }
    .collection-meta { font-size:11.5px; color:rgba(255,255,255,0.45); margin-top:3px; display:flex; align-items:center; gap:5px; }
    .collection-meta svg { width:13px; height:13px; flex-shrink:0; }
    .collection-row .icon-btn svg { width:17px; height:17px; color:rgba(255,255,255,0.45); }

    .empty-state { text-align:center; padding:60px 20px; color:rgba(255,255,255,0.4); font-size:13px; }

    /* ===== NEW / RENAME COLLECTION SHEET ===== */
    .cs-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200; opacity:0; pointer-events:none; transition:opacity 0.2s ease; }
    .cs-backdrop.Active { opacity:1; pointer-events:auto; }
    .collection-sheet { position:fixed; left:0; right:0; bottom:0; z-index:201; background:#0a0a0a; border-radius:18px 18px 0 0; max-height:82vh; display:flex; flex-direction:column; transform:translateY(100%); transition:transform 0.22s cubic-bezier(0.4,0,0.2,1); border-top:1px solid rgba(253,224,141,0.25); }
    .collection-sheet.Active { transform:translateY(0); }
    .cs-handle { width:36px; height:4px; background:rgba(255,255,255,0.2); border-radius:3px; margin:10px auto 4px; }
    .cs-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .cs-action { font-size:14px; font-weight:600; color:rgba(255,255,255,0.65); cursor:pointer; }
    .cs-action.primary { color:#fde08d; }
    .cs-action.disabled { color:rgba(255,255,255,0.25); pointer-events:none; }
    .cs-title { font-size:15px; font-weight:700; }
    .cs-step { padding:6px 16px 20px; overflow-y:auto; }
    .cs-input { width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:12px 14px; color:#fff; font-family:'Inter', sans-serif; font-size:14px; outline:none; }
    .cs-input::placeholder { color:rgba(255,255,255,0.35); }
    .pick-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-top:6px; }
    .pick-item { position:relative; border-radius:8px; overflow:hidden; aspect-ratio:1/1.15; }
    .pick-item img { width:100%; height:100%; object-fit:cover; display:block; }
    .pick-check { position:absolute; top:6px; left:6px; width:19px; height:19px; border-radius:50%; border:1.5px solid #fff; background:rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; }
    .pick-item.selected .pick-check { background:#fde08d; border-color:#fde08d; }
    .pick-item.selected .pick-check svg { display:block; }
    .pick-check svg { display:none; width:11px; height:11px; color:#1a1200; }

    /* ===== GLASS MINI MENU — exact duplicate of the post-header ⋯ glass sheet ===== */
    .mini-menu { position:fixed; z-index:300; background:rgba(255,255,255,0.55); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); border:1px solid rgba(255,255,255,0.5); border-radius:14px; padding:6px; min-width:190px; max-width:80vw; box-shadow:0 8px 28px rgba(0,0,0,0.4); opacity:0; transform:scale(0.95); pointer-events:none; transition:opacity 0.15s ease, transform 0.15s ease; }
    .mini-menu.Active { opacity:1; transform:scale(1); pointer-events:auto; }
    .mini-menu-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; font-size:13.5px; font-weight:600; color:#0a0a0a; cursor:pointer; }
    .mini-menu-item svg { flex-shrink:0; }
    .mini-menu-item.danger { color:#c8113a; }
    .mini-menu-item.checked { justify-content:space-between; }
    .mm-backdrop { position:fixed; inset:0; z-index:299; display:none; }
    .mm-backdrop.Active { display:block; }
</style>
</head>
<body>

<div class="saved-header">

        <span class="cat-chip" data-cat="Product">Products</span>
        <span class="cat-chip" data-cat="Event">Events</span>
        <span class="cat-chip" data-cat="Link">Links</span>
        <span class="cat-chip" data-cat="Audio">Audio</span>
    </div>
</div>

<div class="result-count" id="resultCount"></div>
<div id="viewArea">
    <div class="grid-view" id="gridView"></div>
    <div class="list-view" id="listView"></div>
    <div class="collections-view" id="collectionsView"></div>
</div>

<div class="cs-backdrop" id="csBackdrop"></div>
<div class="collection-sheet" id="collectionSheet">
    <div class="cs-handle"></div>
    <div id="csStepName" class="cs-step-wrap">
        <div class="cs-header">
            <span class="cs-action" id="csCancel">Cancel</span>
            <span class="cs-title" id="csNameTitle">New collection</span>
            <span class="cs-action primary disabled" id="csNext">Next</span>
        </div>
        <div class="cs-step">
            <input type="text" class="cs-input" id="newCollectionName" placeholder="Collection name">
        </div>
    </div>
    <div id="csStepPick" class="cs-step-wrap" style="display:none;">
        <div class="cs-header">
            <span class="cs-action" id="csBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M15 6l-6 6 6 6"/></svg></span>
            <span class="cs-title">Add from saved</span>
            <span class="cs-action primary" id="csSave">Save</span>
        </div>
        <div class="cs-step"><div class="pick-grid" id="pickGrid"></div></div>
    </div>
</div>

<div class="mm-backdrop" id="mmBackdrop"></div>
<div class="mini-menu" id="miniMenu"></div>

<script>

    { id:12, img:'https://picsum.photos/seed/oryzon12/400/400', cap:'Small business packaging inspiration for skincare brand', source:'Made In Kano', type:'Group', category:'Product', date:'2017-05-08', dateDisplay:'8 May 2017' },
    { id:13, img:'https://picsum.photos/seed/oryzon13/400/300', cap:'Ramadan community iftar gathering — save the date', source:'Kano Islamic Center', type:'Page', category:'Event', date:'2024-03-01', dateDisplay:'1 Mar 2024' },
    { id:14, img:'https://picsum.photos/seed/oryzon14/400/300', cap:'Article: how small vendors are scaling on Oryzon marketplace', source:'Oryzon Blog', type:'Page', category:'Link', date:'2025-08-19', dateDisplay:'19 Aug 2025' },
    { id:15, img:'https://picsum.photos/seed/oryzon15/400/300', cap:'Late night nasheed compilation — 40 min audio', source:'Nasheed Hub', type:'Channel', category:'Audio', date:'2018-10-12', dateDisplay:'12 Oct 2018' },
];

let collections = [
    { id:1, name:'Girke-girke (Recipes)', itemIds:[1,3,4,8,9] },
    { id:2, name:'Kasuwanci', itemIds:[12,14] },
    { id:3, name:'Don Gida', itemIds:[6,2] },
];

let currentView = 'grid';
let currentMode = 'items';
let currentCat = 'all';
let searching = false;
let pickedIds = new Set();
let sheetMode = 'create';
let renamingId = null;

const ICONS = {
    grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="3" height="3" rx="0.6" fill="currentColor" stroke="none"/><line x1="10" y1="6.5" x2="20" y2="6.5"/><rect x="4" y="10.5" width="3" height="3" rx="0.6" fill="currentColor" stroke="none"/><line x1="10" y1="12" x2="20" y2="12"/><rect x="4" y="16" width="3" height="3" rx="0.6" fill="currentColor" stroke="none"/><line x1="10" y1="17.5" x2="20" y2="17.5"/></svg>',
    ellipsis: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0110 0v3"/></svg>',
    Page: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 3v18M5 4h12l-2.2 4L17 12H5"/></svg>',
    Group: '<svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3" fill="currentColor"/><circle cx="16" cy="10" r="2.5" fill="currentColor" opacity="0.7"/><path d="M3.5 19c0-3.3 2.7-5.5 5.5-5.5s5.5 2.2 5.5 5.5" fill="currentColor"/></svg>',

    eye: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    share: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7"/><path d="M16 6l-4-4-4 4"/><line x1="12" y1="2" x2="12" y2="15"/></svg>',
    plus: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'
};

function getById(id){ return items.find(i => i.id === id); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===== Saved items ===== */
function matchesSearch(item, q){
    if(!q) return true;
    q = q.toLowerCase();
    return item.cap.toLowerCase().includes(q) || item.source.toLowerCase().includes(q) || item.dateDisplay.toLowerCase().includes(q) || item.date.includes(q);
}
function filteredItems(){
    const q = searching ? document.getElementById('searchInput').value.trim() : '';
    return items.filter(it => (currentCat === 'all' || it.category === currentCat) && matchesSearch(it, q));
}
function renderItems(){
    const filtered = filteredItems();
    const q = searching ? document.getElementById('searchInput').value.trim() : '';
    const rc = document.getElementById('resultCount');
    rc.textContent = q ? `${filtered.length} result${filtered.length!==1?'s':''}` : '';
    rc.style.display = q ? 'block' : 'none';

    const grid = document.getElementById('gridView');
    const list = document.getElementById('listView');
    if(filtered.length === 0){
        grid.innerHTML = list.innerHTML = '<div class="empty-state">Babu abin da ya dace.</div>';
        return;
    }
    grid.innerHTML = filtered.map(it => `
        <div class="grid-card">
            <img src="${it.img}" loading="lazy">
            <div class="grid-type-badge">${ICONS[it.type]}</div>
            <div class="grid-caption">
                <div class="cap-text">${esc(it.cap)}</div>
                <div class="cap-meta">${esc(it.source)} · ${it.dateDisplay}</div>
            </div>
        </div>
    `).join('');
    list.innerHTML = filtered.map(it => `
        <div class="list-item">
            <img src="${it.img}" class="list-thumb">
            <div class="list-body">
                <div class="list-cap">${esc(it.cap)}</div>
                <div class="list-meta">${esc(it.source)} · ${it.dateDisplay}</div>
                <div class="list-type">${it.type}</div>
            </div>
            <span class="icon-btn item-menu-btn" data-id="${it.id}">${ICONS.ellipsis}</span>
        </div>
    `).join('');
    list.querySelectorAll('.item-menu-btn').forEach(btn => btn.addEventListener('click', e => openItemMenu(e, Number(btn.dataset.id))));
}

/* ===== Collections ===== */
function filteredCollections(){
    const q = searching ? document.getElementById('searchInput').value.trim().toLowerCase() : '';
    if(!q) return collections;
    return collections.filter(c => c.name.toLowerCase().includes(q));
}
function renderCollections(){
    const wrap = document.getElementById('collectionsView');
    const filtered = filteredCollections();
    const q = searching ? document.getElementById('searchInput').value.trim() : '';
    const rc = document.getElementById('resultCount');
    rc.textContent = q ? `${filtered.length} result${filtered.length!==1?'s':''}` : '';
    rc.style.display = q ? 'block' : 'none';

    if(filtered.length === 0){
        wrap.innerHTML = '<div class="empty-state">Babu wata collection.</div>';
        return;
    }
    wrap.innerHTML = filtered.map(c => {
        const cover = c.itemIds.length ? getById(c.itemIds[0]).img : '';
        return `
        <div class="collection-row">
            <img class="collection-cover" src="${cover}">
            <div class="collection-body">
                <div class="collection-name">${esc(c.name)}</div>
                <div class="collection-meta">${c.itemIds.length} item${c.itemIds.length!==1?'s':''} · ${ICONS.lock} Only me</div>
            </div>
            <span class="icon-btn cmenu-btn" data-id="${c.id}">${ICONS.ellipsis}</span>
        </div>`;
    }).join('');
    wrap.querySelectorAll('.cmenu-btn').forEach(btn => btn.addEventListener('click', e => openCollectionMenu(e, Number(btn.dataset.id))));
}

/* ===== Header / mode / search orchestration ===== */
function refreshChipRows(){
    document.getElementById('modeSwitch').style.display = searching ? 'none' : 'flex';
    document.getElementById('catScroll').style.display = (!searching && currentMode==='items') ? 'flex' : 'none';
}
function renderCurrent(){ currentMode==='items' ? renderItems() : renderCollections(); }

function switchMode(mode){
    currentMode = mode;
    document.getElementById('modeItems').classList.toggle('active', mode==='items');
    document.getElementById('modeCollections').classList.toggle('active', mode==='collections');
    const isItems = mode === 'items';
    document.getElementById('gridView').style.display = isItems && currentView==='grid' ? 'block' : 'none';
    document.getElementById('listView').style.display = isItems && currentView==='list' ? 'flex' : 'none';
    document.getElementById('collectionsView').style.display = isItems ? 'none' : 'flex';
    document.getElementById('viewToggle').style.display = isItems ? 'inline-flex' : 'none';
    refreshChipRows();
    renderCurrent();
    if(searching) document.getElementById('searchInput').placeholder = isItems ? 'Search saved items...' : 'Search collections...';
}

function openSearchInline(){
    searching = true;
    document.getElementById('savedTitleEl').style.display = 'none';
    document.getElementById('normalActions').style.display = 'none';
    document.getElementById('searchInlineWrap').classList.add('open');
    document.getElementById('cancelSearchBtn').style.display = 'inline-flex';
    document.getElementById('searchInput').placeholder = currentMode==='items' ? 'Search saved items...' : 'Search collections...';
    refreshChipRows();
    document.getElementById('searchInput').value = '';
    document.getElementById('searchInput').focus();
    renderCurrent();
}
function closeSearchInline(){
    searching = false;
    document.getElementById('savedTitleEl').style.display = 'block';
    document.getElementById('normalActions').style.display = 'flex';
    document.getElementById('searchInlineWrap').classList.remove('open');
    document.getElementById('cancelSearchBtn').style.display = 'none';
    refreshChipRows();
    renderCurrent();
}
function onBackClick(){
    if(searching){ closeSearchInline(); return; }
    if (window.parent && window.parent !== window && typeof window.parent.closePageOverlay === 'function') {
        window.parent.closePageOverlay();
    } else {
        history.back();
    }
}

function toggleView(){
    if(currentMode !== 'items') return;
    currentView = currentView === 'grid' ? 'list' : 'grid';
    const icon = document.getElementById('viewToggle');
    document.getElementById('gridView').style.display = currentView === 'grid' ? 'block' : 'none';
    document.getElementById('listView').style.display = currentView === 'list' ? 'flex' : 'none';
    icon.innerHTML = currentView === 'grid' ? ICONS.grid : ICONS.list;
}

/* ===== New / rename collection sheet ===== */
function openCollectionSheet(renameId){
    sheetMode = renameId ? 'rename' : 'create';
    renamingId = renameId || null;
    pickedIds.clear();
    document.getElementById('csNameTitle').textContent = renameId ? 'Rename collection' : 'New collection';
    document.getElementById('csNext').textContent = renameId ? 'Save' : 'Next';
    document.getElementById('newCollectionName').value = renameId ? collections.find(c=>c.id===renameId).name : '';
    document.getElementById('csNext').classList.toggle('disabled', !document.getElementById('newCollectionName').value.trim());
    document.getElementById('csStepName').style.display = 'block';
    document.getElementById('csStepPick').style.display = 'none';
    document.getElementById('csBackdrop').classList.add('Active');
    document.getElementById('collectionSheet').classList.add('Active');
}
function closeCollectionSheet(){
    document.getElementById('csBackdrop').classList.remove('Active');
    document.getElementById('collectionSheet').classList.remove('Active');
}
function csNextAction(){
    const name = document.getElementById('newCollectionName').value.trim();
    if(!name) return;
    if(sheetMode === 'rename'){
        const c = collections.find(c => c.id === renamingId);
        if(c) c.name = name;
        closeCollectionSheet();
        renderCollections();
        return;
    }
    document.getElementById('csStepName').style.display = 'none';
    document.getElementById('csStepPick').style.display = 'block';
    renderPickGrid();
}
function renderPickGrid(){
    const grid = document.getElementById('pickGrid');
    grid.innerHTML = items.map(it => `
        <div class="pick-item" data-id="${it.id}">
            <img src="${it.img}">
            <div class="pick-check">${ICONS.check}</div>
        </div>
    `).join('');
    grid.querySelectorAll('.pick-item').forEach(el => {
        el.addEventListener('click', () => {
            const id = Number(el.dataset.id);
            if(pickedIds.has(id)){ pickedIds.delete(id); el.classList.remove('selected'); }
            else { pickedIds.add(id); el.classList.add('selected'); }
        });
    });
}
function saveNewCollection(){
    const name = document.getElementById('newCollectionName').value.trim();
    if(!name) return;
    collections.unshift({ id: Date.now(), name, itemIds: Array.from(pickedIds) });
    closeCollectionSheet();
    switchMode('collections');
}
function deleteCollection(id){
    if(!confirm('Tabbatar kana son share wannan collection?')) return;
    collections = collections.filter(c => c.id !== id);
    renderCollections();
}

/* ===== Glass mini menus ===== */
function positionMenu(anchorRect){
    const menu = document.getElementById('miniMenu');
    menu.style.top = (anchorRect.bottom + 6) + 'px';
    menu.style.right = (window.innerWidth - anchorRect.right) + 'px';
}
function openMenu(html){
    document.getElementById('miniMenu').innerHTML = html;
    document.getElementById('miniMenu').classList.add('Active');
    document.getElementById('mmBackdrop').classList.add('Active');
}
function closeMiniMenu(){
    document.getElementById('miniMenu').classList.remove('Active');
    document.getElementById('mmBackdrop').classList.remove('Active');
}
function openCollectionMenu(e, collectionId){
    e.stopPropagation();
    positionMenu(e.currentTarget.getBoundingClientRect());
    openMenu(`
        <div class="mini-menu-item" id="mmRename">${ICONS.edit} Rename collection</div>
        <div class="mini-menu-item danger" id="mmDelete">${ICONS.trash} Delete collection</div>
    `);
    document.getElementById('mmRename').addEventListener('click', () => { closeMiniMenu(); openCollectionSheet(collectionId); });
    document.getElementById('mmDelete').addEventListener('click', () => { closeMiniMenu(); deleteCollection(collectionId); });
}
function openItemMenu(e, itemId){
    e.stopPropagation();
    positionMenu(e.currentTarget.getBoundingClientRect());
    openMenu(`
        <div class="mini-menu-item" id="miAdd">${ICONS.bookmark} Add to Collection</div>
        <div class="mini-menu-item" id="miUnsave">${ICONS.bookmarkSlash} Unsave</div>
        <div class="mini-menu-item" id="miView">${ICONS.eye} View Post</div>
        <div class="mini-menu-item" id="miShare">${ICONS.share} Share</div>
    `);
    document.getElementById('miAdd').addEventListener('click', () => openAddToCollectionMenu(itemId));
    document.getElementById('miUnsave').addEventListener('click', () => {
        closeMiniMenu();
        const idx = items.findIndex(i => i.id === itemId);
        if(idx > -1) items.splice(idx, 1);
        renderItems();
    });
    document.getElementById('miView').addEventListener('click', closeMiniMenu);
    document.getElementById('miShare').addEventListener('click', () => { closeMiniMenu(); if(navigator.share){ navigator.share({title:'Oryzon', text:getById(itemId)?.cap || ''}); } });
}
function openAddToCollectionMenu(itemId){
    const rows = collections.map(c => {
        const inIt = c.itemIds.includes(itemId);
        return `<div class="mini-menu-item checked" data-cid="${c.id}">${esc(c.name)} ${inIt ? ICONS.check : ''}</div>`;
    }).join('');
    openMenu(rows + `<div class="mini-menu-item" id="miNewFromItem">${ICONS.plus} New collection</div>`);
    document.getElementById('miniMenu').querySelectorAll('[data-cid]').forEach(row => {
        row.addEventListener('click', () => {
            const cid = Number(row.dataset.cid);
            const c = collections.find(c => c.id === cid);
            const pos = c.itemIds.indexOf(itemId);
            if(pos > -1) c.itemIds.splice(pos, 1); else c.itemIds.push(itemId);
            closeMiniMenu();
        });
    });
    document.getElementById('miNewFromItem').addEventListener('click', () => { closeMiniMenu(); openCollectionSheet(); pickedIds.add(itemId); });
}

document.getElementById('backBtn').addEventListener('click', onBackClick);
document.getElementById('searchToggle').addEventListener('click', openSearchInline);
document.getElementById('cancelSearchBtn').addEventListener('click', closeSearchInline);
document.getElementById('viewToggle').addEventListener('click', toggleView);
document.getElementById('addBtn').addEventListener('click', () => openCollectionSheet());
document.getElementById('modeItems').addEventListener('click', () => switchMode('items'));
document.getElementById('modeCollections').addEventListener('click', () => switchMode('collections'));
document.getElementById('searchInput').addEventListener('input', renderCurrent);
document.getElementById('csCancel').addEventListener('click', closeCollectionSheet);
document.getElementById('csBack').addEventListener('click', () => { document.getElementById('csStepPick').style.display='none'; document.getElementById('csStepName').style.display='block'; });
document.getElementById('csSave').addEventListener('click', saveNewCollection);
document.getElementById('csBackdrop').addEventListener('click', closeCollectionSheet);
document.getElementById('newCollectionName').addEventListener('input', (e) => {
    document.getElementById('csNext').classList.toggle('disabled', !e.target.value.trim());
});
document.getElementById('csNext').addEventListener('click', csNextAction);
document.getElementById('mmBackdrop').addEventListener('click', closeMiniMenu);

document.querySelectorAll('.cat-chip').forEach(chip => {
    chip.addEventListener('click', () => {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentCat = chip.dataset.cat;
        renderItems();
    });
});

renderItems();
document.getElementById('listView').style.display = 'none';
document.getElementById('resultCount').style.display = 'none';
</script>
</body>
</html>
