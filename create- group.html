<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>New Group - Nexus</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
    :root {
        --cyan-neon: #00F2FF;
        --magenta-neon: #FF0055;
        --red-danger: #FF4D4D;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050505; color: #fff; min-height: 100vh; padding-bottom: 40px; }
    header {
        position: sticky; top: 0; z-index: 20;
        background: rgba(5,5,5,0.55);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        padding: 12px 16px 8px 16px;
        display: flex; align-items: center; gap: 14px;
    }
    .back-trigger { cursor: pointer; display: flex; align-items: center; flex-shrink: 0; }
    header h1 { font-size: 19px; font-weight: 700; }

    .photo-picker-wrap { display: flex; justify-content: center; padding: 18px 0 10px 0; }
    .photo-picker {
        width: 96px; height: 96px; border-radius: 22px;
        background: linear-gradient(135deg, rgba(0,242,255,0.12), rgba(255,0,85,0.12));
        border: 1.5px dashed rgba(0,242,255,0.4);
        display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px;
        cursor: pointer;
    }
    .photo-picker span { font-size: 11px; color: rgba(255,255,255,0.5); }

    .field-group { padding: 10px 16px 0 16px; }
    .field-input {
        width: 100%; background: rgba(255,255,255,0.06); border: none; border-radius: 12px;
        padding: 12px 14px; color: #fff; font-size: 15px; outline: none; resize: none; font-family: inherit;
    }
    .field-input:focus { box-shadow: 0 0 0 1.5px var(--cyan-neon); }
    .field-input::placeholder { color: rgba(255,255,255,0.4); }
    .char-count { text-align: right; font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 4px; padding-right: 2px; }
    .slug-preview { font-size: 11.5px; color: rgba(255,255,255,0.4); margin-top: 6px; padding-left: 2px; display: flex; align-items: center; gap: 6px; min-height: 16px; }
    .slug-preview.taken { color: var(--red-danger); }
    .slug-preview.available { color: #1EE676; }
    .slug-spinner { width: 11px; height: 11px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--cyan-neon); animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .section-label { padding: 18px 16px 6px 16px; font-size: 13px; font-weight: 600; color: var(--cyan-neon); text-transform: uppercase; letter-spacing: 0.4px; }

    .privacy-row { display: flex; align-items: center; gap: 14px; padding: 10px 16px; cursor: pointer; }
    .privacy-row:active { background: rgba(255,255,255,0.04); }
    .privacy-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: rgba(255,255,255,0.06); }
    .privacy-text { flex: 1; }
    .privacy-text h3 { font-size: 15px; font-weight: 500; }
    .privacy-text p { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 1px; }
    .radio-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .radio-dot.checked { border-color: var(--cyan-neon); }
    .radio-dot.checked::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--cyan-neon); }

    .ownership-note {
        margin: 18px 16px 0 16px; padding: 12px 14px; border-radius: 12px;
        background: rgba(0,242,255,0.06); border: 1px solid rgba(0,242,255,0.2);
        font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.5;
        display: flex; gap: 10px; align-items: flex-start;
    }
    .ownership-note svg { flex-shrink: 0; margin-top: 1px; }

    .create-btn-wrap { padding: 22px 16px 0 16px; }
    .create-btn {
        width: 100%; text-align: center; padding: 14px; border-radius: 14px;
        background: linear-gradient(135deg, var(--cyan-neon), var(--magenta-neon));
        color: #050505; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .create-btn.disabled { opacity: 0.35; pointer-events: none; }

    .error-banner {
        margin: 12px 16px 0 16px; padding: 10px 14px; border-radius: 10px;
        background: rgba(255,77,77,0.1); border: 1px solid rgba(255,77,77,0.3);
        color: var(--red-danger); font-size: 12.5px; display: none;
    }
    .error-banner.show { display: block; }
</style>
</head>
<body>

    <header>
        <div class="back-trigger" onclick="window.location.href='create-group.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M11 17l-5-5 5-5M18 12H6"/></svg>
        </div>
        <h1>New Group</h1>
    </header>

    <div class="photo-picker-wrap">
        <div class="photo-picker" onclick="showToast('Photo upload isn\'t wired up yet \u2014 the group will use its initials as an icon for now.')">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--cyan-neon)" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Add Photo</span>
        </div>
    </div>

    <div class="field-group">
        <input type="text" class="field-input" id="groupName" placeholder="Group name" maxlength="30" oninput="onNameInput();" autocomplete="off">
        <div class="char-count"><span id="nameCount">0</span>/30</div>
        <div class="slug-preview" id="slugPreview"></div>
    </div>

    <div class="field-group">
        <textarea class="field-input" id="groupDesc" placeholder="Description (optional)" rows="3" maxlength="120" oninput="updateCounts();"></textarea>
        <div class="char-count"><span id="descCount">0</span>/120</div>
    </div>

    <div class="section-label">Group Type</div>

    <div class="privacy-row" onclick="setPrivacy('public')">
        <div class="privacy-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </div>
        <div class="privacy-text">
            <h3>Public Group</h3>
            <p>Anyone can find and join via link or search</p>
        </div>
        <div class="radio-dot checked" id="radioPublic"></div>
    </div>

    <div class="privacy-row" onclick="setPrivacy('private')">
        <div class="privacy-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div class="privacy-text">
            <h3>Private Group</h3>
            <p>Only people with an invite link can join</p>
        </div>
        <div class="radio-dot" id="radioPrivate"></div>
    </div>

    <div class="ownership-note">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--cyan-neon)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>You'll be the permanent owner and admin of this group — that can't be transferred or taken over by anyone else.</span>
    </div>

    <div class="error-banner" id="errorBanner"></div>

    <div class="create-btn-wrap">
        <div class="create-btn disabled" id="createBtn" onclick="createGroup()">Create Group</div>
    </div>

    <div class="toast" id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:12.5px;padding:10px 18px;border-radius:20px;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s ease;max-width:88%;text-align:center;"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDExSOnFbN-wJbT1UFgB-kBs37bEa3KiWc",
        authDomain: "oryzon-50ea4.firebaseapp.com",
        databaseURL: "https://oryzon-50ea4-default-rtdb.firebaseio.com",
        projectId: "oryzon-50ea4",
        storageBucket: "oryzon-50ea4.firebasestorage.app",
        messagingSenderId: "782106742622",
        appId: "1:782106742622:web:902d512bfe42dd4cf289cf",
        measurementId: "G-K5085DLL2W"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const FieldValue = firebase.firestore.FieldValue;
    const LOGIN_PAGE_URL = 'login.html'; // <-- change to your real sign-in page filename if different

    const currentUsername = localStorage.getItem('nexus_user_session');
    if (!currentUsername) {
        window.location.href = LOGIN_PAGE_URL + '?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
    }
    let authReadyResolve;
    const authReadyPromise = new Promise(resolve => { authReadyResolve = resolve; });
    auth.onAuthStateChanged(user => { authReadyResolve(user); });

    let selectedPrivacy = 'public';
    let slugCheckToken = 0;

    function setPrivacy(type) {
        selectedPrivacy = type;
        document.getElementById('radioPublic').classList.toggle('checked', type === 'public');
        document.getElementById('radioPrivate').classList.toggle('checked', type === 'private');
    }

    function slugify(name) {
        return name.toLowerCase().trim()
            .replace(/[^a-z0-9\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-')
            .replace(/^-|-$/g, '')
            .slice(0, 40);
    }

    function updateCounts() {
        document.getElementById('nameCount').textContent = document.getElementById('groupName').value.length;
        document.getElementById('descCount').textContent = document.getElementById('groupDesc').value.length;
    }

    function onNameInput() {
        updateCounts();
        const name = document.getElementById('groupName').value.trim();
        const btn = document.getElementById('createBtn');
        const preview = document.getElementById('slugPreview');

        if (!name) {
            btn.classList.add('disabled');
            preview.textContent = '';
            preview.className = 'slug-preview';
            return;
        }

        const slug = slugify(name) || 'group';
        preview.className = 'slug-preview';
        preview.innerHTML = '<span class="slug-spinner"></span> nexus.app/g/' + slug;
        btn.classList.add('disabled');

        const myToken = ++slugCheckToken;
        clearTimeout(window._slugDebounce);
        window._slugDebounce = setTimeout(async () => {
            try {
                const doc = await db.collection('groups').doc(slug).get();
                if (myToken !== slugCheckToken) return;
                if (doc.exists) {
                    preview.className = 'slug-preview taken';
                    preview.textContent = 'nexus.app/g/' + slug + ' \u2014 already taken, a number will be added automatically';
                } else {
                    preview.className = 'slug-preview available';
                    preview.textContent = 'nexus.app/g/' + slug + ' \u2014 available';
                }
                btn.classList.remove('disabled');
            } catch (e) {
                if (myToken !== slugCheckToken) return;
                preview.className = 'slug-preview';
                preview.textContent = '';
                btn.classList.remove('disabled');
            }
        }, 400);
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 2600);
    }
    function showError(msg) {
        const banner = document.getElementById('errorBanner');
        banner.textContent = msg;
        banner.classList.add('show');
    }
    function clearError() { document.getElementById('errorBanner').classList.remove('show'); }

    async function findAvailableSlug(baseSlug) {
        let slug = baseSlug;
        let attempt = 0;
        while (attempt < 8) {
            const doc = await db.collection('groups').doc(slug).get();
            if (!doc.exists) return slug;
            attempt++;
            slug = baseSlug + '-' + Math.random().toString(36).slice(2, 6);
        }
        return baseSlug + '-' + Date.now().toString(36);
    }

    async function createGroup() {
        clearError();
        const name = document.getElementById('groupName').value.trim();
        const desc = document.getElementById('groupDesc').value.trim();
        if (!name) return;
        if (!currentUsername) { showError('You need to be signed in to create a group.'); return; }

        const btn = document.getElementById('createBtn');
        btn.classList.add('disabled');
        btn.textContent = 'Creating...';

        try {
            const authUser = await authReadyPromise;
            if (!authUser) { showError('You need to be signed in to create a group.'); btn.textContent = 'Create Group'; btn.classList.remove('disabled'); return; }

            const baseSlug = slugify(name) || 'group';
            const finalSlug = await findAvailableSlug(baseSlug);
            const initials = name.trim().slice(0, 2).toUpperCase();

            await db.collection('groups').doc(finalSlug).set({
                name: name,
                initials: initials,
                description: desc,
                privacy: selectedPrivacy,
                link: 'nexus.app/g/' + finalSlug,
                memberCount: 1,
                creatorUsername: currentUsername,
                adminUsernames: [currentUsername],
                createdAt: FieldValue.serverTimestamp()
            });

            await db.collection('groups').doc(finalSlug).collection('members').doc(currentUsername).set({
                joinedAt: FieldValue.serverTimestamp(),
                role: 'owner'
            });

            window.location.href = 'group.html?group=' + encodeURIComponent(finalSlug);
        } catch (e) {
            console.error('Create group error:', e);
            btn.textContent = 'Create Group';
            btn.classList.remove('disabled');
            if (e && e.code === 'permission-denied') {
                showError('Firestore denied this \u2014 your Security Rules need to allow writes to /groups/{id} for signed-in users.');
            } else {
                showError('Could not create the group \u2014 please try again.');
            }
        }
    }
</script>

</body>
</html>
