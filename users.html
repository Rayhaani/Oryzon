<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>NEXUS - Users</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #050505; --surface: #0f0f0f; --surface2: #141414; --raised: #191919; --sel: #272727;
  --line: #1f1f1f; --line2: #2a2a2a; --txt: #ffffff; --txt2: #d4d4d4; --muted: #838383; --faint: #5c5c5c;
  --ok: #4ade80; --warn: #f5b942; --bad: #f87171; --info: #a3a3a3;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
html, body { background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 14px; min-height: 100vh; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
svg.ic { width: 1em; height: 1em; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 200; background: rgba(5,5,5,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); height: 56px; display: flex; align-items: center; padding: 0 16px; gap: 12px; }
.back-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; color: var(--txt); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; margin-left: -6px; }
.back-btn:hover { background: var(--surface2); }
.page-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.2px; flex: 1; }
.top-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--txt2); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 6px 10px; white-space: nowrap; }
@media (max-width: 420px) { .top-pill { font-size: 11px; padding: 5px 8px; gap: 5px; } .topbar { gap: 8px; padding: 0 12px; } }
.top-pill b { color: var(--txt); font-weight: 700; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.dot.live { animation: pulse 1.6s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.main { padding: 16px; max-width: 960px; margin: 0 auto; }

/* stat tiles */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
button.stat-box { color: var(--txt); font-family: inherit; }
.stat-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 14px 12px; cursor: default; text-align: left; }
.stat-box.click { cursor: pointer; }
.stat-box.click:hover { border-color: var(--line2); }
.stat-box .sl { font-size: 12px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 7px; }
.stat-box .sv { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-top: 6px; line-height: 1; }

/* controls */
.controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
.search-box { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; color: var(--muted); font-size: 16px; }
.search-box:focus-within { border-color: #4a4a4a; }
.search-box input { flex: 1; background: none; border: none; outline: none; color: var(--txt); font-size: 15px; padding: 13px 0; font-family: inherit; min-width: 0; }
.search-box input::placeholder { color: #6b6b6b; }
.filter-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-btn { flex-shrink: 0; padding: 8px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.filter-btn:hover { color: var(--txt2); }
.filter-btn.active { background: var(--sel); border-color: var(--sel); color: var(--txt); }
.count-badge { min-width: 18px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--txt); color: #050505; font-size: 11px; font-weight: 700; display: none; align-items: center; justify-content: center; }
.list-count { font-size: 12px; color: var(--muted); margin-bottom: 10px; font-weight: 500; }

/* chips */
.status-chip, .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px; white-space: nowrap; background: var(--raised); color: var(--txt2); }
.chip.warn { color: var(--warn); background: rgba(245,185,66,0.10); }
.chip.bad { color: var(--bad); background: rgba(248,113,113,0.10); }
.chip.ok { color: var(--ok); background: rgba(74,222,128,0.10); }
.chip.muted { color: var(--muted); }

/* buttons */
.act-btn { flex: 1 1 auto; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; color: var(--txt2); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.act-btn:hover { background: var(--raised); }
.act-btn.primary { background: var(--txt); border-color: var(--txt); color: #050505; }
.act-btn.primary:hover { background: #e5e5e5; }
.act-btn.danger { color: var(--bad); border-color: rgba(248,113,113,0.28); }
.act-btn.danger:hover { background: rgba(248,113,113,0.08); }
.act-btn.icon-only { flex: 0 0 auto; padding: 10px 12px; }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }

.load-more-btn { width: 100%; padding: 13px; margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--txt2); font-size: 14px; font-weight: 600; cursor: pointer; display: none; }
.load-more-btn:hover { background: var(--raised); }

.empty-state { text-align: center; padding: 64px 20px; color: var(--muted); }
.empty-state .ei { font-size: 30px; margin-bottom: 12px; color: var(--faint); display: flex; justify-content: center; }
.empty-state .et { font-size: 15px; font-weight: 600; color: var(--txt2); }
.empty-state .es { font-size: 13px; margin-top: 6px; }
.loading-state { text-align: center; padding: 56px 20px; color: var(--muted); font-size: 14px; }
.spinner { width: 22px; height: 22px; border: 2px solid var(--sel); border-top-color: var(--txt); border-radius: 50%; margin: 0 auto 12px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* modals */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 9999; display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal-box, .dialog-box { background: var(--bg); border: 1px solid var(--line); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; animation: slideUp .22s ease forwards; }
.dialog-box { padding: 22px 20px calc(20px + env(safe-area-inset-bottom, 0px)); max-width: 440px; }
@keyframes slideUp { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (min-width: 700px) { .modal-overlay { align-items: center; padding: 20px; } .modal-box, .dialog-box { border-radius: 22px; } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; position: sticky; top: 0; background: var(--bg); z-index: 2; border-bottom: 1px solid var(--line); }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close { width: 32px; height: 32px; border-radius: 50%; background: var(--raised); border: none; color: var(--txt2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.modal-body { padding: 8px 20px 24px; }
.modal-field { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); gap: 16px; }
.modal-field:last-child { border-bottom: none; }
.mfk { font-size: 13px; color: var(--muted); font-weight: 500; flex-shrink: 0; }
.mfv { font-size: 14px; color: var(--txt); font-weight: 500; text-align: right; word-break: break-word; }
.sec-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
.dialog-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.2px; }
.dialog-sub { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 16px; }
.opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.opt { padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--txt2); font-size: 14px; font-weight: 500; cursor: pointer; text-align: left; }
.opt:hover { background: var(--raised); }
.opt.selected { background: var(--sel); border-color: var(--sel); color: var(--txt); }
.text-area, .text-input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--txt); font-size: 16px; padding: 13px 14px; outline: none; margin-bottom: 14px; font-family: inherit; resize: none; }
.text-area:focus, .text-input:focus { border-color: #4a4a4a; }
.text-area.hidden { display: none; }
.dialog-actions { display: flex; flex-direction: column; gap: 8px; }
.btn-main { width: 100%; padding: 14px; background: var(--txt); border: none; border-radius: 14px; color: #050505; font-size: 15px; font-weight: 700; cursor: pointer; }
.btn-main.danger { background: var(--bad); color: #050505; }
.btn-ghost { width: 100%; padding: 13px; background: var(--raised); border: none; border-radius: 14px; color: var(--txt2); font-size: 14px; font-weight: 600; cursor: pointer; }

/* toast */
.toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--sel); color: var(--txt); padding: 12px 20px; border-radius: 24px; font-size: 14px; font-weight: 600; z-index: 99999; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: toastIn .25s ease; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%); } }

@media (max-width: 560px) { .stats-row { grid-template-columns: repeat(2, 1fr); } .main { padding: 14px; } }

.users-list { display: flex; flex-direction: column; gap: 12px; }
.user-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.user-card:hover { border-color: var(--line2); }
.user-card.banned { border-color: rgba(248,113,113,0.35); }
.user-card.suspended { border-color: rgba(245,185,66,0.35); }
.card-top { display: flex; align-items: center; gap: 12px; }
.avatar-btn { flex-shrink: 0; cursor: pointer; border: none; background: none; padding: 0; border-radius: 50%; }
.avatar-btn:hover { opacity: .85; }
.user-avatar, .user-avatar-fallback { width: 46px; height: 46px; border-radius: 50%; display: block; object-fit: cover; }
.user-avatar-fallback { display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: var(--txt2); background: var(--raised); }
.card-identity { flex: 1; min-width: 0; }
.user-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-handle { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.meta-item { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.meta-label { font-size: 12px; color: var(--muted); font-weight: 500; }
.meta-value { font-size: 14px; color: var(--txt); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta-value.online-now { color: var(--ok); }
.card-stats { display: flex; gap: 20px; font-size: 13px; color: var(--muted); }
.card-stats b { color: var(--txt); font-weight: 600; margin-right: 4px; }
.profile-cover { width: 100%; height: 96px; border-radius: 14px; object-fit: cover; background: var(--raised); margin-top: 12px; display: block; }
.profile-avatar-wrap { margin: -30px 0 6px 14px; position: relative; width: 64px; }
.profile-avatar-lg { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid var(--bg); display: block; }
.profile-avatar-fallback-lg { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: var(--txt2); background: var(--raised); border: 3px solid var(--bg); }
.mfv.ok { color: var(--ok); } .mfv.bad { color: var(--bad); } .mfv.warn { color: var(--warn); }

</style>
</head>
<body>

<header class="topbar">
  <button class="back-btn" type="button" data-ic="back" aria-label="Back" onclick="window.location.href='admin.html'"></button>
  <h1 class="page-title">Users</h1>
  <span class="top-pill"><span class="dot ok live"></span><b id="online-count">0</b> Online</span>
</header>

<main class="main">
  <section class="stats-row" aria-label="Summary">
    <div class="stat-box"><div class="sl"><span class="dot"></span>Total users</div><div class="sv" id="s-total">—</div></div>
    <div class="stat-box"><div class="sl"><span class="dot ok"></span>Online now</div><div class="sv" id="s-online">—</div></div>
    <div class="stat-box"><div class="sl"><span class="dot bad"></span>Banned</div><div class="sv" id="s-banned">—</div></div>
    <div class="stat-box"><div class="sl"><span class="dot warn"></span>New today</div><div class="sv" id="s-new">—</div></div>
  </section>

  <section class="controls">
    <label class="search-box" data-ic="search">
      <input type="text" id="search-input" placeholder="Search by username or name" autocomplete="off">
    </label>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="online">Online</button>
      <button class="filter-btn" data-filter="offline">Offline</button>
      <button class="filter-btn" data-filter="banned">Banned</button>
      <button class="filter-btn" data-filter="suspended">Suspended</button>
      <button class="filter-btn" data-filter="new">New today</button>
    </div>
  </section>

  <div class="list-count" id="users-count">Loading…</div>
  <div class="users-list" id="users-list">
    <div class="loading-state"><div class="spinner"></div>Loading users…</div>
  </div>
  <button class="load-more-btn" id="load-more-btn" type="button" data-act="more">Load more</button>
</main>

<!-- PROFILE -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="profile-title">
    <div class="modal-header">
      <span class="modal-title" id="profile-title">User profile</span>
      <button class="modal-close" type="button" data-act="close" data-modal="profile-modal" aria-label="Close" data-ic="x"></button>
    </div>
    <div class="modal-body" id="profile-modal-body"></div>
  </div>
</div>

<!-- BAN -->
<div class="modal-overlay" id="ban-modal">
  <div class="dialog-box" role="dialog" aria-modal="true">
    <div class="dialog-title">Ban user</div>
    <div class="dialog-sub" id="ban-modal-sub">Select a reason for banning this user.</div>
    <div class="opts">
      <button class="opt" type="button" data-act="ban-reason" data-reason="Spam or fake account">Spam or fake account</button>
      <button class="opt" type="button" data-act="ban-reason" data-reason="Harassment or abuse">Harassment or abuse</button>
      <button class="opt" type="button" data-act="ban-reason" data-reason="Inappropriate content">Inappropriate content</button>
      <button class="opt" type="button" data-act="ban-reason" data-reason="Fraud or scam">Fraud or scam</button>
      <button class="opt" type="button" data-act="ban-reason" data-reason="custom">Custom reason</button>
    </div>
    <textarea class="text-area hidden" id="ban-custom-input" rows="3" placeholder="Enter a reason"></textarea>
    <div class="dialog-actions">
      <button class="btn-main danger" type="button" data-act="confirm-ban">Ban user</button>
      <button class="btn-ghost" type="button" data-act="close" data-modal="ban-modal">Cancel</button>
    </div>
  </div>
</div>

<!-- SUSPEND -->
<div class="modal-overlay" id="suspend-modal">
  <div class="dialog-box" role="dialog" aria-modal="true">
    <div class="dialog-title">Suspend user</div>
    <div class="dialog-sub" id="suspend-modal-sub">Select a reason for suspending this user temporarily.</div>
    <div class="opts">
      <button class="opt" type="button" data-act="suspend-reason" data-reason="Suspicious activity">Suspicious activity</button>
      <button class="opt" type="button" data-act="suspend-reason" data-reason="Pending verification">Pending verification</button>
      <button class="opt" type="button" data-act="suspend-reason" data-reason="Policy violation under review">Policy violation under review</button>
      <button class="opt" type="button" data-act="suspend-reason" data-reason="custom">Custom reason</button>
    </div>
    <textarea class="text-area hidden" id="suspend-custom-input" rows="3" placeholder="Enter a reason"></textarea>
    <div class="dialog-actions">
      <button class="btn-main" type="button" data-act="confirm-suspend">Suspend user</button>
      <button class="btn-ghost" type="button" data-act="close" data-modal="suspend-modal">Cancel</button>
    </div>
  </div>
</div>

<!-- DELETE -->
<div class="modal-overlay" id="delete-modal">
  <div class="dialog-box" role="dialog" aria-modal="true">
    <div class="dialog-title">Delete account</div>
    <div class="dialog-sub" id="delete-modal-msg">This permanently deletes the account and cannot be undone.</div>
    <div class="dialog-actions">
      <button class="btn-main danger" type="button" data-act="confirm-delete">Delete permanently</button>
      <button class="btn-ghost" type="button" data-act="close" data-modal="delete-modal">Cancel</button>
    </div>
  </div>
</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const IC = {
  back: '<path d="M15 5l-7 7 7 7"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  pause: '<path d="M8 5v14M16 5v14"/>', play: '<path d="M7 4.5v15l12-7.5z"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/>',
  flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>', warn: '<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.01"/>',
  pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/>',
  id: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6.5 16c.6-1.6 1.7-2.2 2.5-2.2s1.9.6 2.5 2.2M14 10h4M14 13h3"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>', image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>',
  video: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>', star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>', shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.5-5 6.5-5s5.7 1.5 6.5 5M16 4.5a3.5 3.5 0 010 7M18 15c2 .5 3.2 2 3.5 5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', ban: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  tool: '<path d="M14.5 6.5a4 4 0 00-5 5L3 18l3 3 6.5-6.5a4 4 0 005-5l-2.5 2.5-2.5-.5-.5-2.5z"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>', inbox: '<path d="M3 13l3-8h12l3 8v6H3v-6zM3 13h5l1 3h6l1-3h5"/>'
};
function ic(name) { return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (IC[name] || '') + '</svg>'; }
function hydrateIcons(root) { (root || document).querySelectorAll('[data-ic]').forEach(function (el) { if (!el.dataset.done) { el.insertAdjacentHTML('afterbegin', ic(el.dataset.ic)); el.dataset.done = '1'; } }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function safeUrl(u) { u = String(u || ''); return /^https?:\/\//i.test(u) ? u : ''; }

// ── STATE ──
let allUsers = [];
let filteredUsers = [];
let currentFilter = "all";
let searchQuery = "";
let selectedBanReason = "";
let selectedSuspendReason = "";
let pendingBanUsername = "";
let pendingSuspendUsername = "";
let pendingDeleteUsername = "";
let displayCount = 20;
const PAGE_SIZE = 20;

function getInitials(name) {
    if (!name) return "?";
    const parts = String(name).trim().split(/\s+/);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return parts[0].substring(0, 2).toUpperCase();
}

// ── DATES ──
function toJsDate(timestamp) {
    if (!timestamp) return null;
    if (timestamp.toDate) return timestamp.toDate();
    return new Date(timestamp);
}
function formatDate(timestamp) {
    const date = toJsDate(timestamp);
    if (!date || isNaN(date.getTime())) return "—";
    return date.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}
function timeAgo(timestamp) {
    const date = toJsDate(timestamp);
    if (!date || isNaN(date.getTime())) return "—";
    const seconds = Math.floor((new Date() - date) / 1000);
    if (seconds < 60) return "just now";
    if (seconds < 3600) return Math.floor(seconds / 60) + "m ago";
    if (seconds < 86400) return Math.floor(seconds / 3600) + "h ago";
    if (seconds < 2592000) return Math.floor(seconds / 86400) + "d ago";
    return formatDate(timestamp);
}
function isToday(timestamp) {
    const date = toJsDate(timestamp);
    if (!date) return false;
    return date.toDateString() === new Date().toDateString();
}
function calculateAge(dob) {
    if (!dob) return null;
    const birth = new Date(dob);
    if (isNaN(birth.getTime())) return null;
    const today = new Date();
    let age = today.getFullYear() - birth.getFullYear();
    const m = today.getMonth() - birth.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
    return age >= 0 ? age : null;
}
function getLastSeenLabel(u) {
    if (u.isOnline === true) return { text: "Online now", isOnline: true };
    const raw = u.lastSeen || u.lastSeenTimestamp || u.lastActive || u.lastActiveTimestamp || u.updatedAt;
    if (!raw) return { text: "—", isOnline: false };
    return { text: "Last seen " + timeAgo(raw), isOnline: false };
}
function getCountry(u) { return u.country || u.userCountry || u.location?.country || "—"; }
function getTown(u) { return u.town || u.city || u.userTown || u.userCity || u.location?.city || "—"; }
function getContact(u) { return u.routingIdentity || u.email || u.phone || u.phoneNumber || "—"; }

// ── LOAD USERS ──
function loadUsers() {
    db.collection("users")
        .orderBy("registrationTimestamp", "desc")
        .onSnapshot(async (snap) => {
            allUsers = await Promise.all(snap.docs.map(async (doc) => {
                const data = doc.data();
                let postCount = 0;
                try {
                    const postsCount = await db.collection("posts").where("username", "==", doc.id).count().get();
                    postCount = postsCount.data().count;
                } catch (e) {}
                let likesCount = 0;
                try {
                    const likesCountSnap = await db.collection("likes").where("user", "==", doc.id).count().get();
                    likesCount = likesCountSnap.data().count;
                } catch (e) {}
                return { id: doc.id, ...data, postCount, likesCount };
            }));
            updateStats();
            applyFilters();
        }, (err) => {
            document.getElementById("users-list").innerHTML =
                `<div class="empty-state"><div class="ei">${ic("warn")}</div><div class="et">Could not load users</div><div class="es">${esc(err.message)}</div></div>`;
        });
}

function updateStats() {
    const online = allUsers.filter(u => u.isOnline === true).length;
    document.getElementById("s-total").textContent = allUsers.length;
    document.getElementById("s-online").textContent = online;
    document.getElementById("s-banned").textContent = allUsers.filter(u => u.banned === true).length;
    document.getElementById("s-new").textContent = allUsers.filter(u => isToday(u.registrationTimestamp)).length;
    document.getElementById("online-count").textContent = online;
}

function applyFilters() {
    filteredUsers = allUsers.filter(u => {
        if (currentFilter === "online")    return u.isOnline === true && !u.banned;
        if (currentFilter === "offline")   return !u.isOnline && !u.banned;
        if (currentFilter === "banned")    return u.banned === true;
        if (currentFilter === "suspended") return u.suspended === true;
        if (currentFilter === "new")       return isToday(u.registrationTimestamp);
        return true;
    }).filter(u => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return (u.username || "").toLowerCase().includes(q) || (u.fullName || "").toLowerCase().includes(q);
    });
    displayCount = PAGE_SIZE;
    renderUsers();
}

function renderUsers() {
    const list = document.getElementById("users-list");
    const countEl = document.getElementById("users-count");
    const loadMoreBtn = document.getElementById("load-more-btn");
    const toShow = filteredUsers.slice(0, displayCount);
    countEl.textContent = `Showing ${toShow.length} of ${filteredUsers.length} users`;
    if (filteredUsers.length === 0) {
        list.innerHTML = `<div class="empty-state"><div class="ei">${ic("search")}</div><div class="et">No users found</div><div class="es">Try adjusting your search or filter</div></div>`;
        loadMoreBtn.style.display = "none";
        return;
    }
    list.innerHTML = toShow.map(createUserCard).join("");
    loadMoreBtn.style.display = filteredUsers.length > displayCount ? "block" : "none";
}

function createUserCard(u) {
    const isBanned = u.banned === true, isSuspended = u.suspended === true, isOnline = u.isOnline === true;
    const initials = getInitials(u.fullName || u.username);
    const age = calculateAge(u.dateOfBirth);
    const lastSeen = getLastSeenLabel(u);
    const id = esc(u.id);
    const pic = safeUrl(u.userProfilePic);
    const avatarInner = pic
        ? `<img class="user-avatar" src="${esc(pic)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="user-avatar-fallback" style="display:none">${esc(initials)}</div>`
        : `<div class="user-avatar-fallback">${esc(initials)}</div>`;
    const chips = [
        `<span class="status-chip"><span class="dot ${isOnline ? "ok" : ""}"></span>${isOnline ? "Active" : "Inactive"}</span>`,
        isBanned ? `<span class="chip bad">Banned</span>` : "",
        isSuspended ? `<span class="chip warn">Suspended</span>` : ""
    ].filter(Boolean).join("");

    return `
    <article class="user-card${isBanned ? " banned" : ""}${isSuspended && !isBanned ? " suspended" : ""}" id="card-${id}">
        <div class="card-top">
            <button class="avatar-btn" type="button" data-act="profile-page" data-id="${id}" aria-label="Open profile">${avatarInner}</button>
            <div class="card-identity">
                <div class="user-name">${esc(u.fullName || "—")}</div>
                <div class="user-handle">@${esc(u.username || u.id)}</div>
            </div>
        </div>
        <div class="chip-row">${chips}</div>
        <div class="card-meta">
            <div class="meta-item"><span class="meta-label">Country</span><span class="meta-value">${esc(getCountry(u))}</span></div>
            <div class="meta-item"><span class="meta-label">Town</span><span class="meta-value">${esc(getTown(u))}</span></div>
            <div class="meta-item"><span class="meta-label">Contact</span><span class="meta-value">${esc(getContact(u))}</span></div>
            <div class="meta-item"><span class="meta-label">Age</span><span class="meta-value">${age !== null ? age + " yrs" : "—"}</span></div>
            <div class="meta-item"><span class="meta-label">Last seen</span><span class="meta-value${lastSeen.isOnline ? " online-now" : ""}">${esc(lastSeen.text)}</span></div>
            <div class="meta-item"><span class="meta-label">Friends · Followers</span><span class="meta-value">${Number(u.friendsCount || 0)} · ${Number(u.followersCount || 0)}</span></div>
        </div>
        <div class="card-stats"><span><b>${Number(u.postCount || 0)}</b>Posts</span><span><b>${Number(u.likesCount || 0)}</b>Likes</span></div>
        <div class="card-actions">
            <button class="act-btn" type="button" data-act="view" data-id="${id}">${ic("eye")}View</button>
            ${isBanned
                ? `<button class="act-btn" type="button" data-act="unban" data-id="${id}">${ic("check")}Unban</button>`
                : `<button class="act-btn danger" type="button" data-act="ban" data-id="${id}">${ic("ban")}Ban</button>`}
            ${isSuspended
                ? `<button class="act-btn" type="button" data-act="unsuspend" data-id="${id}">${ic("play")}Unsuspend</button>`
                : `<button class="act-btn" type="button" data-act="suspend" data-id="${id}">${ic("pause")}Suspend</button>`}
            <button class="act-btn danger icon-only" type="button" data-act="delete" data-id="${id}" aria-label="Delete account">${ic("trash")}</button>
        </div>
    </article>`;
}

function goToProfile(userId) { window.location.href = `me.html?user=${encodeURIComponent(userId)}`; }

// ── PROFILE MODAL ──
function openProfileModal(userId) {
    const u = allUsers.find(x => x.id === userId);
    if (!u) return;
    const initials = getInitials(u.fullName || u.username);
    const age = calculateAge(u.dateOfBirth);
    const lastSeen = getLastSeenLabel(u);
    const cover = safeUrl(u.userCover), pic = safeUrl(u.userProfilePic);
    const coverHtml = cover ? `<img class="profile-cover" src="${esc(cover)}" alt="">` : `<div class="profile-cover"></div>`;
    const avatarHtml = pic ? `<img class="profile-avatar-lg" src="${esc(pic)}" alt="">` : `<div class="profile-avatar-fallback-lg">${esc(initials)}</div>`;
    const row = (k, v, cls) => `<div class="modal-field"><span class="mfk">${k}</span><span class="mfv${cls ? " " + cls : ""}">${esc(v)}</span></div>`;
    document.getElementById("profile-modal-body").innerHTML = `
        ${coverHtml}
        <div class="profile-avatar-wrap">${avatarHtml}</div>
        ${row("Full name", u.fullName || "—")}
        ${row("Username", "@" + (u.username || u.id))}
        ${row("Country", getCountry(u))}
        ${row("Town", getTown(u))}
        ${row("Age", age !== null ? age + " yrs" : "—")}
        ${row("Contact", getContact(u))}
        ${row("Date of birth", u.dateOfBirth || "—")}
        ${row("Joined", formatDate(u.registrationTimestamp))}
        ${row("Status", u.isOnline ? "Online" : "Offline", u.isOnline ? "ok" : "")}
        ${row("Last seen", lastSeen.text, lastSeen.isOnline ? "ok" : "")}
        ${row("Posts", u.postCount || 0)}
        ${row("Likes given", u.likesCount || 0)}
        ${row("Banned", u.banned ? "Yes: " + (u.bannedReason || "No reason given") : "No", u.banned ? "bad" : "ok")}
        ${row("Suspended", u.suspended ? "Yes: " + (u.suspendedReason || "No reason given") : "No", u.suspended ? "warn" : "ok")}
    `;
    document.getElementById("profile-modal").classList.add("show");
}

// ── BAN ──
function openBanModal(userId) {
    pendingBanUsername = userId; selectedBanReason = "";
    document.querySelectorAll("#ban-modal .opt").forEach(b => b.classList.remove("selected"));
    const ci = document.getElementById("ban-custom-input"); ci.classList.add("hidden"); ci.value = "";
    const u = allUsers.find(x => x.id === userId);
    document.getElementById("ban-modal-sub").textContent = `Banning @${u ? u.username : userId}. Select a reason.`;
    document.getElementById("ban-modal").classList.add("show");
}
function selectBanReason(btn, reason) {
    document.querySelectorAll("#ban-modal .opt").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    const ci = document.getElementById("ban-custom-input");
    if (reason === "custom") { ci.classList.remove("hidden"); ci.focus(); selectedBanReason = ""; }
    else { ci.classList.add("hidden"); selectedBanReason = reason; }
}
async function confirmBan() {
    const customVal = document.getElementById("ban-custom-input").value.trim();
    if (customVal) selectedBanReason = customVal;
    if (!selectedBanReason) { showToast("Select a reason"); return; }
    try {
        await db.collection("users").doc(pendingBanUsername).update({
            banned: true, bannedAt: firebase.firestore.FieldValue.serverTimestamp(), bannedReason: selectedBanReason
        });
        closeModal("ban-modal");
        showToast("User banned");
    } catch (e) { showToast("Error: " + e.message); }
}
async function unbanUser(userId) {
    try {
        await db.collection("users").doc(userId).update({ banned: false, bannedAt: null, bannedReason: null });
        showToast("User unbanned");
    } catch (e) { showToast("Error: " + e.message); }
}

// ── DELETE ──
function openDeleteModal(userId) {
    pendingDeleteUsername = userId;
    const u = allUsers.find(x => x.id === userId);
    document.getElementById("delete-modal-msg").textContent =
        `This permanently deletes @${u ? u.username : userId} and all of their posts. This cannot be undone.`;
    document.getElementById("delete-modal").classList.add("show");
}
async function confirmDelete() {
    try {
        const postsSnap = await db.collection("posts").where("username", "==", pendingDeleteUsername).get();
        const batch = db.batch();
        postsSnap.forEach(doc => batch.delete(doc.ref));
        batch.delete(db.collection("users").doc(pendingDeleteUsername));
        await batch.commit();
        closeModal("delete-modal");
        showToast("Account deleted");
    } catch (e) { showToast("Error: " + e.message); }
}

function closeModal(id) { document.getElementById(id).classList.remove("show"); }
function showToast(msg) {
    const existing = document.getElementById("toast-el");
    if (existing) existing.remove();
    const t = document.createElement("div");
    t.className = "toast"; t.id = "toast-el";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; setTimeout(() => t.remove(), 300); }, 3000);
}

// ── EVENTS ──
document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const id = el.dataset.id;
    switch (el.dataset.act) {
        case "more": displayCount += PAGE_SIZE; renderUsers(); break;
        case "profile-page": goToProfile(id); break;
        case "view": openProfileModal(id); break;
        case "ban": openBanModal(id); break;
        case "unban": unbanUser(id); break;
        case "suspend": openSuspendModal(id); break;
        case "unsuspend": unsuspendUser(id); break;
        case "delete": openDeleteModal(id); break;
        case "ban-reason": selectBanReason(el, el.dataset.reason); break;
        case "suspend-reason": selectSuspendReason(el, el.dataset.reason); break;
        case "confirm-ban": confirmBan(); break;
        case "confirm-suspend": confirmSuspend(); break;
        case "confirm-delete": confirmDelete(); break;
        case "close": closeModal(el.dataset.modal); break;
    }
});
document.addEventListener("DOMContentLoaded", () => {
    hydrateIcons();
    loadUsers();
    document.getElementById("search-input").addEventListener("input", function () { searchQuery = this.value.trim(); applyFilters(); });
    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", function () {
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            this.classList.add("active");
            currentFilter = this.dataset.filter;
            applyFilters();
        });
    });
    document.querySelectorAll(".modal-overlay").forEach(overlay => {
        overlay.addEventListener("click", function (e) { if (e.target === this) this.classList.remove("show"); });
    });
});

</script>
