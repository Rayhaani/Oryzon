    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Syne:wght@700&display=swap');

        body {
            background-color: #050505 !important;
            color: white;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .profile-header {
            background: #050505;
            border: none;
            padding: 16px 20px 20px;
        }

        .header-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }
        .header-back-btn {
            background: none; border: none; color: #fff;
            font-size: 26px; line-height: 1; cursor: pointer; padding: 0;
        }
        .header-title {
            font-size: 17px; font-weight: 800; color: #fff;
            font-family: 'Outfit', sans-serif;
        }
        .header-icons { display: flex; align-items: center; gap: 18px; }
        .header-icons i { font-size: 17px; color: #fff; }

        .profile-row {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 0;
        }
        .profile-right-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 88px;
        }
        .profile-pic-circle {
            width: 88px; height: 88px; border-radius: 50%;
            background: #1a1a1a;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .wolay-logo-text {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 13px;
            background: linear-gradient(135deg, #ec4899, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stats-bar {
            display: flex; align-items: center; justify-content: space-around;
            flex: 1;
        }
        .stat-item { text-align: center; }
        .stat-value { font-weight: 800; font-size: 18px; color: #fff; }
        .stat-label { font-size: 12px; color: #888; }
        .stat-divider { width: 1px; height: 32px; background: rgba(255,255,255,0.15); }

        .nxh-seg-float {
        position: relative;
        z-index: 5;
        margin-top: 14px;
        padding: 0 14px;
        }
    .nxh-seg-wrap {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.08);
    border-radius: 22px;
    padding: 5px;
    width: 100%;
    box-sizing: border-box;
}
.nxh-seg-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 10px 0;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 700;
    color: #8b7355;
    background: #262626 !important;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: var(--np-font);
}
.nxh-seg-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
        }
.nxh-seg-btn.active {
    background: rgba(253, 224, 141, 0.3) !important;
    color: #1a1a1a;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            grid-auto-rows: 150px; 
            grid-auto-flow: dense;
            gap: 5px; 
            padding: 15px;
            margin-bottom: 100px;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            background: #1a1b1e;
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.05);
        }

        .grid-item:nth-child(6n+1) { grid-row: span 2; } 
        .grid-item:nth-child(6n+4) { grid-row: span 2; grid-column: 2; }

        .grid-item img, .grid-item video {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .price-style-1 {
            position: absolute; bottom: 12px; right: 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 4px 12px; border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 800; font-size: 11px; color: #fff;
            z-index: 10;
        }

        /* FULL SCREEN MODAL (COVERING EVERYTHING) */
        #full-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #modal-content img, #modal-content video {
            width: 100%; height: 100%;
            object-fit: cover; /* No black spaces */
        }
        .close-btn {
            position: absolute; top: 20px; right: 20px;
            font-size: 30px; color: white; z-index: 10000;
            cursor: pointer; background: rgba(0,0,0,0.3);
            width: 40px; height: 40px; display: flex;
            justify-content: center; align-items: center; border-radius: 50%;
        }
        
    </style>
</head>
<body>

    <div id="full-modal">
        <span class="close-btn" onclick="closeFull()">&times;</span>
        <div id="modal-content" class="w-full h-full"></div>
    </div>

    <header class="profile-header">
        <div class="header-top-row">
            <button class="header-back-btn">‹</button>
            <h1 class="header-title" id="storeName">Loading...</h1>
            <div class="header-icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-arrow-up-from-bracket"></i>
            </div>
        </div>

        <div class="profile-row">
            <div class="profile-pic-circle" id="storeAvatar"></div>
            <div class="profile-right-col">
                <div class="stats-bar">
                    <div class="stat-item"><div class="stat-value" id="statFollowers">0</div><div class="stat-label">Followers</div></div>
                    <div class="stat-divider"></div>
                    <div class="stat-item"><div class="stat-value" id="statSold">0</div><div class="stat-label">Sold <i class="fa-regular fa-circle-question" style="font-size:10px;"></i></div></div>
                    <div class="stat-divider"></div>
                    <div class="stat-item"><div class="stat-value" id="statItems">0</div><div class="stat-label">Items</div></div>
                </div>
                <div class="nxh-seg-float" style="padding:0;margin-top:0;">
                    <div class="nxh-seg-wrap">
                        <button class="nxh-seg-btn active" id="seg-catalogue-btn">
                            <svg class="nxh-seg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                            Catalogue
                        </button>
                        <button class="nxh-seg-btn" id="seg-message-btn">
                            <svg class="nxh-seg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            Message
                        </button>
                        <button class="nxh-seg-btn" id="seg-follow-btn">
                            <svg class="nxh-seg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            Follow
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="product-grid" id="vendor-grid"></main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDExSOnFbN-wJbT1UFgB-kBs37bEa3KiWc",
            authDomain: "oryzon-50ea4.firebaseapp.com",
            projectId: "oryzon-50ea4",
            storageBucket: "oryzon-50ea4.firebasestorage.app",
            messagingSenderId: "782106742622",
            appId: "1:782106742622:web:902d512bfe42dd4cf289cf",
            measurementId: "G-K5085DLL2W"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. Karanto vendor username daga URL (misali: store-front.html?vendor=wolay_underwear)
        const urlParams = new URLSearchParams(window.location.search);
        const vendorUsername = urlParams.get('vendor');

        const grid = document.getElementById('vendor-grid');

        function productCardHTML(p) {
            const isVideo = p.isVideo || (p.image || '').endsWith('.mp4');
            return `
                <div class="grid-item" onclick="openFull('${p.image}', ${isVideo})">
                    ${isVideo ? `<video src="${p.image}" muted loop autoplay class="w-full h-full object-cover"></video>` : `<img src="${p.image}" loading="lazy">`}
                    <div class="price-style-1">₦${p.price}</div>
                </div>`;
        }

        function renderProducts(items) {
            document.getElementById('statItems').textContent = items.length;
            if (!items.length) {
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#888;padding:60px 20px;">This vendor has no products yet.</div>`;
                return;
            }
            grid.innerHTML = items.map(productCardHTML).join('');
        }

        function renderVendorProfile(v) {
            document.getElementById('storeName').textContent = v.storeName || vendorUsername;
            document.getElementById('statFollowers').textContent = (v.followers || 0).toLocaleString();
            document.getElementById('statSold').textContent = (v.sold || 0).toLocaleString();

            const avatarEl = document.getElementById('storeAvatar');
            if (v.logoUrl) {
                avatarEl.innerHTML = `<img src="${v.logoUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            } else {
                const initials = (v.storeName || vendorUsername || '?').trim().slice(0, 2).toUpperCase();
                avatarEl.innerHTML = `<span class="wolay-logo-text" style="font-size:22px;">${initials}</span>`;
            }
        }

        if (vendorUsername) {
            // 2. Products: sell.html's exact seller-field name isn't confirmed yet,
            // so (same as shop.html) we listen on every common naming convention
            // and merge results by product id.
            const candidateFields = ['sellerUsername', 'seller', 'sellerId', 'vendorUsername', 'vendorId', 'ownerUsername', 'username'];
            const seen = new Map();
            candidateFields.forEach(field => {
                const q = query(collection(db, "products"), where(field, "==", vendorUsername));
                onSnapshot(q, (snapshot) => {
                    snapshot.forEach(docSnap => seen.set(docSnap.id, docSnap.data()));
                    renderProducts(Array.from(seen.values()));
                }, () => {});
            });

            // 3. Vendor store profile (suna, logo, followers, sold) — collection "vendors", doc id = username
            getDoc(doc(db, "vendors", vendorUsername)).then(snap => {
                renderVendorProfile(snap.exists() ? snap.data() : {});
            }).catch(() => {
                renderVendorProfile({});
            });
        } else {
            grid.innerHTML = `<p style="color:#888;padding:20px;grid-column:1/-1;">No vendor specified in URL.</p>`;
            document.getElementById('storeName').textContent = 'No vendor specified';
        }

        window.openFull = function (src, isVideo) {
            const modal = document.getElementById('full-modal');
            const content = document.getElementById('modal-content');
            modal.style.display = 'flex';
            if (isVideo) {
                content.innerHTML = `<video src="${src}" autoplay loop playsinline controls class="w-full h-full object-cover"></video>`;
            } else {
                content.innerHTML = `<img src="${src}" class="w-full h-full object-cover">`;
            }
        };

        window.closeFull = function () {
            const modal = document.getElementById('full-modal');
            document.getElementById('modal-content').innerHTML = '';
            modal.style.display = 'none';
        };
    </script>
</body>
            </html>
