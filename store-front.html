<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolay Store | Futuristic Vendor Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="store-front.css">
    <script>
    (function () {
        if (location.search.indexOf('embed=1') === -1) { document.write('<script src="router.js"><\/script>'); return; }
        window.NexusRouter = {
            navigateTo: function (u) {
                try {
                    if (u.indexOf('vendor-chat.html') === 0 && window.parent.inboxOpenChat) { window.parent.inboxOpenChat(u); return; }
                    if (window.parent.NexusRouter) { window.parent.NexusRouter.navigateTo(u); return; }
                } catch (e) {}
                window.top.location.href = u;
            },
            registerPage: function (p, h) { window.__sfHandlers = h; }
        };
    })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</head>
<body>
    <div id="page-content">

    <div id="full-modal">
        <span class="close-btn" onclick="closeFull()">&times;</span>
        <div id="modal-content" class="w-full h-full"></div>
    </div>

    <div id="reviews-overlay" style="display:none;position:fixed;inset:0;background:#050505;z-index:200;overflow-y:auto;">
        <div style="display:flex;align-items:center;gap:14px;padding:16px 20px;position:sticky;top:0;background:#050505;border-bottom:1px solid rgba(255,255,255,0.08);">
            <button onclick="closeReviewsOverlay()" style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:0;">‹</button>
            <h2 style="color:#fff;font-size:16px;font-weight:800;margin:0;">Reviews</h2>
        </div>
        <div id="reviews-list" style="padding:16px 20px;"></div>
    </div>

    <header class="profile-header">
        <div class="header-top-row">
            <button class="header-back-btn">‹</button>
            <h1 class="header-title" id="storeName">Loading...</h1>
            <div class="header-icons">
                <i class="fa-solid fa-table-cells" id="view-toggle-icon" onclick="toggleViewMode()"></i>
                <i class="fa-solid fa-magnifying-glass" onclick="toggleStoreSearch()"></i>
                <i class="fa-solid fa-arrow-up-from-bracket" onclick="shareStore()"></i>
            </div>
        </div>

        <div id="storeSearchBar" style="display:none;margin-bottom:14px;">
            <input id="storeSearchInput" type="text" placeholder="Search this store..." oninput="filterStoreItems(this.value)"
                style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:10px 14px;color:#fff;font-size:13px;outline:none;">
        </div>

        <div class="profile-row">
            <div class="profile-pic-circle" id="storeAvatar"></div>
            <div class="profile-right-col">
                <div class="stats-bar">
                    <div class="stat-item"><div class="stat-value" id="statFollowers">0</div><div class="stat-label">Followers</div></div>
                    <div class="stat-divider"></div>
                    <div class="stat-item"><div class="stat-value" id="statSold">0</div><div class="stat-label">Sold <i class="fa-regular fa-circle-question" style="font-size:10px;"></i></div></div>
                    <div class="stat-divider"></div>
                    <div class="stat-item"><div class="stat-value" id="statItems">0</div><div class="stat-label">Items</div></div>
                </div>
                <div class="nxh-seg-float">
                    <div class="nxh-seg-wrap">
                        <button class="nxh-seg-btn" id="seg-reviews-btn" onclick="openReviewsOverlay()">Reviews</button>
                        <button class="nxh-seg-btn" id="seg-message-btn" onclick="goToVendorInbox()">Message</button>
                        <button class="nxh-seg-btn" id="seg-follow-btn" onclick="toggleFollowStore()">Follow</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="product-grid" id="vendor-grid"></main>

    </div>

    <script>
    (function () {
        if (location.search.indexOf('embed=1') === -1) { document.write('<script src="store-front.js"><\/script>'); return; }
        var warm = location.search.indexOf('warm=1') > -1;
        var pristine = document.getElementById('page-content').innerHTML;
        var code = null;
        function run() {
            var selfBoot = document.readyState !== 'complete';
            var s = document.createElement('script');
            s.text = '(function(){\n' + code + '\n})();';
            document.body.appendChild(s);
            document.body.removeChild(s);
            if (!selfBoot && window.__sfHandlers && window.__sfHandlers.init) window.__sfHandlers.init();
        }
        function start() {
            if (code !== null) { run(); return; }
            fetch('store-front.js').then(function (r) { return r.text(); }).then(function (t) { code = t; run(); });
        }
        window.sfClose = function () {
            try { if (window.__sfHandlers && window.__sfHandlers.destroy) window.__sfHandlers.destroy(); } catch (e) {}
            window.__sfHandlers = null;
            document.getElementById('page-content').innerHTML = pristine;
        };
        window.sfOpen = function (search) {
            window.sfClose();
            history.replaceState(null, '', location.pathname + search);
            start();
        };
        window.addEventListener('load', function () { window.__sfReady = true; });
        if (warm) {
            try {
                import('https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js');
                import('https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js');
            } catch (e) {}
            fetch('store-front.js').then(function (r) { return r.text(); }).then(function (t) { code = t; });
        } else {
            start();
        }
    })();
    </script>
</body>
</html>
