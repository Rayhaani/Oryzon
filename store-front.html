<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolay Store | Futuristic Vendor Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDExSOnFbN-wJbT1UFgB-kBs37bEa3KiWc",
            authDomain: "oryzon-50ea4.firebaseapp.com",
            databaseURL: "https://oryzon-50ea4-default-rtdb.firebaseio.com",
            projectId: "oryzon-50ea4",
            storageBucket: "oryzon-50ea4.firebasestorage.app",
            messagingSenderId: "782106742622",
            appId: "1:782106742622:web:902d512bfe42dd4cf289cf",
            measurementId: "G-K5085DLL2W"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Syne:wght@700&family=Quicksand:wght@500;700;800&display=swap');

        body {
            background-color: #050505 !important;
            color: white;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .profile-header {
            background: #050505;
            border: none;
            padding: 16px 20px 20px;
        }

        .header-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }
        .header-back-btn {
            background: none; border: none; color: #fff;
            font-size: 26px; line-height: 1; cursor: pointer; padding: 0;
        }
        .header-title {
            font-size: 17px; font-weight: 800; color: #fff;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .header-icons { display: flex; align-items: center; gap: 16px; }
        .header-icons i { font-size: 17px; color: #fff; }

        .profile-row {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 0;
        }
        .profile-right-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 88px;
        }
        .profile-pic-circle {
            width: 88px; height: 88px; border-radius: 50%;
            background: #1a1a1a;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .wolay-logo-text {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 13px;
            background: linear-gradient(135deg, #ec4899, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stats-bar {
            display: flex; align-items: center; justify-content: space-around;
            flex: 1;
        }
        .stat-item { text-align: center; }
        .stat-value { font-weight: 800; font-size: 18px; color: #fff; }
        .stat-label { font-size: 12px; color: #888; }
        .stat-divider { width: 1px; height: 32px; background: rgba(255,255,255,0.15); }

        .nxh-seg-float {
            position: relative;
            margin-top: 0;
        }
        .nxh-seg-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .nxh-seg-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 4px;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 700;
            color: #8b7355;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .nxh-seg-btn.active {
            background: rgba(253, 224, 141, 0.18);
            border-color: rgba(253, 224, 141, 0.4);
            color: #fde08d;
        }

        .product-list {
            display: flex; flex-direction: column; gap: 0;
            margin: 0 15px 100px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 18px;
            overflow: hidden;
        }
        .list-item-card {
            display: flex; gap: 14px; cursor: pointer;
            padding: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .list-item-card:last-child { border-bottom: none; }
        .list-item-thumb { width: 110px; height: 110px; border-radius: 12px; overflow: hidden; flex-shrink: 0; background: #111; }
        .list-item-thumb img, .list-item-thumb video { width: 100%; height: 100%; object-fit: cover; }
        .list-item-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
        .list-item-price { color: #fff; font-weight: 800; font-size: 16px; }
        .list-item-name { color: #ccc; font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .vendor-msg-bar {
            display: flex; gap: 6px; align-items: center;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 3px 3px 3px 10px; margin-top: 6px;
        }
        .vendor-msg-bar input {
            flex: 1; background: none; border: none; outline: none;
            font-family: 'Quicksand', sans-serif; font-size: 12px; font-weight: 500; color: #F5F5DC; caret-color: #D4AF37;
        }
        .vendor-msg-bar button {
            width: 28px; height: 28px; background: linear-gradient(135deg,#D4AF37,#B8860B);
            border: none; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .vendor-msg-bar button i { font-size: 11px; color: #000; }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            grid-auto-rows: 150px; 
            grid-auto-flow: dense;
            gap: 5px; 
            padding: 15px;
            margin-bottom: 100px;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            background: #1a1b1e;
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.05);
        }

        .grid-item:nth-child(6n+1) { grid-row: span 2; } 
        .grid-item:nth-child(6n+4) { grid-row: span 2; grid-column: 2; }

        .grid-item img, .grid-item video {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .price-style-1 {
            position: absolute; bottom: 12px; right: 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 4px 12px; border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 800; font-size: 11px; color: #fff;
            z-index: 10;
        }

        /* FULL SCREEN MODAL (COVERING EVERYTHING) */
        #full-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #modal-content img, #modal-content video {
            width: 100%; height: 100%;
            object-fit: cover; /* No black spaces */
        }
        .close-btn {
            position: absolute; top: 20px; right: 20px;
            font-size: 30px; color: white; z-index: 10000;
            cursor: pointer; background: rgba(0,0,0,0.3);
            width: 40px; height: 40px; display: flex;
            justify-content: center; align-items: center; border-radius: 50%;
        }
        
    </style>
</head>
<body>

    <div id="full-modal">
        <span class="close-btn" onclick="closeFull()">&times;</span>
        <div id="modal-content" class="w-full h-full"></div>
    </div>

    <div id="reviews-overlay" style="display:none;position:fixed;inset:0;background:#050505;z-index:200;overflow-y:auto;">
        <div style="display:flex;align-items:center;gap:14px;padding:16px 20px;position:sticky;top:0;background:#050505;border-bottom:1px solid rgba(255,255,255,0.08);">
            <button onclick="closeReviewsOverlay()" style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:0;">‹</button>
            <h2 style="color:#fff;font-size:16px;font-weight:800;margin:0;">Reviews</h2>
        </div>
        <div id="reviews-list" style="padding:16px 20px;"></div>
    </div>

    <header class="profile-header">
        <div class="header-top-row">
            <button class="header-back-btn">‹</button>
            <h1 class="header-title" id="storeName">Loading...</h1>
            <div class="header-icons">
                <i class="fa-solid fa-table-cells" id="view-toggle-icon" onclick="toggleViewMode()"></i>
                <i class="fa-solid fa-magnifying-glass" onclick="toggleStoreSearch()"></i>
                <i class="fa-solid fa-arrow-up-from-bracket" onclick="shareStore()"></i>
            </div>
        </div>

        <div id="storeSearchBar" style="display:none;margin-bottom:14px;">
            <input id="storeSearchInput" type="text" placeholder="Search this store..." oninput="filterStoreItems(this.value)"
                style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:10px 14px;color:#fff;font-size:13px;outline:none;">
        </div>

        <div class="profile-row">
            <div class="profile-pic-circle" id="storeAvatar"></div>
            <div class="profile-right-col">
                <div class="stats-bar">
                    <div class="stat-item"><div class="stat-value" id="statFollowers">0</div><div class="stat-label">Followers</div></div>
                    <div class="stat-divider"></div>
                    <div class="stat-item"><div class="stat-value" id="statSold">0</div><div class="stat-label">Sold <i class="fa-regular fa-circle-question" style="font-size:10px;"></i></div></div>
                    <div class="stat-divider"></div>
                    <div class="stat-item"><div class="stat-value" id="statItems">0</div><div class="stat-label">Items</div></div>
                </div>
                <div class="nxh-seg-float">
                    <div class="nxh-seg-wrap">
                        <button class="nxh-seg-btn" id="seg-reviews-btn" onclick="openReviewsOverlay()">Reviews</button>
                        <button class="nxh-seg-btn" id="seg-message-btn" onclick="goToVendorInbox()">Message</button>
                        <button class="nxh-seg-btn" id="seg-follow-btn" onclick="toggleFollowStore()">Follow</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="product-grid" id="vendor-grid"></main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, onSnapshot, getDocs, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDExSOnFbN-wJbT1UFgB-kBs37bEa3KiWc",
            authDomain: "oryzon-50ea4.firebaseapp.com",
            projectId: "oryzon-50ea4",
            storageBucket: "oryzon-50ea4.firebasestorage.app",
            messagingSenderId: "782106742622",
            appId: "1:782106742622:web:902d512bfe42dd4cf289cf",
            measurementId: "G-K5085DLL2W"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. Karanto vendor username daga URL (misali: store-front.html?vendor=wolay_underwear)
        const urlParams = new URLSearchParams(window.location.search);
        const vendorUsername = urlParams.get('vendor');

        const grid = document.getElementById('vendor-grid');
        let currentItems = [];
        let viewMode = 'grid';

        function productCardHTML(p) {
            const isVideo = p.isVideo || (p.image || '').endsWith('.mp4');
            return `
                <div class="grid-item" onclick="goToProductDetails('${p.id}')">
                    ${isVideo ? `<video src="${p.image}" muted loop autoplay class="w-full h-full object-cover"></video>` : `<img src="${p.image}" loading="lazy">`}
                    <div class="price-style-1">₦${p.price}</div>
                </div>`;
        }

        function listItemHTML(p) {
            const isVideo = p.isVideo || (p.image || '').endsWith('.mp4');
            return `
                <div class="list-item-card" onclick="goToProductDetails('${p.id}')">
                    <div class="list-item-thumb">
                        ${isVideo ? `<video src="${p.image}" muted loop autoplay></video>` : `<img src="${p.image}" loading="lazy">`}
                    </div>
                    <div class="list-item-details">
                        <div>
                            <div class="list-item-price">₦${p.price}</div>
                            ${p.name ? `<div class="list-item-name">${p.name}</div>` : ''}
                        </div>
                        <div class="vendor-msg-bar" onclick="event.stopPropagation()">
                            <input id="vendorMsgInput_${p.id}" type="text" value="Is this still available? 😊"
                                onkeydown="if(event.key==='Enter') sendListItemMsg('${p.id}','${p.image}','${p.price}')">
                            <button onclick="sendListItemMsg('${p.id}','${p.image}','${p.price}')">
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
        }

        let displayedItems = [];

        function renderItems() {
            displayedItems = currentItems;
            document.getElementById('statItems').textContent = currentItems.length;
            renderDisplayedItems();
        }

        function renderDisplayedItems() {
            if (!displayedItems.length) {
                grid.className = viewMode === 'grid' ? 'product-grid' : 'product-list';
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#888;padding:60px 20px;">${currentItems.length ? 'No matching products.' : 'This vendor has no products yet.'}</div>`;
                return;
            }
            if (viewMode === 'grid') {
                grid.className = 'product-grid';
                grid.innerHTML = displayedItems.map(productCardHTML).join('');
            } else {
                grid.className = 'product-list';
                grid.innerHTML = displayedItems.map(listItemHTML).join('');
            }
        }

        window.goToProductDetails = function (productId) {
            window.location.href = `products-page.html?id=${encodeURIComponent(productId)}`;
        };

        window.toggleStoreSearch = function () {
            const bar = document.getElementById('storeSearchBar');
            const isHidden = bar.style.display === 'none';
            bar.style.display = isHidden ? 'block' : 'none';
            if (isHidden) {
                document.getElementById('storeSearchInput').focus();
            } else {
                document.getElementById('storeSearchInput').value = '';
                displayedItems = currentItems;
                renderDisplayedItems();
            }
        };

        window.filterStoreItems = function (q) {
            const term = q.trim().toLowerCase();
            displayedItems = !term ? currentItems : currentItems.filter(p =>
                (p.name || '').toLowerCase().includes(term) || String(p.price || '').includes(term)
            );
            renderDisplayedItems();
        };

        window.shareStore = function () {
            const shareData = {
                title: document.getElementById('storeName').textContent,
                text: `Check out ${document.getElementById('storeName').textContent} on Nexus`,
                url: window.location.href
            };
            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('Store link copied to clipboard!');
                }).catch(() => {});
            }
        };

        function renderVendorProfile(v) {
            document.getElementById('storeName').textContent = v.storeName || vendorUsername;
            document.getElementById('statFollowers').textContent = (v.followers || 0).toLocaleString();
            document.getElementById('statSold').textContent = (v.sold || 0).toLocaleString();

            const avatarEl = document.getElementById('storeAvatar');
            if (v.logoUrl) {
                avatarEl.innerHTML = `<img src="${v.logoUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            } else {
                const initials = (v.storeName || vendorUsername || '?').trim().slice(0, 2).toUpperCase();
                avatarEl.innerHTML = `<span class="wolay-logo-text" style="font-size:22px;">${initials}</span>`;
            }
        }

        if (vendorUsername) {
            // 2. Products: sell.html's exact seller-field name isn't confirmed yet,
            // so (same as shop.html) we listen on every common naming convention
            // and merge results by product id.
            const candidateFields = ['sellerUsername', 'seller', 'sellerId', 'vendorUsername', 'vendorId', 'ownerUsername', 'username'];
            const seen = new Map();
            candidateFields.forEach(field => {
                const q = query(collection(db, "products"), where(field, "==", vendorUsername));
                onSnapshot(q, (snapshot) => {
                    snapshot.forEach(docSnap => seen.set(docSnap.id, { id: docSnap.id, ...docSnap.data() }));
                    currentItems = Array.from(seen.values());
                    renderItems();
                }, () => {});
            });

            // 3. Vendor store profile (suna, logo, followers, sold) — collection "vendors", doc id = username
            getDoc(doc(db, "vendors", vendorUsername)).then(snap => {
                renderVendorProfile(snap.exists() ? snap.data() : {});
            }).catch(() => {
                renderVendorProfile({});
            });
        } else {
            grid.innerHTML = `<p style="color:#888;padding:20px;grid-column:1/-1;">No vendor specified in URL.</p>`;
            document.getElementById('storeName').textContent = 'No vendor specified';
        }

        // Catalogue / Message / Follow segmented control
        window.openReviewsOverlay = function () {
            document.getElementById('reviews-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
            loadReviews();
        };

        window.closeReviewsOverlay = function () {
            document.getElementById('reviews-overlay').style.display = 'none';
            document.body.style.overflow = '';
        };

        async function loadReviews() {
            const list = document.getElementById('reviews-list');
            list.innerHTML = `<div style="color:#888;text-align:center;padding:40px 0;">Loading reviews...</div>`;
            try {
                const q = query(collection(db, "vendors", vendorUsername, "reviews"), orderBy("time", "desc"));
                const snap = await getDocs(q);
                if (snap.empty) {
                    list.innerHTML = `<div style="color:#888;text-align:center;padding:40px 0;">No reviews yet.</div>`;
                    return;
                }
                list.innerHTML = snap.docs.map(d => {
                    const r = d.data();
                    const stars = '★'.repeat(Math.round(r.rating || 0)) + '☆'.repeat(5 - Math.round(r.rating || 0));
                    return `
                        <div style="border-bottom:1px solid rgba(255,255,255,0.08);padding:14px 0;">
                            <div style="color:#fde08d;font-size:14px;letter-spacing:2px;">${stars}</div>
                            <div style="color:#fff;font-weight:700;font-size:13px;margin-top:4px;">${r.reviewerName || 'Anonymous'}</div>
                            <div style="color:#ccc;font-size:13px;margin-top:4px;">${r.comment || ''}</div>
                        </div>`;
                }).join('');
            } catch (err) {
                list.innerHTML = `<div style="color:#888;text-align:center;padding:40px 0;">No reviews yet.</div>`;
            }
        }

        window.goToVendorInbox = function () {
            window.location.href = 'vendor-chat.html?vendorId=' + encodeURIComponent(vendorUsername || '');
        };

        window.toggleFollowStore = function () {
            const btn = document.getElementById('seg-follow-btn');
            const isNowFollowing = btn.classList.toggle('active');
            btn.textContent = isNowFollowing ? 'Following' : 'Follow';
            if (!vendorUsername) return;
            updateDoc(doc(db, "vendors", vendorUsername), {
                followers: increment(isNowFollowing ? 1 : -1)
            }).catch(() => {});
        };

        // Per-product "Is this still available?" bar — same pattern as products-page.html's sendVendorMsg
        window.sendListItemMsg = function (productId, img, price) {
            const input = document.getElementById('vendorMsgInput_' + productId);
            const msg = (input ? input.value : '').trim();
            if (!msg) return;

            localStorage.setItem('vc_msg', msg);
            localStorage.setItem('vc_name', vendorUsername || '');
            localStorage.setItem('vc_price', price || '');
            localStorage.setItem('vc_img', img || '');
            localStorage.setItem('vc_sent', productId);

            window.location.href = 'vendor-chat.html?vendorId=' + encodeURIComponent(vendorUsername || '');
        };

        window.toggleViewMode = function () {
            viewMode = viewMode === 'grid' ? 'list' : 'grid';
            document.getElementById('view-toggle-icon').className = viewMode === 'grid' ? 'fa-solid fa-table-cells' : 'fa-solid fa-bars';
            renderDisplayedItems();
        };

        window.openFull = function (src, isVideo) {
            const modal = document.getElementById('full-modal');
            const content = document.getElementById('modal-content');
            modal.style.display = 'flex';
            if (isVideo) {
                content.innerHTML = `<video src="${src}" autoplay loop playsinline controls class="w-full h-full object-cover"></video>`;
            } else {
                content.innerHTML = `<img src="${src}" class="w-full h-full object-cover">`;
            }
        };

        window.closeFull = function () {
            const modal = document.getElementById('full-modal');
            document.getElementById('modal-content').innerHTML = '';
            modal.style.display = 'none';
        };
    </script>
</body>
            </html>
