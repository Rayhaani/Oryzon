<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Channel - Nexus</title>
<style>
    :root {
        --cyan-neon: #00F2FF;
        --magenta-neon: #FF0055;
        --gold: #FFB800;
        --green-ok: #1EE676;
        --red-danger: #FF4D4D;
        --panel-bg: #0d0d0d;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
        background-color: #050505;
        color: #fff;
        min-height: 100vh;
        padding-bottom: 90px;
    }
    header {
        position: sticky; top: 0; z-index: 50;
        background: rgba(5,5,5,0.55);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 12px 16px;
        display: flex; align-items: center; gap: 12px;
        border-bottom: none;
    }
    .back-trigger { cursor: pointer; display: flex; align-items: center; flex-shrink:0; }
    .channel-avatar {
        width: 38px; height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--cyan-neon), var(--magenta-neon));
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 15px; color: #050505;
        flex-shrink: 0;
        cursor: pointer;
    }
    .channel-meta { flex: 1; overflow: hidden; cursor: pointer; }
    .channel-meta h1 {
        font-size: 16px; font-weight: 700;
        display: flex; align-items: center; gap: 5px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .verified-badge { flex-shrink: 0; }
    .channel-meta p { font-size: 12px; color: rgba(255,255,255,0.45); }
    .menu-icon { cursor: pointer; flex-shrink: 0; }

.feed { padding: 14px 12px 0 12px; }
    .post-card { margin-bottom: 16px; }

    .date-separator { display: flex; justify-content: center; margin: 8px 0 16px 0; }
    .date-separator span {
        background: rgba(255,255,255,0.08);
        color: rgba(255,255,255,0.6);
        font-size: 12px;
        font-weight: 600;
        padding: 5px 14px;
        border-radius: 12px;
    }

    .post-image {
        width: 100%;
        border-radius: 14px;
        display: block;
        background: #111;
        margin-bottom: 8px;
    }
    .post-content-wrap { padding: 0 4px 6px 4px; overflow: hidden; }
    .post-content-text { font-size: 14.5px; line-height: 1.5; color: rgba(255,255,255,0.9); }
      .post-timestamp {
        float: right;
        font-size: 11px;
        color: rgba(255,255,255,0.35);
        margin: 12px 0 0 10px;
        white-space: nowrap;
      }

    .post-footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 0 4px; }
    .post-views { font-size: 12px; color: rgba(255,255,255,0.35); display: flex; align-items: center; gap: 4px; }
    .reactions-bar { display: flex; gap: 6px; }
    .reaction-pill {
        display: flex; align-items: center; gap: 4px;
        background: rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 4px 10px;
        font-size: 12.5px;
        cursor: pointer;
        border: 1px solid transparent;
    }
    .reaction-pill.active { border-color: var(--cyan-neon); background: rgba(0,242,255,0.1); }
.composer-bar {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: rgba(5,5,5,0.95);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(255,255,255,0.06);
        padding: 10px 12px;
        z-index: 50;
    }
    .composer-pill {
        display: flex; align-items: center; gap: 4px;
        background: rgba(255,255,255,0.06);
        border-radius: 26px;
        padding: 4px 5px;
    }
    .composer-input {
        flex: 1;
        background: transparent;
        border: none;
        padding: 9px 6px;
        color: #fff;
        font-size: 14px;
        outline: none;
        min-width: 0;
    }
    .composer-input::placeholder { color: rgba(255,255,255,0.4); }
    .composer-send {
        width: 38px; height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--cyan-neon), var(--magenta-neon));
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
    }
    .subscribe-bar {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: rgba(5,5,5,0.95);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(255,255,255,0.06);
        padding: 12px 16px;
        text-align: center;
        font-weight: 700;
        color: var(--cyan-neon);
        cursor: pointer;
        z-index: 50;
    }

    /* ===== EXTENSION LAYER — added on top of the existing hardcoded layout above ===== */

    .header-icon-btn {
        cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        width: 20px; height: 20px; opacity: 0.9;
    }

    /* Pinned tag */
    .pin-tag {
        display: flex; align-items: center; gap: 5px;
        font-size: 11px; font-weight: 700; color: var(--gold);
        margin-bottom: 6px; padding: 0 4px;
    }

    /* Premium / paid lock badge (standard feature: paid channel subscriptions) */
    .paid-lock-overlay {
        position: relative; border-radius: 14px; overflow: hidden; margin-bottom: 8px;
        background: #111; padding: 34px 16px; text-align: center;
        border: 1px dashed rgba(255,184,0,0.4);
    }
    .paid-lock-overlay svg { margin-bottom: 8px; }
    .paid-lock-overlay p { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 10px; }
    .paid-unlock-btn {
        display: inline-block; background: linear-gradient(135deg, var(--gold), var(--magenta-neon));
        color: #050505; font-weight: 800; font-size: 12.5px; padding: 8px 18px; border-radius: 20px; cursor: pointer;
    }
     /* Video post */
    .post-video { width: 100%; border-radius: 14px; display: block; background: #111; margin-bottom: 8px; }

    /* Media + caption grouped as one bubble, like WhatsApp/Telegram */
    .post-media-group { border-radius: 14px; overflow: hidden; margin-bottom: 8px; background: #111; }
    .post-media-group .post-image,
    .post-media-group .post-video {
        margin-bottom: 0; border-radius: 0;
    }
    .post-media-group .post-content-wrap {
        padding: 8px 12px 10px 12px;
        background: rgba(255,255,255,0.05);
    }
    /* Data saver placeholder (HOT FEATURE 10) */
    .media-placeholder {
        width: 100%; border-radius: 14px; background: #111; margin-bottom: 8px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 30px 0; gap: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.06);
    }
    .media-placeholder span { font-size: 12px; color: rgba(255,255,255,0.5); }

    /* Poll block */
    .poll-block { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
    .poll-question { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .poll-option { position: relative; margin-bottom: 8px; cursor: pointer; border-radius: 10px; overflow: hidden; background: rgba(255,255,255,0.05); }
    .poll-bar-fill { position: absolute; top: 0; left: 0; bottom: 0; background: rgba(0,242,255,0.18); transition: width .4s ease; }
    .poll-option-row { position: relative; display: flex; justify-content: space-between; padding: 9px 12px; font-size: 13px; z-index: 1; }
    .poll-option.voted-for { outline: 1px solid var(--cyan-neon); }
    .poll-meta { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; }

    /* Group-buy block (HOT FEATURE 2) */
    .groupbuy-block { background: rgba(255,184,0,0.06); border: 1px solid rgba(255,184,0,0.25); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
    .groupbuy-title { font-size: 13px; font-weight: 800; color: var(--gold); margin-bottom: 6px; display:flex; align-items:center; gap:6px; }
    .groupbuy-track { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; margin-bottom: 6px; }
    .groupbuy-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--green-ok)); transition: width .4s ease; }
    .groupbuy-info { display: flex; justify-content: space-between; font-size: 11.5px; color: rgba(255,255,255,0.55); margin-bottom: 8px; }
    .groupbuy-btn { width: 100%; background: var(--gold); color: #050505; font-weight: 800; font-size: 12.5px; padding: 9px; border-radius: 10px; text-align: center; cursor: pointer; }

    /* Escrow / Trust Pay (HOT FEATURE 3) */
    .escrow-block { background: rgba(30,230,118,0.06); border: 1px solid rgba(30,230,118,0.25); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
    .escrow-title { font-size: 12.5px; font-weight: 800; color: var(--green-ok); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .escrow-price { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
    .escrow-btn { width: 100%; background: var(--green-ok); color: #050505; font-weight: 800; font-size: 12.5px; padding: 9px; border-radius: 10px; text-align: center; cursor: pointer; }
    .escrow-note { font-size: 10.5px; color: rgba(255,255,255,0.4); margin-top: 6px; text-align: center; }

    /* Delivery proof (HOT FEATURE 6) */
    .delivery-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(30,230,118,0.12); color: var(--green-ok); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; margin-bottom: 8px; }

    /* Duo broadcast badge (HOT FEATURE 8) */
    .duo-badge { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: rgba(255,255,255,0.55); margin-bottom: 6px; padding: 0 4px; }
    .duo-badge b { color: var(--cyan-neon); }

    /* Crowd-unlock (HOT FEATURE 9) */
    .unlock-block { background: rgba(255,0,85,0.06); border: 1px solid rgba(255,0,85,0.25); border-radius: 14px; padding: 12px; margin-bottom: 8px; text-align: center; }
    .unlock-title { font-size: 12.5px; font-weight: 800; color: var(--magenta-neon); margin-bottom: 6px; }
    .unlock-track { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; margin-bottom: 8px; }
    .unlock-fill { height: 100%; background: linear-gradient(90deg, var(--magenta-neon), var(--cyan-neon)); transition: width .4s ease; }
    .unlock-btn { display: inline-block; background: linear-gradient(135deg, var(--magenta-neon), var(--cyan-neon)); color: #fff; font-weight: 800; font-size: 12px; padding: 8px 16px; border-radius: 20px; cursor: pointer; }

    .edited-tag { font-size: 10.5px; color: rgba(255,255,255,0.3); margin-left: 6px; }

    /* AI Assistant FAB + panel (HOT FEATURE 1) */
    .ai-fab {
        position: fixed; right: 14px; bottom: 96px; z-index: 60;
        width: 50px; height: 50px; border-radius: 50%;
        background: linear-gradient(135deg, var(--cyan-neon), var(--magenta-neon));
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 18px rgba(0,242,255,0.35); cursor: pointer;
    }
    .ai-panel {
        position: fixed; right: 12px; bottom: 156px; z-index: 61;
        width: min(320px, 86vw); max-height: 60vh;
        background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px; display: none; flex-direction: column; overflow: hidden;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .ai-panel.open { display: flex; }
    .ai-panel-head { padding: 10px 14px; font-size: 13px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; }
    .ai-panel-body { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .ai-msg { font-size: 12.5px; line-height: 1.4; padding: 8px 10px; border-radius: 10px; max-width: 88%; }
    .ai-msg.bot { background: rgba(0,242,255,0.08); align-self: flex-start; }
    .ai-msg.user { background: rgba(255,255,255,0.08); align-self: flex-end; }
    .ai-panel-input-row { display: flex; gap: 6px; padding: 8px; border-top: 1px solid rgba(255,255,255,0.06); }
    .ai-panel-input-row input { flex: 1; background: rgba(255,255,255,0.06); border: none; border-radius: 16px; padding: 8px 12px; color: #fff; font-size: 12.5px; outline: none; }
    .ai-panel-input-row button { background: var(--cyan-neon); border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; flex-shrink: 0; }

    /* Generic modal system, reused by About / Analytics / Subscribe / Search / Poll composer / Schedule / Tip */
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 70;
        display: none; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
        width: 100%; max-width: 480px; max-height: 84vh; overflow-y: auto;
        background: var(--panel-bg); border-radius: 20px 20px 0 0;
        padding: 18px 18px 26px 18px; animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity:0; } to { transform: translateY(0); opacity:1; } }
    .modal-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 3px; margin: 0 auto 14px auto; }
    .modal-title { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
    .modal-sub { font-size: 12.5px; color: rgba(255,255,255,0.45); margin-bottom: 16px; }
    .modal-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .modal-row:last-child { border-bottom: none; }
    .modal-row-label { font-size: 13.5px; }
    .modal-row-label small { display: block; font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }

    .toggle-switch { width: 42px; height: 24px; border-radius: 14px; background: rgba(255,255,255,0.12); position: relative; cursor: pointer; flex-shrink: 0; }
    .toggle-switch.on { background: var(--cyan-neon); }
    .toggle-knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s ease; }
    .toggle-switch.on .toggle-knob { left: 20px; }

    .modal-btn {
        width: 100%; text-align: center; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 13.5px;
        cursor: pointer; margin-top: 10px;
    }
    .modal-btn.primary { background: linear-gradient(135deg, var(--cyan-neon), var(--magenta-neon)); color: #050505; }
    .modal-btn.ghost { background: rgba(255,255,255,0.06); color: #fff; }
    .modal-btn.danger { background: rgba(255,77,77,0.12); color: var(--red-danger); }

    .tier-card { border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
    .tier-card.selected { border-color: var(--gold); background: rgba(255,184,0,0.06); }
    .tier-name { font-size: 14px; font-weight: 800; display: flex; justify-content: space-between; }
    .tier-price { color: var(--gold); }
    .tier-desc { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }

    .search-input-box { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
    .search-input-box input { flex: 1; background: none; border: none; color: #fff; font-size: 14px; outline: none; }
    .search-result-item { padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; color: rgba(255,255,255,0.8); cursor: pointer; }

    .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .analytics-tile { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; }
    .analytics-tile .num { font-size: 20px; font-weight: 800; }
    .analytics-tile .lbl { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }
    .mini-bars { display: flex; align-items: flex-end; gap: 4px; height: 60px; margin-bottom: 8px; }
    .mini-bars div { flex: 1; background: linear-gradient(180deg, var(--cyan-neon), var(--magenta-neon)); border-radius: 2px; }

    .poll-option-input { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .poll-option-input input { flex: 1; background: rgba(255,255,255,0.06); border: none; border-radius: 10px; padding: 9px 12px; color: #fff; font-size: 13px; outline: none; }
    .composer-textarea { width: 100%; background: rgba(255,255,255,0.06); border: none; border-radius: 12px; padding: 10px 12px; color: #fff; font-size: 13.5px; outline: none; margin-bottom: 10px; min-height: 70px; resize: vertical; }

    .attach-menu { position: fixed; bottom: 66px; left: 0; right: 0; z-index: 55; display: none; padding: 10px 12px; }
    .attach-menu.open { display: flex; gap: 10px; overflow-x: auto; background: rgba(5,5,5,0.97); border-top: 1px solid rgba(255,255,255,0.06); }
    .attach-option { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px; cursor: pointer; }
    .attach-icon-circle { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; }
    .attach-option span { font-size: 10px; color: rgba(255,255,255,0.6); text-align: center; }
    .composer-attach-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 12.5px; padding: 10px 18px; border-radius: 20px; z-index: 90; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
</style>
</head>
<body>

    <header>
        <div class="back-trigger" onclick="window.location.href='chats.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M11 17l-5-5 5-5M18 12H6"/></svg>
        </div>
        <div class="channel-avatar" id="headerAvatar" onclick="openAboutModal()">N</div>
        <div class="channel-meta" onclick="openAboutModal()">
            <h1 id="headerName">Channel<span class="verified-badge" id="verifiedBadge"></span></h1>
            <p id="headerSubCount">0 subscribers</p>
        </div>
        <div class="header-icon-btn" id="searchIconBtn" onclick="openSearchModal()" title="Search">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        </div>
        <div class="menu-icon" onclick="openMenuModal()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </div>
    </header>

    <div class="feed" id="feedContainer"></div>

    <div id="bottomBar"></div>

    <!-- composer attachment menu (standard: image/video/poll + hot: group-buy/escrow/delivery/unlock/duo) -->
    <div class="attach-menu" id="attachMenu"></div>

    <!-- HOT FEATURE 1: AI Channel Assistant -->
    <div class="ai-fab" id="aiFab" onclick="toggleAIPanel()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#050505" stroke-width="2.2"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="3"/></svg>
    </div>
    <div class="ai-panel" id="aiPanel">
        <div class="ai-panel-head">
            <span>✨ Channel AI Assistant</span>
            <span style="cursor:pointer;opacity:.6" onclick="toggleAIPanel()">✕</span>
        </div>
        <div class="ai-panel-body" id="aiPanelBody"></div>
        <div class="ai-panel-input-row">
            <input type="text" id="aiInput" placeholder="Ask about this channel or a post...">
            <button onclick="sendAIQuestion()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#050505" stroke-width="2.6"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
            </button>
        </div>
    </div>

    <!-- generic modal shell, content injected per-modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBackdrop(event)">
        <div class="modal-sheet" id="modalSheet"></div>
    </div>

    <div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
    /* ============================================================
       NEXUS CHANNEL — now wired to real Firebase (Firestore + Auth).
       Project: oryzon-50ea4. Every reaction, vote, group-buy join,
       escrow payment, tip and post you see below is read from and
       written to Firestore in real time via onSnapshot listeners —
       nothing here is local-only demo data anymore.

       DATA MODEL
       channels/{channelId}
           name, initials, subscriberCount, verified, description,
           link, category, tiers[], adminIds[], duoPartner{active,name}
       channels/{channelId}/posts/{postId}
           type, content, image, video, poster, views, timestamp,
           reactions{emoji:count}, reactedBy{uid:emoji}, pinned, paid,
           edited, tips, poll{...}, pollVotedBy{uid:index},
           groupbuy{...}, groupBuyJoinedBy{uid:true},
           escrow{...}, unlock{...}, unlockBoostedBy{uid:true},
           duoBroadcast, authorId
       channels/{channelId}/subscribers/{uid}
           subscribedAt, muted
       channels/{channelId}/tierSubs/{uid}
           tierId, subscribedAt
       users/{uid}/savedPosts/{channelId__postId}
           channelId, postId, savedAt

       ASSUMPTION worth checking: unauthenticated visitors are sent to

    function formatTimeAgo(ts) {

    function renderPollBlock(post) {
        const poll = post.poll;
        const totalVotes = poll.options.reduce((s, o) => s + o.votes, 0);
        const endsAtMs = tsToMillis(poll.endsAt);
        const hoursLeft = Math.max(0, Math.floor((endsAtMs - Date.now()) / 3600000));
        return `
            <div class="poll-block">
                <div class="poll-question">📊 ${poll.question}</div>
                ${poll.options.map((o, i) => {
                    const pct = totalVotes ? Math.round((o.votes / totalVotes) * 100) : 0;
                    return `
                        <div class="poll-option ${poll.votedIndex === i ? 'voted-for' : ''}" onclick="voteOnPoll('${post.id}', ${i})">
                            <div class="poll-bar-fill" style="width:${poll.votedIndex !== null ? pct : 0}%"></div>
                            <div class="poll-option-row">
                                <span>${o.text}</span>
                                <span>${poll.votedIndex !== null ? pct + '%' : ''}</span>
                            </div>
                        </div>`;
                }).join('')}
                <div class="poll-meta">${formatCount(totalVotes)} votes · ${poll.hideNames ? 'Anonymous' : 'Public'} · ${hoursLeft > 0 ? hoursLeft + 'h left' : 'Ended'}</div>
            </div>`;
    }

    async function toggleReaction(postId, emoji) {

        const uid = currentUsername;
        try {
            await db.runTransaction(async t => {
                const doc = await t.get(ref);
                if (!doc.exists) return;
                const data = doc.data();
                const reactions = Object.assign({ '❤️': 0, '🔥': 0, '😂': 0, '👍': 0 }, data.reactions);
                const reactedBy = Object.assign({}, data.reactedBy);
                const current = reactedBy[uid];
                if (current === emoji) {
                    reactions[emoji] = Math.max(0, (reactions[emoji] || 0) - 1);
                    delete reactedBy[uid];
                } else {
                    if (current) reactions[current] = Math.max(0, (reactions[current] || 0) - 1);
                    reactions[emoji] = (reactions[emoji] || 0) + 1;
                    reactedBy[uid] = emoji;
                }
                t.update(ref, { reactions, reactedBy });
            });
        } catch (e) { showToast('Could not save reaction — try again'); }
    }

    async function joinGroupBuy(postId) {

    /* ---------- HOT FEATURE 9: crowd-unlock ---------- */
    async function boostUnlock(postId) {
        const ref = postsRef().doc(postId);
        const uid = currentUsername;
        try {
            await db.runTransaction(async t => {
                const doc = await t.get(ref);
                if (!doc.exists) return;
                const data = doc.data();
                if (data.unlockBoostedBy && data.unlockBoostedBy[uid]) return;
                if (data.unlock.unlocked) return;
                const newCurrent = Math.min(data.unlock.needed, data.unlock.current + 1);
                t.update(ref, {
                    'unlock.current': newCurrent,
                    'unlock.unlocked': newCurrent >= data.unlock.needed,
                    ['unlockBoostedBy.' + uid]: true
                });
            });
            showToast('Thanks — pushing this closer to unlocked');
        } catch (e) { showToast('Could not register your boost — try again'); }
    }

    /* ---------- polls ---------- */
    async function voteOnPoll(postId, optionIndex) {
        const ref = postsRef().doc(postId);
        const uid = currentUsername;

            await db.runTransaction(async t => {
                const doc = await t.get(ref);
                if (!doc.exists) return;
                const data = doc.data();
                if (data.pollVotedBy && data.pollVotedBy[uid] !== undefined) return;
                const options = data.poll.options.slice();
                options[optionIndex] = Object.assign({}, options[optionIndex], { votes: (options[optionIndex].votes || 0) + 1 });
                t.update(ref, {
                    'poll.options': options,
                    ['pollVotedBy.' + uid]: optionIndex
                });
            });
        } catch (e) { showToast('Could not record your vote — try again'); }
    }

    function confirmSchedule() {
        const val = document.getElementById('scheduleInput').value;
        if (!val) { showToast('Pick a date and time'); return; }
        scheduledForTs = new Date(val).getTime();
        closeModal();
        showToast('Next message will publish at the scheduled time');
    }

    let paidComposeFlag = false;
    function togglePaidComposeFlag() {
        paidComposeFlag = !paidComposeFlag;
        toggleAttachMenu();
        showToast(paidComposeFlag ? 'Next message will be marked Nexus Plus only' : 'Next message will be public');
    }

    function basePostFields(overrides) {
        return Object.assign({
            type: 'text',
            content: '',
            image: null,
            video: null,
            poster: null,
            views: 0,
            timestamp: (scheduledForTs && scheduledForTs > Date.now())
                ? firebase.firestore.Timestamp.fromMillis(scheduledForTs)
                : FieldValue.serverTimestamp(),
            reactions: { '❤️': 0, '🔥': 0, '😂': 0, '👍': 0 },
            reactedBy: {},
            pinned: false,
            paid: paidComposeFlag,
            edited: false,
            tips: 0,
            duoBroadcast: false,
            authorUsername: currentUsername
        }, overrides);
    }

    async function publishPost(mediaType) {
        const input = document.getElementById('composerInput');
        const text = input.value.trim();
        const mediaUrlEl = document.getElementById('mediaUrlInput');
        const mediaUrl = mediaUrlEl ? mediaUrlEl.value.trim() : '';
        if (!text && !mediaUrl) return;

        const fields = basePostFields({
            content: text || (mediaType === 'video' ? 'New video' : 'New photo'),
            type: mediaType === 'video' ? 'video' : (mediaType === 'image' ? 'image' : 'text')
        });
        if (mediaType === 'image') fields.image = mediaUrl || 'https://placehold.co/600x360/111111/00F2FF?text=New+Post';
        if (mediaType === 'video') fields.video = mediaUrl || '';

        try {
            await postsRef().add(fields);
            input.value = '';
            paidComposeFlag = false;
            scheduledForTs = null;
            if (document.getElementById('modalOverlay').classList.contains('open')) closeModal();
            showToast('Broadcast sent to ' + formatCount(channelInfo.subscriberCount) + ' subscribers');
        } catch (e) { showToast('Could not publish — try again'); }
    }

</script>

</body>
</html>
