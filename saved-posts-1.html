<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved — Oryzon</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
        background:#050505;
        color:#fff;
        font-family:'Inter', sans-serif;
        padding-bottom:30px;
    }
    .icon-btn { display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; }
    .icon-btn svg { display:block; }
    .icon-btn.active { color:#fde08d; }

    /* ===== HEADER (Instagram-style, no divider) ===== */
    .saved-header {
        position:sticky; top:0; z-index:50;
        background:#050505;
        padding:14px 14px 10px;
    }
    .saved-header-row {
        display:flex; align-items:center; gap:12px;
    }
    .saved-title { font-size:19px; font-weight:700; flex:1; }
    .saved-actions { display:flex; align-items:center; gap:18px; flex-shrink:0; }
    .saved-actions .icon-btn svg { width:23px; height:23px; }
    .saved-header-row > .icon-btn:first-child svg { width:21px; height:21px; }

    /* ===== SEARCH PANEL ===== */
    .search-panel { max-height:0; overflow:hidden; transition:max-height 0.25s ease; }
    .search-panel.open { max-height:150px; }
    .search-box {
        display:flex; align-items:center; gap:8px;
        background:rgba(255,255,255,0.06);
        border:1px solid rgba(255,255,255,0.1);
        border-radius:10px; padding:9px 12px; margin-top:12px;
    }
    .search-box svg { width:15px; height:15px; color:rgba(255,255,255,0.5); flex-shrink:0; }
    .search-box input {
        background:none; border:none; outline:none; color:#fff;
        font-family:'Inter', sans-serif; font-size:13.5px; flex:1;
    }
    .search-box input::placeholder { color:rgba(255,255,255,0.4); }
    .search-scopes { display:flex; gap:6px; overflow-x:auto; margin-top:9px; padding-bottom:8px; scrollbar-width:none; }
    .search-scopes::-webkit-scrollbar { display:none; }
    .scope-chip {
        flex-shrink:0; font-size:11.5px; font-weight:600;
        padding:5px 12px; border-radius:20px;
        background:rgba(255,255,255,0.05);
        border:1px solid rgba(255,255,255,0.08);
        color:rgba(255,255,255,0.65);
        cursor:pointer; white-space:nowrap;
    }
    .scope-chip.active { background:rgba(253,224,141,0.15); border-color:#fde08d; color:#fde08d; }

    .result-count { padding:10px 14px 4px; font-size:12px; color:rgba(255,255,255,0.4); }

    /* ===== GRID VIEW (masonry) ===== */
    #viewArea { padding:8px 8px 0; background:#050505; }
    .grid-view { column-count:2; column-gap:7px; }
    .grid-card {
        break-inside:avoid; margin-bottom:7px;
        border-radius:12px; overflow:hidden; position:relative;
        background:#050505;
    }
    .grid-card img { width:100%; display:block; }
    .grid-caption {
        position:absolute; left:0; right:0; bottom:0;
        padding:22px 8px 8px;
        background:linear-gradient(transparent, rgba(0,0,0,0.85));
    }
    .grid-caption .cap-text {
        font-size:12px; font-weight:600; color:#fff;
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
        overflow:hidden; line-height:1.35;
    }
    .grid-caption .cap-meta { font-size:10px; color:rgba(255,255,255,0.6); margin-top:2px; }
    .grid-type-badge {
        position:absolute; top:6px; right:6px;
        background:rgba(0,0,0,0.55);
        width:22px; height:22px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        color:#fde08d;
    }
    .grid-type-badge svg { width:12px; height:12px; }

    /* ===== LIST VIEW (no cards, hairline dividers, pure black bg) ===== */
    .list-view { display:none; flex-direction:column; background:#050505; }
    .list-item {
        display:flex; align-items:flex-start; gap:12px;
        padding:12px 4px;
        border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .list-thumb { width:56px; height:56px; border-radius:10px; object-fit:cover; flex-shrink:0; }
    .list-body { flex:1; min-width:0; }
    .list-cap {
        font-size:13.5px; font-weight:600; color:#fff;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .list-meta { font-size:11.5px; color:rgba(255,255,255,0.45); margin-top:3px; }
    .list-type { font-size:11px; color:rgba(253,224,141,0.85); margin-top:3px; font-weight:500; }
    .list-item .icon-btn { flex-shrink:0; margin-top:2px; }
    .list-item .icon-btn svg { width:16px; height:16px; color:rgba(255,255,255,0.4); }

    .empty-state { text-align:center; padding:60px 20px; color:rgba(255,255,255,0.4); font-size:13px; }
</style>
</head>
<body>

<div class="saved-header">
    <div class="saved-header-row">
        <span class="icon-btn" id="backBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </span>
        <span class="saved-title">Saved</span>
        <div class="saved-actions">
            <span class="icon-btn" id="searchToggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            </span>
            <span class="icon-btn" id="viewToggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            </span>
            <span class="icon-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </span>
        </div>
    </div>
    <div class="search-panel" id="searchPanel">
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Search by page, group, channel, poster or date...">
        </div>
        <div class="search-scopes">
            <span class="scope-chip active" data-scope="all">All</span>
            <span class="scope-chip" data-scope="page">Page</span>
            <span class="scope-chip" data-scope="group">Group</span>
            <span class="scope-chip" data-scope="channel">Channel</span>
            <span class="scope-chip" data-scope="poster">Poster</span>
            <span class="scope-chip" data-scope="date">Date</span>
        </div>
    </div>
</div>

<div class="result-count" id="resultCount"></div>
<div id="viewArea">
    <div class="grid-view" id="gridView"></div>
    <div class="list-view" id="listView"></div>
</div>

<script>
const items = [
    { id:1, img:'https://picsum.photos/seed/oryzon1/400/560', cap:'Ogbono soup recipe — full step by step video with all ingredients listed', source:'Kitchen Hausa', type:'Page', date:'2024-11-02', dateDisplay:'2 Nov 2024' },
    { id:2, img:'https://picsum.photos/seed/oryzon2/400/300', cap:'Get rid of stubborn rats naturally', source:'Home Hacks NG', type:'Channel', date:'2023-06-14', dateDisplay:'14 Jun 2023' },
    { id:3, img:'https://picsum.photos/seed/oryzon3/400/480', cap:'Jollof rice with fried plantain plating idea for weekend', source:'Amina Yusuf', type:'Poster', date:'2016-03-09', dateDisplay:'9 Mar 2016' },
    { id:4, img:'https://picsum.photos/seed/oryzon4/400/620', cap:'Suya spice mix ratio that actually works', source:'Naija Foodies', type:'Group', date:'2022-01-20', dateDisplay:'20 Jan 2022' },
    { id:5, img:'https://picsum.photos/seed/oryzon5/400/350', cap:'Efulefu market day vlog part 2', source:'Bashir Vlogs', type:'Channel', date:'2019-08-30', dateDisplay:'30 Aug 2019' },
    { id:6, img:'https://picsum.photos/seed/oryzon6/400/500', cap:'Modern living room paint combos for small apartments', source:'Interior Naija', type:'Page', date:'2025-02-11', dateDisplay:'11 Feb 2025' },
    { id:7, img:'https://picsum.photos/seed/oryzon7/400/300', cap:'Masallaci photo from Juma\'a prayer, MDR area', source:'Fatima Bello', type:'Poster', date:'2015-11-05', dateDisplay:'5 Nov 2015' },
    { id:8, img:'https://picsum.photos/seed/oryzon8/400/460', cap:'Miyan kuka with pounded yam plating reference', source:'Northern Delicacies', type:'Group', date:'2021-07-19', dateDisplay:'19 Jul 2021' },
    { id:9, img:'https://picsum.photos/seed/oryzon9/400/580', cap:'Pancake stack breakfast idea, quick recipe in comments', source:'Sweet Tooth Kitchen', type:'Page', date:'2024-04-01', dateDisplay:'1 Apr 2024' },
    { id:10, img:'https://picsum.photos/seed/oryzon10/400/320', cap:'Wahala fitness rant — motivational clip', source:'Coach Danladi', type:'Channel', date:'2020-09-23', dateDisplay:'23 Sep 2020' },
    { id:11, img:'https://picsum.photos/seed/oryzon11/400/540', cap:'Vending machine snack haul from Lagos airport', source:'Chidi Okafor', type:'Poster', date:'2023-12-17', dateDisplay:'17 Dec 2023' },
    { id:12, img:'https://picsum.photos/seed/oryzon12/400/400', cap:'Small business packaging inspiration for skincare brand', source:'Made In Kano', type:'Group', date:'2017-05-08', dateDisplay:'8 May 2017' },
];

let currentView = 'grid';
let currentScope = 'all';

const ICONS = {
    grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="3" height="3" rx="0.6" fill="currentColor" stroke="none"/><line x1="10" y1="6.5" x2="20" y2="6.5"/><rect x="4" y="10.5" width="3" height="3" rx="0.6" fill="currentColor" stroke="none"/><line x1="10" y1="12" x2="20" y2="12"/><rect x="4" y="16" width="3" height="3" rx="0.6" fill="currentColor" stroke="none"/><line x1="10" y1="17.5" x2="20" y2="17.5"/></svg>',
    ellipsis: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>',
    Page: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 3v18M5 4h12l-2.2 4L17 12H5"/></svg>',
    Group: '<svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3" fill="currentColor"/><circle cx="16" cy="10" r="2.5" fill="currentColor" opacity="0.7"/><path d="M3.5 19c0-3.3 2.7-5.5 5.5-5.5s5.5 2.2 5.5 5.5" fill="currentColor"/></svg>',
    Channel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><path d="M8.7 8.7a4.6 4.6 0 000 6.6M15.3 8.7a4.6 4.6 0 010 6.6M5.8 5.8a8.7 8.7 0 000 12.4M18.2 5.8a8.7 8.7 0 010 12.4"/></svg>',
    Poster: '<svg viewBox="0 0 24 24"><circle cx="12" cy="7.8" r="3.2" fill="currentColor"/><path d="M5 19.5c0-3.9 3-6 7-6s7 2.1 7 6" fill="currentColor"/></svg>'
};

function matches(item, q){
    if(!q) return true;
    q = q.toLowerCase();
    if(currentScope === 'all'){
        return item.cap.toLowerCase().includes(q) || item.source.toLowerCase().includes(q) || item.dateDisplay.toLowerCase().includes(q) || item.date.includes(q);
    }
    if(currentScope === 'date'){
        return item.dateDisplay.toLowerCase().includes(q) || item.date.includes(q);
    }
    const scopeType = { page:'Page', group:'Group', channel:'Channel', poster:'Poster' }[currentScope];
    return item.type === scopeType && (item.source.toLowerCase().includes(q) || q === '');
}

function render(){
    const q = document.getElementById('searchInput').value.trim();
    const filtered = items.filter(it => matches(it, q));
    document.getElementById('resultCount').textContent = q ? `${filtered.length} result${filtered.length!==1?'s':''}` : '';

    const grid = document.getElementById('gridView');
    const list = document.getElementById('listView');

    if(filtered.length === 0){
        grid.innerHTML = list.innerHTML = '<div class="empty-state">Babu abin da ya dace da bincikenka.</div>';
        return;
    }

    grid.innerHTML = filtered.map(it => `
        <div class="grid-card">
            <img src="${it.img}" loading="lazy">
            <div class="grid-type-badge">${ICONS[it.type]}</div>
            <div class="grid-caption">
                <div class="cap-text">${it.cap}</div>
                <div class="cap-meta">${it.source} · ${it.dateDisplay}</div>
            </div>
        </div>
    `).join('');

    list.innerHTML = filtered.map(it => `
        <div class="list-item">
            <img src="${it.img}" class="list-thumb">
            <div class="list-body">
                <div class="list-cap">${it.cap}</div>
                <div class="list-meta">${it.source} · ${it.dateDisplay}</div>
                <div class="list-type">${it.type}</div>
            </div>
            <span class="icon-btn">${ICONS.ellipsis}</span>
        </div>
    `).join('');
}

function toggleSearch(){
    const panel = document.getElementById('searchPanel');
    const icon = document.getElementById('searchToggle');
    panel.classList.toggle('open');
    icon.classList.toggle('active');
    if(panel.classList.contains('open')) document.getElementById('searchInput').focus();
}

function toggleView(){
    currentView = currentView === 'grid' ? 'list' : 'grid';
    const icon = document.getElementById('viewToggle');
    document.getElementById('gridView').style.display = currentView === 'grid' ? 'block' : 'none';
    document.getElementById('listView').style.display = currentView === 'list' ? 'flex' : 'none';
    icon.innerHTML = currentView === 'grid' ? ICONS.grid : ICONS.list;
}

function goBack(){
    if (window.parent && window.parent !== window && typeof window.parent.closePageOverlay === 'function') {
        window.parent.closePageOverlay();
    } else {
        history.back();
    }
}

document.getElementById('backBtn').addEventListener('click', goBack);
document.getElementById('searchToggle').addEventListener('click', toggleSearch);
document.getElementById('viewToggle').addEventListener('click', toggleView);
document.getElementById('searchInput').addEventListener('input', render);
document.querySelectorAll('.scope-chip').forEach(chip => {
    chip.addEventListener('click', () => {
        document.querySelectorAll('.scope-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentScope = chip.dataset.scope;
        render();
    });
});

render();
document.getElementById('listView').style.display = 'none';
</script>
</body>
</html>
