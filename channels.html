<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Channel - Nexus</title>
<style>
    :root {
        --cyan-neon: #00F2FF;
        --magenta-neon: #FF0055;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
        background-color: #050505;
        color: #fff;
        min-height: 100vh;
        padding-bottom: 90px;
    }
    header {
        position: sticky; top: 0; z-index: 50;
        background: rgba(5,5,5,0.92);
        backdrop-filter: blur(10px);
        padding: 12px 16px;
        display: flex; align-items: center; gap: 12px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .back-trigger { cursor: pointer; display: flex; align-items: center; flex-shrink:0; }
    .channel-avatar {
        width: 38px; height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--cyan-neon), var(--magenta-neon));
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 15px; color: #050505;
        flex-shrink: 0;
    }
    .channel-meta { flex: 1; overflow: hidden; }
    .channel-meta h1 {
        font-size: 16px; font-weight: 700;
        display: flex; align-items: center; gap: 5px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .verified-badge { flex-shrink: 0; }
    .channel-meta p { font-size: 12px; color: rgba(255,255,255,0.45); }
    .menu-icon { cursor: pointer; flex-shrink: 0; }

    .feed { padding: 14px 12px 0 12px; }
    .post-card { margin-bottom: 16px; }
    .post-head { display: flex; align-items: center; gap: 10px; padding: 0 4px 8px 4px; }
    .post-head .channel-avatar { width: 30px; height: 30px; font-size: 12px; }
    .post-head-text h4 { font-size: 13px; font-weight: 700; display:flex; align-items:center; gap:4px; }
    .post-head-text span { font-size: 11px; color: rgba(255,255,255,0.4); }

    .post-content { font-size: 14.5px; line-height: 1.5; color: rgba(255,255,255,0.9); padding: 0 4px; }
    .post-image {
        margin-top: 8px;
        width: 100%;
        border-radius: 14px;
        display: block;
        background: #111;
    }

    .post-footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 0 4px; }
    .post-views { font-size: 12px; color: rgba(255,255,255,0.35); display: flex; align-items: center; gap: 4px; }
    .reactions-bar { display: flex; gap: 6px; }
    .reaction-pill {
        display: flex; align-items: center; gap: 4px;
        background: rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 4px 10px;
        font-size: 12.5px;
        cursor: pointer;
        border: 1px solid transparent;
    }
    .reaction-pill.active { border-color: var(--cyan-neon); background: rgba(0,242,255,0.1); }

    .composer-bar {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: rgba(5,5,5,0.95);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(255,255,255,0.06);
        padding: 10px 12px;
        display: flex; align-items: center; gap: 10px;
        z-index: 50;
    }
    .composer-input {
        flex: 1;
        background: rgba(255,255,255,0.06);
        border: none;
        border-radius: 22px;
        padding: 11px 16px;
        color: #fff;
        font-size: 14px;
        outline: none;
    }
    .composer-input::placeholder { color: rgba(255,255,255,0.4); }
    .composer-send {
        width: 42px; height: 42px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--cyan-neon), var(--magenta-neon));
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
    }

    .subscribe-bar {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: rgba(5,5,5,0.95);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(255,255,255,0.06);
        padding: 12px 16px;
        text-align: center;
        font-weight: 700;
        color: var(--cyan-neon);
        cursor: pointer;
        z-index: 50;
    }
</style>
</head>
<body>

    <header>
        <div class="back-trigger" onclick="window.location.href='chats.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M11 17l-5-5 5-5M18 12H6"/></svg>
        </div>
        <div class="channel-avatar" id="headerAvatar">N</div>
        <div class="channel-meta">
            <h1 id="headerName">Channel<span class="verified-badge" id="verifiedBadge"></span></h1>
            <p id="headerSubCount">0 subscribers</p>
        </div>
        <div class="menu-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </div>
    </header>

    <div class="feed" id="feedContainer"></div>

    <div id="bottomBar"></div>

<script>
    const REACTION_EMOJIS = ['❤️', '🔥', '😂', '👍'];
    let isAdmin = true; // admin ne mai kirkiro channel, ko subscriber ne kawai

    let channelInfo = {
        id: 'demo_channel',
        name: 'Nexus Tech Digest',
        initials: 'NT',
        subscriberCount: 12400,
        verified: true
    };

    const params = new URLSearchParams(window.location.search);
    if (params.get('new') === '1') {
        const stored = sessionStorage.getItem('newChannelData');
        if (stored) {
            const data = JSON.parse(stored);
            channelInfo = {
                id: data.id,
                name: data.name,
                initials: data.name.slice(0, 2).toUpperCase(),
                subscriberCount: data.subscriberCount,
                verified: false
            };
            isAdmin = true;
        }
    }

    let postsData = [
        {
            id: 'p1',
            content: 'Welcome to the channel! We\'ll be sharing updates, tips, and behind-the-scenes here.',
            image: null,
            views: 1840,
            timestamp: Date.now() - 3600000,
            reactions: { '❤️': 42, '🔥': 18, '😂': 2, '👍': 30 },
            myReaction: null
        },
        {
            id: 'p2',
            content: 'New feature just dropped — check out the update page for details.',
            image: 'https://placehold.co/600x360/111111/00F2FF?text=Update',
            views: 963,
            timestamp: Date.now() - 7200000,
            reactions: { '❤️': 15, '🔥': 9, '😂': 0, '👍': 12 },
            myReaction: '🔥'
        }
    ];

    function formatCount(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
        return n.toString();
    }

    function formatTimeAgo(ts) {
        const mins = Math.floor((Date.now() - ts) / 60000);
        if (mins < 60) return mins + 'm ago';
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + 'h ago';
        return Math.floor(hrs / 24) + 'd ago';
    }

    function renderHeader() {
        document.getElementById('headerAvatar').textContent = channelInfo.initials;
        document.getElementById('headerName').innerHTML = channelInfo.name + (channelInfo.verified ? ' <span class="verified-badge"><svg width="15" height="15" viewBox="0 0 24 24" fill="var(--cyan-neon)"><path d="M12 2l2.4 2.4 3.4-.5.5 3.4L21 9.6 18.7 12 21 14.4l-2.7 1.7-.5 3.4-3.4-.5L12 22l-2.4-2.4-3.4.5-.5-3.4L3 14.4 5.3 12 3 9.6l2.7-1.7.5-3.4 3.4.5z"/><path d="M9 12l2 2 4-4" stroke="#050505" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' : '');
        document.getElementById('headerSubCount').textContent = formatCount(channelInfo.subscriberCount) + ' subscribers';
    }

    function renderFeed() {
        const container = document.getElementById('feedContainer');
        container.innerHTML = '';
        const sorted = [...postsData].sort((a, b) => b.timestamp - a.timestamp);
        sorted.forEach(post => {
            const card = document.createElement('div');
            card.className = 'post-card';
            card.innerHTML = `
                <div class="post-head">
                    <div class="channel-avatar">${channelInfo.initials}</div>
                    <div class="post-head-text">
                        <h4>${channelInfo.name} ${channelInfo.verified ? '✓' : ''}</h4>
                        <span>${formatTimeAgo(post.timestamp)}</span>
                    </div>
                </div>
                <div class="post-content">${post.content}</div>
                ${post.image ? `<img src="${post.image}" class="post-image">` : ''}
                <div class="post-footer">
                    <div class="post-views">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        ${formatCount(post.views)}
                    </div>
                    <div class="reactions-bar">
                        ${REACTION_EMOJIS.map(e => `
                            <div class="reaction-pill ${post.myReaction === e ? 'active' : ''}" onclick="toggleReaction('${post.id}', '${e}')">
                                ${e} ${post.reactions[e] > 0 ? post.reactions[e] : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function toggleReaction(postId, emoji) {
        const post = postsData.find(p => p.id === postId);
        if (!post) return;
        if (post.myReaction === emoji) {
            post.reactions[emoji]--;
            post.myReaction = null;
        } else {
            if (post.myReaction) post.reactions[post.myReaction]--;
            post.reactions[emoji]++;
            post.myReaction = emoji;
        }
        renderFeed();
    }

    function renderBottomBar() {
        const bar = document.getElementById('bottomBar');
        if (isAdmin) {
            bar.innerHTML = `
                <div class="composer-bar">
                    <input type="text" class="composer-input" id="composerInput" placeholder="Broadcast a message...">
                    <div class="composer-send" onclick="publishPost()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#050505" stroke-width="2.4"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
                    </div>
                </div>
            `;
        } else {
            bar.innerHTML = `<div class="subscribe-bar" onclick="alert('Subscribed!')">Subscribe</div>`;
        }
    }

    function publishPost() {
        const input = document.getElementById('composerInput');
        const text = input.value.trim();
        if (!text) return;
        postsData.push({
            id: 'p' + Date.now(),
            content: text,
            image: null,
            views: 0,
            timestamp: Date.now(),
            reactions: { '❤️': 0, '🔥': 0, '😂': 0, '👍': 0 },
            myReaction: null
        });
        input.value = '';
        renderFeed();
    }

    renderHeader();
    renderFeed();
    renderBottomBar();
</script>

</body>
</html>
