<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#050505">
<title>Channel - Nexus</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="channels.css">
</head>
<body>
    <div id="page-content">
    <header>
        <div class="back-trigger" data-spa-link="chats.html" aria-label="Back">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M11 17l-5-5 5-5M18 12H6"/></svg>
        </div>
        <div class="nx-av" id="headerAvatar" data-act="info" style="--nx-av:40px"></div>
        <div class="channel-meta" data-act="info">
            <h1 id="headerName"><span class="nm">Channel</span></h1>
            <p id="headerSubCount">&nbsp;</p>
        </div>
        <div class="header-icons">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" data-act="search" id="searchIconBtn" aria-label="Search" style="cursor:pointer;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <div class="nx-dots" data-act="menu" aria-label="More options">
                <span class="dot-item" style="color:#fff; font-size: var(--nx-fs-l); font-weight: var(--nx-fw); display:inline-block; animation: dotSequence 1.5s infinite ease-in-out;">•</span>
                <span class="dot-item" style="color:#fff; font-size: var(--nx-fs-l); font-weight: var(--nx-fw); display:inline-block; animation: dotSequence 1.5s infinite ease-in-out; animation-delay:0.3s;">•</span>
                <span class="dot-item" style="color:#fff; font-size: var(--nx-fs-l); font-weight: var(--nx-fw); display:inline-block; animation: dotSequence 1.5s infinite ease-in-out; animation-delay:0.6s;">•</span>
            </div>
        </div>
    </header>

    <div class="ch-pin" id="pinBar" data-act="gotoPin" hidden></div>

    <main class="feed" id="feedContainer"></main>

    <div id="bottomBar"></div>

    <button id="toLatest" data-act="toLatest" aria-label="Jump to latest">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg><em id="toLatestN"></em>
    </button>

    <input type="file" id="chFile" hidden>

    <div id="chSheetWrap"><div id="chSheetBg"></div><div id="chSheet"></div></div>

    <div class="ch-ov" id="chSearch">
        <div class="ch-ov-top">
            <div class="bk" data-act="back" aria-label="Close search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M11 17l-5-5 5-5M18 12H6"/></svg></div>
            <input id="chSearchInput" type="search" placeholder="Search this channel" autocomplete="off" enterkeyhint="search">
        </div>
        <div class="ch-ov-body" id="chSearchBody"></div>
    </div>

    <div class="ch-ov" id="chLight"></div>

    <div id="chToast"></div>
    </div>

<script src="nx-embed.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>if (!window.nxEmbedMain || !nxEmbedMain('channels.js')) document.write('<script src="channels.js"><\/script>');</script>

</body>
</html>
