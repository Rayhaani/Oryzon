<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migration</title>
<style>body{background:#050505;color:#fff;font-family:sans-serif;padding:16px;max-width:560px;margin:auto}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #272727;background:#0f0f0f;color:#fff;font-size:16px;margin:6px 0}button{background:#fff;color:#050505;font-weight:700;border:none}button.g{background:#272727;color:#fff}pre{background:#0f0f0f;border:1px solid #1f1f1f;border-radius:12px;padding:12px;font-size:12px;white-space:pre-wrap;max-height:50vh;overflow:auto}</style></head><body>
<h2>Private data migration</h2>
<div id="login"><input id="em" type="email" placeholder="Admin email"><input id="pw" type="password" placeholder="Admin password"><button onclick="go()">Sign in</button></div>
<div id="app" style="display:none"><button class="g" onclick="run('dry')">1. Dry run (changes nothing)</button><button onclick="run('copy')">2. Copy to providerPrivate</button><button class="g" onclick="run('verify')">3. Verify copies</button><button class="g" onclick="run('delete')">4. Delete old copies (last step)</button></div>
<pre id="log">Ready.</pre>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDExSOnFbN-wJbT1UFgB-kBs37bEa3KiWc",authDomain:"oryzon-50ea4.firebaseapp.com",databaseURL:"https://oryzon-50ea4-default-rtdb.firebaseio.com",projectId:"oryzon-50ea4"});
const db=firebase.database(),KEYS=['requests','orders','orderRequests','notifications','analytics','bankDetails','warnings'];
const log=m=>{const l=document.getElementById('log');l.textContent+='\n'+m;l.scrollTop=l.scrollHeight};
async function go(){try{await firebase.auth().signInWithEmailAndPassword(em.value.trim(),pw.value);login.style.display='none';app.style.display='block';log('Signed in as '+firebase.auth().currentUser.uid)}catch(e){log('Login failed: '+e.message)}}
async function run(mode){
  log('--- '+mode+' ---');let c=0,s=0,d=0,bad=0;
  try{
    const all=(await db.ref('providers').once('value')).val()||{};
    for(const u of Object.keys(all))for(const k of KEYS){
      const v=all[u]&&all[u][k];if(v===undefined||v===null)continue;
      const t=db.ref('providerPrivate/'+u+'/'+k);
      if(mode==='dry'){log('would copy '+u+'/'+k);continue}
      if(mode==='copy'){if((await t.once('value')).exists()){s++;continue}await t.set(v);c++;log('copied '+u+'/'+k);continue}
      const p=(await t.once('value')).val();
      const same=p!==null&&JSON.stringify(p).length>=JSON.stringify(v).length*0.98;
      if(mode==='verify'){if(!same){bad++;log('MISSING/SMALLER '+u+'/'+k)}continue}
      if(!same){s++;log('KEPT '+u+'/'+k);continue}
      await db.ref('providers/'+u+'/'+k).remove();d++;log('removed old '+u+'/'+k);
    }
    log('Done. copied='+c+' skipped='+s+' deleted='+d+(mode==='verify'?' problems='+bad:''));
  }catch(e){log('ERROR: '+e.message)}
}
</script></body></html>
