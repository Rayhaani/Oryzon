<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Something Big is Coming</title>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    padding:0;
    background:#05060a;
    overflow:hidden;
    font-family:'Montserrat','Segoe UI',sans-serif;
  }

  /* ───────────────────────── AURORA BACKGROUND ───────────────────────── */
  .aurora-stage{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    mix-blend-mode:screen;
    opacity:0.75;
    will-change:transform;
  }
  .blob-1{
    width:60vmax;height:60vmax;
    top:-20vmax;left:-15vmax;
    background:radial-gradient(circle at 30% 30%, #fde08d, transparent 70%);
    animation:drift1 22s ease-in-out infinite;
  }
  .blob-2{
    width:55vmax;height:55vmax;
    bottom:-20vmax;right:-15vmax;
    background:radial-gradient(circle at 60% 40%, #7c3aed, transparent 70%);
    animation:drift2 26s ease-in-out infinite;
  }
  .blob-3{
    width:50vmax;height:50vmax;
    top:20%;right:-20vmax;
    background:radial-gradient(circle at 50% 50%, #06b6d4, transparent 70%);
    animation:drift3 30s ease-in-out infinite;
  }
  .blob-4{
    width:45vmax;height:45vmax;
    bottom:5%;left:-15vmax;
    background:radial-gradient(circle at 50% 50%, #ec4899, transparent 70%);
    animation:drift4 24s ease-in-out infinite;
  }
  .blob-5{
    width:35vmax;height:35vmax;
    top:40%;left:30%;
    background:radial-gradient(circle at 50% 50%, #22c55e, transparent 70%);
    opacity:0.4;
    animation:drift5 18s ease-in-out infinite;
  }

  @keyframes drift1{
    0%,100%{transform:translate(0,0) scale(1) rotate(0deg);}
    33%{transform:translate(10vw,8vh) scale(1.15) rotate(40deg);}
    66%{transform:translate(-5vw,12vh) scale(0.9) rotate(-30deg);}
  }
  @keyframes drift2{
    0%,100%{transform:translate(0,0) scale(1) rotate(0deg);}
    33%{transform:translate(-12vw,-6vh) scale(1.1) rotate(-35deg);}
    66%{transform:translate(6vw,-10vh) scale(0.95) rotate(25deg);}
  }
  @keyframes drift3{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-14vw,10vh) scale(1.2);}
  }
  @keyframes drift4{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(12vw,-8vh) scale(1.15);}
  }
  @keyframes drift5{
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) scale(1.4);}
  }

  /* fine grain texture for a premium film-like feel */
  .grain{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    opacity:0.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* vignette so edges stay dark and text stays readable */
  .vignette{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 35%, rgba(5,6,10,0.75) 100%);
  }

  /* ───────────────────────── SPARKLE PARTICLES ───────────────────────── */
  .sparkle{
    position:absolute;
    border-radius:50%;
    background:#ffffff;
    opacity:0;
    animation:twinkle linear infinite;
  }
  @keyframes twinkle{
    0%{opacity:0; transform:translateY(0) scale(0.5);}
    10%{opacity:1;}
    90%{opacity:0.8;}
    100%{opacity:0; transform:translateY(-40px) scale(1.2);}
  }

  /* ───────────────────────── MAIN CONTENT ───────────────────────── */
  .stage{
    position:relative;
    z-index:2;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .headline{
    font-size:clamp(28px, 7vw, 56px);
    font-weight:800;
    line-height:1.25;
    margin:0;
    letter-spacing:-0.5px;
    background:linear-gradient(90deg,#fde08d,#f472b6,#a78bfa,#38bdf8,#fde08d);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shine 8s linear infinite;
    text-shadow:0 0 60px rgba(253,224,141,0.25);
  }
  @keyframes shine{
    0%{background-position:0% 50%;}
    100%{background-position:300% 50%;}
  }

  /* ───────────────────────── FOOTER ───────────────────────── */
  .footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:3;
    padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    font-size:11px;
    color:rgba(255,255,255,0.4);
  }
  .footer button{
    background:none;
    border:none;
    color:rgba(255,255,255,0.55);
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    text-decoration:underline;
    text-underline-offset:2px;
    padding:4px;
  }

  /* ───────────────────────── LEGAL BOTTOM SHEET ───────────────────────── */
  #legal-overlay{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  #legal-sheet{
    width:100%;
    max-width:520px;
    max-height:80vh;
    background:#111318;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;
    animation:slideUp 0.25s ease;
  }
  @keyframes slideUp{
    from{transform:translateY(100%);}
    to{transform:translateY(0);}
  }
  #legal-sheet h2{
    font-size:16px;
    font-weight:800;
    color:#ffffff;
    margin:0 0 4px;
  }
  #legal-sheet .sub{
    font-size:11.5px;
    color:rgba(255,255,255,0.5);
    margin-bottom:16px;
  }
  #legal-sheet h3{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#94a3b8;
    margin:18px 0 8px;
  }
  #legal-sheet .credit-card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    padding:12px 14px;
    font-size:12px;
    color:rgba(255,255,255,0.7);
    line-height:1.5;
  }
  #legal-close{
    position:absolute;
    top:16px;
    right:16px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    color:rgba(255,255,255,0.7);
    font-size:14px;
    cursor:pointer;
  }
  #legal-sheet{position:relative;}
</style>
</head>
<body>

  <div class="aurora-stage">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-5"></div>
  </div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div id="sparkle-field"></div>

  <div class="stage">
    <h1 class="headline">Something Big is Coming 🔥</h1>
  </div>

  <div class="footer">
    <span>© 2026</span>
    <button onclick="document.getElementById('legal-overlay').style.display='flex'">Legal</button>
  </div>

  <!-- LEGAL BOTTOM SHEET -->
  <div id="legal-overlay" onclick="if(event.target===this) this.style.display='none'">
    <div id="legal-sheet">
      <button id="legal-close" onclick="document.getElementById('legal-overlay').style.display='none'">✕</button>
      <h2>Legal</h2>
      <div class="sub">Third-party credits & licenses</div>

      <h3>Licenses</h3>
      <div class="credit-card">Location data © dr5hn/countries-states-cities-database</div>
    </div>
  </div>

<script>
  // Lightweight CSS-driven sparkle particles
  (function(){
    const field = document.getElementById('sparkle-field');
    const count = 28;
    for (let i = 0; i < count; i++){
      const s = document.createElement('div');
      s.className = 'sparkle';
      const size = Math.random() * 2.5 + 1;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.position = 'fixed';
      s.style.zIndex = '1';
      s.style.animationDuration = (Math.random() * 6 + 5) + 's';
      s.style.animationDelay = (Math.random() * 8) + 's';
      field.appendChild(s);
    }
  })();
</script>

</body>
</html>
